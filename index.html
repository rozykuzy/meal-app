푼다.","물이 끓어오르면 냉동 채소믹스와 다진마늘을 넣고 3분간 끓인다.","두부를 사방 2cm로 썰어 넣고 2분간 더 끓인다.","대파를 넣고 불을 끈다."],"tip":"된장을 덩어리째 넣으면 겉만 짜지니 국물에 완전히 풀고 끓이기 시작한다.","use":{"veg":100,"tofu":1,"arom":10}},{"id":"r_soup_n9","cat":"soup","name":"런천미트김치국","tags":["quick","kr"],"kcal":400,"pro":20,"min":12,"lv":1,"serv":1,"ing":"런천미트 100g, 포기김치 150g, 콩나물 100g, 대파 10cm, 고춧가루 1작은술","steps":["런천미트는 1cm 두께로 썰고 김치는 3cm 폭으로 썬다.","냄비에 기름 1작은술을 두르고 김치와 고춧가루를 넣어 중불에서 2분간 볶는다.","물 500ml를 붓고 런천미트를 넣어 센 불에서 끓이다가, 끓어오르면 중불로 줄여 5분간 더 끓인다.","콩나물을 넣고 뚜껑을 덮지 않은 채 3분간 끓인 뒤 대파를 올려 마무리한다."],"tip":"콩나물을 넣은 뒤 뚜껑을 여닫으면 비린내가 나니 뚜껑은 처음부터 열어 둔다.","use":{"spam":100,"kimchi":150,"beansprout":100,"arom":10}},{"id":"r_snack_n15","cat":"snack","name":"블루베리바나나스무디","tags":["sweet","diet"],"kcal":305,"pro":12,"min":5,"lv":1,"serv":1,"ing":"냉동 블루베리 100g, 바나나 1개, 우유 150ml, 그릭요거트 3큰술(60g), 꿀 1작은술","steps":["바나나는 껍질을 벗겨 서너 토막으로 자르고, 냉동 블루베리는 냉동실에서 바로 꺼내 쓴다.","믹서에 바나나, 블루베리, 우유, 그릭요거트를 함께 넣고 30초 갈아 덩어리가 보이지 않게 한다.","맛을 보고 신맛이 강하면 꿀을 넣어 5초만 더 돌린 뒤 컵에 따른다."],"tip":"바나나가 잘 익어 껍질에 반점이 생긴 것을 쓰면 꿀을 절반만 넣어도 충분히 달다.","use":{"blueberry":100,"banana":1,"milk":150,"greek":45}},{"id":"r_snack_n16","cat":"snack","name":"얼린요거트바크","tags":["sweet","diet"],"kcal":213,"pro":15,"min":130,"lv":2,"serv":2,"ing":"그릭요거트 300g, 냉동 블루베리 80g, 견과류 믹스 20g, 꿀 1큰술","steps":["그릭요거트에 꿀을 넣고 숟가락으로 고르게 섞는다.","납작한 그릇이나 쟁반에 종이호일을 깔고 요거트를 1cm 두께로 넓게 펴 바른다.","냉동 블루베리와 굵게 부순 견과류를 위에 흩뿌리고 손끝으로 살짝 눌러 붙인다.","냉동실에서 2시간 얼린 뒤 종이호일째 들어내 손으로 조각내 바로 먹는다."],"tip":"두껍게 펴면 얼음처럼 딱딱해지니 1cm를 넘기지 않아야 손으로 쪼개진다.","use":{"greek":300,"blueberry":80,"nuts":20}},{"id":"r_snack_n17","cat":"snack","name":"고구마우유","tags":["sweet","quick"],"kcal":346,"pro":8,"min":15,"lv":1,"serv":1,"ing":"고구마 150g, 우유 200ml, 꿀 1작은술, 소금 한 꼬집","steps":["고구마를 씻어 껍질째 젖은 키친타월로 감싸고 전자레인지에서 7분 돌려 젓가락이 쑥 들어갈 때까지 익힌다.","한 김 식힌 고구마의 껍질을 벗겨 우유와 함께 믹서에 넣고 20초 간다.","소금 한 꼬집으로 단맛을 잡고, 부족하면 꿀을 넣어 섞은 뒤 따뜻하게 마신다."],"tip":"밤고구마는 뻑뻑하니 우유를 30ml쯤 더 넣고, 호박고구마면 꿀은 빼도 된다.","use":{"sweet":150,"milk":200}},{"id":"r_snack_n18","cat":"snack","name":"고구마견과볼","tags":["sweet","diet"],"kcal":246,"pro":5,"min":20,"lv":1,"serv":2,"ing":"고구마 250g, 견과류 믹스 20g, 그릭요거트 2큰술(40g), 꿀 1작은술, 시나몬 약간","steps":["고구마를 2cm 두께로 썰어 그릇에 담고 뚜껑을 덮어 전자레인지에서 8분 익힌다.","뜨거울 때 껍질을 벗기고 숟가락 뒷면으로 눌러 알갱이 없이 으깬다.","그릭요거트와 꿀, 잘게 다진 견과류를 넣고 손으로 뭉쳐질 정도까지 반죽한다.","한 숟갈씩 떠서 동그랗게 굴리고 시나몬을 살짝 뿌린 뒤 냉장고에서 10분 굳힌다."],"tip":"덜 식은 상태로 뭉치면 손에 들러붙으니 반죽을 5분쯤 식힌 다음 굴린다.","use":{"sweet":250,"nuts":20,"greek":30}},{"id":"r_snack_n19","cat":"snack","name":"바나나오트쿠키","tags":["sweet","diet"],"kcal":300,"pro":8,"min":25,"lv":2,"serv":2,"ing":"바나나 2개, 퀵오트밀 80g, 견과류 믹스 20g, 시나몬 약간","steps":["잘 익은 바나나를 그릇에 넣고 포크로 눌러 걸쭉한 죽처럼 될 때까지 으깬다.","퀵오트밀과 잘게 부순 견과류, 시나몬을 넣고 숟가락으로 섞은 뒤 5분 두어 오트밀이 수분을 먹게 한다.","에어프라이어 바스켓에 종이호일을 깔고 반죽을 한 숟갈씩 떠 지름 5cm로 납작하게 편다.","170도에서 12분 구운 뒤 바스켓 안에서 5분 식혀 가장자리가 단단해지면 꺼낸다."],"tip":"설탕을 넣지 않아도 바나나 자체로 달지만, 덜 익은 바나나면 꿀 1작은술만 더한다.","use":{"banana":2,"oats":80,"nuts":20}},{"id":"r_snack_n20","cat":"snack","name":"치즈식빵스틱","tags":["sweet","quick"],"kcal":398,"pro":17,"min":12,"lv":1,"serv":1,"ing":"식빵 2장, 모짜렐라 슈레드 50g, 버터 1작은술, 꿀 1작은술","steps":["식빵 한 장의 한쪽 면에 버터를 얇게 바르고 모짜렐라 슈레드를 고르게 올린다.","나머지 식빵을 덮어 손바닥으로 눌러 붙인 다음 3등분으로 길게 자른다.","에어프라이어 180도에서 6분, 겉면이 노릇해질 때까지 굽는다.","꺼내서 1분 식힌 뒤 꿀을 가늘게 뿌려 낸다."],"tip":"치즈가 옆으로 흘러 타지 않게 가장자리 1cm는 비우고 올린다.","use":{"bread":2,"cheese":50}},{"id":"r_snack_n21","cat":"snack","name":"시나몬또띠아칩","tags":["sweet","quick"],"kcal":390,"pro":17,"min":12,"lv":1,"serv":1,"ing":"또띠아 2장, 설탕 1작은술, 시나몬 약간, 그릭요거트 100g, 냉동 블루베리 50g","steps":["또띠아 양면에 물을 아주 살짝 바르고 설탕과 시나몬을 섞어 고르게 뿌린다.","피자 모양으로 8등분해 에어프라이어에 겹치지 않게 펴 담고 175도에서 6분 굽는다.","굽는 동안 냉동 블루베리를 그릇에 담아 전자레인지에서 40초 돌려 살짝 녹인 뒤 포크로 으깬다.","그릭요거트에 으깬 블루베리를 얹어 딥을 만들고, 바삭하게 식은 칩을 찍어 먹는다."],"tip":"꺼낸 직후에는 눅눅해 보여도 3분 식히면 바삭해지니 더 굽지 않는다.","use":{"tortilla":2,"greek":100,"blueberry":50}},{"id":"r_snack_n22","cat":"snack","name":"우유계란푸딩","tags":["sweet"],"kcal":190,"pro":10,"min":30,"lv":2,"serv":2,"ing":"우유 250ml, 계란 2개, 설탕 1.5큰술, 바닐라 약간","steps":["냄비에 우유와 설탕을 넣고 약불에서 저어 김이 오를 때까지만 데운 뒤 불을 끈다.","계란을 거품이 나지 않게 젓가락으로 풀고, 데운 우유를 조금씩 부어 가며 섞는다.","체에 한 번 걸러 알끈을 걸러내고 내열컵 두 개에 나눠 담아 호일로 덮는다.","냄비에 컵 높이 절반까지 물을 붓고 뚜껑을 덮어 약불에서 15분 찐다.","젓가락으로 찔러 맑은 국물이 나오면 꺼내 한 김 식히고 냉장고에서 차게 굳힌다."],"tip":"센 불로 찌면 표면에 구멍이 숭숭 나므로 물이 보글거리지 않을 정도의 약불을 지킨다.","use":{"milk":250,"eggs":2}},{"id":"r_snack_n23","cat":"snack","name":"바나나요거트아이스","tags":["sweet","diet"],"kcal":180,"pro":8,"min":125,"lv":2,"serv":2,"ing":"바나나 2개, 그릭요거트 150g, 견과류 믹스 10g, 꿀 1작은술","steps":["바나나를 2cm 두께로 썰어 통에 펴 담고 냉동실에서 2시간 완전히 얼린다.","얼린 바나나와 그릭요거트, 꿀을 믹서에 넣고 30초씩 끊어 갈면서 벽에 붙은 것을 주걱으로 내려 준다.","부드러운 소프트아이스크림 상태가 되면 그릇에 퍼 담는다.","굵게 부순 견과류를 올려 바로 먹는다."],"tip":"잘 안 갈리면 우유를 1큰술씩만 더한다. 많이 넣으면 얼음물처럼 묽어진다.","use":{"banana":2,"greek":150,"nuts":10}},{"id":"r_snack_n24","cat":"snack","name":"우유호떡","tags":["sweet","kr"],"kcal":333,"pro":9,"min":80,"lv":3,"serv":4,"ing":"밀가루 200g, 우유 130ml, 계란 1개, 드라이이스트 3g, 설탕 3큰술, 견과류 믹스 30g, 식용유 1큰술","steps":["우유를 손등에 댔을 때 미지근한 정도로 데워 드라이이스트와 설탕 1작은술을 풀고 5분 두어 거품이 올라오게 한다.","밀가루와 계란, 소금 한 꼬집을 넣고 손에 붙지 않을 때까지 5분 치댄 뒤 랩을 씌워 따뜻한 곳에서 50분 부풀린다.","남은 설탕에 잘게 다진 견과류와 시나몬을 섞어 소를 만든다.","부푼 반죽을 눌러 가스를 빼고 네 덩이로 나눠 손바닥에 펴서 소를 넣고 오므려 봉한다.","기름 두른 팬에 봉한 쪽을 아래로 놓고 중약불에서 2분 굽다가 뒤집어 주걱으로 납작하게 누른다.","양면이 진한 갈색이 될 때까지 3분 더 구워 낸다."],"tip":"소가 흘러 타지 않게 봉한 자리를 확실히 여미고, 눌러 편 뒤에는 불을 약하게 줄인다.","use":{"milk":130,"eggs":1,"nuts":30}},{"id":"r_brunch_n10","cat":"brunch","name":"바나나우유오트밀","tags":["sweet","diet"],"kcal":451,"pro":14,"min":10,"lv":1,"serv":1,"ing":"퀵오트밀 40g, 우유 200ml, 바나나 1개, 견과류 믹스 10g, 꿀 1작은술","steps":["냄비에 퀵오트밀과 우유를 넣고 중약불에서 저어 가며 3분 끓여 걸쭉하게 만든다.","바나나 절반을 으깨 넣고 30초 더 저은 뒤 불을 끈다.","그릇에 담고 남은 바나나를 어슷하게 썰어 올린 다음 견과류와 꿀을 얹는다."],"tip":"우유는 쉽게 눌어붙으니 냄비 바닥을 계속 긁으며 젓고, 되직해지면 우유를 조금 더 붓는다.","use":{"oats":40,"milk":200,"banana":1,"nuts":10}},{"id":"r_brunch_n11","cat":"brunch","name":"레몬요거트토스트","tags":["sweet","quick"],"kcal":342,"pro":16,"min":8,"lv":1,"serv":1,"ing":"식빵 2장, 그릭요거트 120g, 레몬 1/2개, 꿀 1큰술","steps":["식빵을 마른 팬에 올려 중불에서 앞뒤로 1분씩 구워 겉만 바삭하게 만든다.","그릭요거트에 레몬 껍질을 곱게 갈아 넣고 레몬즙 1작은술과 꿀을 섞는다.","구운 식빵이 한 김 식으면 요거트를 두툼하게 펴 바르고 레몬 껍질을 조금 더 뿌린다."],"tip":"빵이 뜨거울 때 바르면 요거트가 녹아 흘러내리니 2분쯤 식힌 뒤 올린다.","use":{"bread":2,"greek":120,"lemon":1}},{"id":"r_brunch_n12","cat":"brunch","name":"블루베리빵푸딩","tags":["sweet","west"],"kcal":459,"pro":16,"min":20,"lv":2,"serv":1,"ing":"식빵 2장, 계란 1개, 우유 120ml, 냉동 블루베리 60g, 설탕 1큰술, 버터 1작은술","steps":["식빵을 3cm 크기로 깍둑 썰어 그릇에 담는다.","계란을 풀고 우유와 설탕을 섞어 빵 위에 부은 뒤 5분 두어 속까지 적신다.","냉동 블루베리를 그대로 흩뿌려 빵 사이사이에 끼워 넣는다.","팬에 버터를 녹이고 적신 빵을 옮겨 담아 뚜껑을 덮고 약불에서 8분 익힌다.","가운데를 눌러 계란물이 배어나오지 않으면 불을 끄고 2분 뜸 들인다."],"tip":"블루베리는 녹이지 않고 얼린 채로 넣어야 물이 덜 생겨 질척해지지 않는다.","use":{"bread":2,"eggs":1,"milk":120,"blueberry":60}},{"id":"r_brunch_n13","cat":"brunch","name":"고구마치즈토스트","tags":["sweet","quick"],"kcal":536,"pro":17,"min":15,"lv":1,"serv":1,"ing":"식빵 2장, 고구마 150g, 모짜렐라 슈레드 40g, 우유 1큰술, 꿀 1작은술","steps":["고구마를 껍질째 그릇에 담고 뚜껑을 덮어 전자레인지에서 7분 익힌 뒤 껍질을 벗겨 으깬다.","으깬 고구마에 우유와 꿀을 넣고 되직한 크림 정도로 섞는다.","식빵 위에 고구마를 펴 바르고 모짜렐라 슈레드를 덮은 뒤 나머지 식빵을 올린다.","에어프라이어 180도에서 7분 구워 치즈가 녹고 겉이 노릇해지면 반으로 자른다."],"tip":"고구마가 되면 우유를 1큰술 더 넣는다. 너무 묽으면 구울 때 옆으로 새어 나온다.","use":{"bread":2,"sweet":150,"cheese":40,"milk":15}},{"id":"r_brunch_n14","cat":"brunch","name":"바나나또띠아롤","tags":["sweet","quick"],"kcal":329,"pro":12,"min":8,"lv":1,"serv":1,"ing":"또띠아 1장, 바나나 1개, 그릭요거트 3큰술(60g), 견과류 믹스 10g, 시나몬 약간","steps":["마른 팬에 또띠아를 올려 중불에서 앞뒤로 20초씩 데워 잘 말리게 만든다.","또띠아 가운데에 그릭요거트를 펴 바르고 잘게 부순 견과류와 시나몬을 뿌린다.","바나나를 통째로 올려 김밥처럼 단단히 말고 3등분해 자른다."],"tip":"또띠아를 데우지 않고 말면 가장자리가 갈라지니 20초만이라도 팬에 올린다.","use":{"tortilla":1,"banana":1,"greek":45,"nuts":10}},{"id":"r_brunch_n15","cat":"brunch","name":"레몬크레페","tags":["sweet","west"],"kcal":264,"pro":9,"min":20,"lv":2,"serv":2,"ing":"밀가루 70g, 우유 160ml, 계란 1개, 설탕 1큰술, 레몬 1/2개, 버터 1작은술","steps":["그릇에 계란과 설탕을 풀고 우유를 부어 섞은 뒤 밀가루를 체 쳐 넣고 멍울 없이 젓는다.","반죽을 냉장고에 10분 두어 밀가루가 가라앉을 시간을 준다.","팬을 중약불로 달구고 버터를 얇게 두른 뒤 반죽 한 국자를 부어 팬을 돌려 얇게 편다.","가장자리가 들뜨면 뒤집어 30초만 더 구워 접시에 옮기고 남은 반죽도 같은 방법으로 부친다.","설탕을 살짝 뿌리고 레몬즙을 짜 뿌린 뒤 부채꼴로 접어 낸다."],"tip":"첫 장은 팬 온도가 안 맞아 두꺼워지기 쉬우니 연습용으로 여기고 두 번째부터 불을 조절한다.","use":{"milk":160,"eggs":1,"lemon":1}},{"id":"r_brunch_n16","cat":"brunch","name":"블루베리잼","tags":["sweet"],"kcal":86,"pro":1,"min":15,"lv":1,"serv":4,"ing":"냉동 블루베리 250g, 설탕 4큰술, 레몬 1/2개","steps":["냉동 블루베리를 냄비에 넣고 설탕을 뿌려 5분 두면 겉이 녹으면서 물이 배어 나온다.","중불에 올려 끓기 시작하면 약불로 줄이고 주걱으로 저어 가며 8분 졸인다.","알갱이를 주걱 등으로 반쯤 으깨고 레몬즙을 짜 넣어 1분 더 끓인 뒤 불을 끈다.","완전히 식힌 다음 소독한 병에 담아 냉장 보관하고 일주일 안에 먹는다."],"tip":"설탕을 줄이면 덜 걸쭉하고 오래 못 가니, 적게 넣었다면 소량만 만들어 며칠 안에 쓴다.","use":{"blueberry":250,"lemon":1}},{"id":"r_noodle_n21","cat":"noodle","name":"나폴리탄스파게티","tags":["west","quick"],"kcal":660,"pro":22,"min":20,"lv":1,"serv":1,"ing":"스파게티 면 100g, 슬라이스햄 60g, 양파 1/2개, 피망 1/2개, 파스타 소스 100g, 케첩 2큰술, 버터 1큰술, 소금, 후추","steps":["끓는 물 2L에 소금 1큰술을 넣고 스파게티 면을 봉지 표시보다 1분 짧게 삶는다.","면이 익는 동안 햄은 굵게 채 썰고 양파와 피망은 5mm 폭으로 썬다.","팬에 버터를 녹이고 양파를 1분 볶다가 햄과 피망을 넣어 가장자리가 살짝 그을릴 때까지 볶는다.","파스타 소스와 케첩을 넣고 중불에서 1분 끓여 신맛을 날린다.","삶은 면과 면수 3큰술을 넣어 소스가 면에 엉길 때까지 30초 볶고 후추로 마무리한다."],"tip":"케첩은 반드시 팬에서 한 번 끓여야 날것의 신맛이 빠진다.","use":{"pasta":100,"ham":60,"arom":1,"veg":1,"pastasauce":100}},{"id":"r_noodle_n22","cat":"noodle","name":"대게살레몬파스타","tags":["west"],"kcal":700,"pro":28,"min":20,"lv":2,"serv":1,"ing":"스파게티 면 100g, 자숙 대게살 80g, 마늘 4쪽, 레몬 1/2개, 올리브유 2큰술, 소금, 후추","steps":["냄비에 물을 올려 소금을 넣고 스파게티 면을 봉지 표시대로 삶는다.","대게살은 물기를 눌러 짜고 결대로 굵게 찢어 둔다.","팬에 올리브유와 얇게 저민 마늘을 넣고 약불에서 2분, 마늘 가장자리가 연한 갈색이 될 때까지 데운다.","삶은 면과 면수 4큰술을 넣어 센 불에서 흔들어 섞고, 국물이 뽀얗게 엉기면 대게살을 넣는다.","불을 끄고 레몬즙을 짜 넣은 뒤 소금과 후추로 간하고 레몬 껍질을 갈아 올린다."],"tip":"대게살은 마지막에 넣어야 살이 부서지지 않고 단맛이 남는다.","use":{"pasta":100,"crabmeat":80,"arom":4,"lemon":1}},{"id":"r_noodle_n23","cat":"noodle","name":"펜네치즈그라탕","tags":["west"],"kcal":650,"pro":29,"min":25,"lv":2,"serv":1,"ing":"펜네 90g, 파스타 소스 150g, 모짜렐라 슈레드 60g, 우유 50ml, 양파 1/4개, 올리브유 1작은술, 소금, 후추","steps":["펜네를 소금 넣은 끓는 물에 표시 시간보다 2분 짧게 삶아 건진다.","팬에 기름을 두르고 다진 양파를 2분 볶은 뒤 파스타 소스와 우유를 넣어 중불에서 2분 끓인다.","삶은 펜네를 넣고 소스가 골고루 묻게 섞은 다음 소금과 후추로 간한다.","오븐용 그릇에 옮겨 담고 모짜렐라 슈레드를 고르게 덮는다.","200도로 예열한 오븐이나 에어프라이어에서 8분, 치즈에 갈색 점이 생길 때까지 굽는다."],"tip":"펜네를 덜 삶아야 오븐에서 퍼지지 않는다.","use":{"pasta":90,"pastasauce":150,"cheese":60,"milk":50,"arom":1}},{"id":"r_noodle_n24","cat":"noodle","name":"베이컨양배추파스타","tags":["west","quick"],"kcal":700,"pro":20,"min":20,"lv":1,"serv":1,"ing":"스파게티 면 100g, 베이컨 40g, 양배추 100g, 마늘 3쪽, 올리브유 1큰술, 소금, 후추","steps":["양배추는 한입 크기로 썰고, 스파게티 면은 소금 넣은 끓는 물에 삶되 마지막 2분에 양배추를 함께 넣는다.","그동안 팬에 올리브유와 저민 마늘, 1cm 폭으로 썬 베이컨을 넣고 중약불에서 3분 볶아 기름을 낸다.","건진 면과 양배추, 면수 4큰술을 팬에 넣고 센 불에서 40초 볶아 기름과 면수를 섞는다.","후추를 넉넉히 갈아 넣고 소금으로 간을 맞춘다."],"tip":"베이컨에 소금기가 있으니 간은 마지막에 맛을 보고 더한다.","use":{"pasta":100,"bacon":40,"veg":100,"arom":3}},{"id":"r_noodle_n25","cat":"noodle","name":"참치올리브파스타","tags":["west","quick"],"kcal":660,"pro":33,"min":15,"lv":1,"serv":1,"ing":"스파게티 면 100g, 참치캔 100g, 블랙올리브 10알, 마늘 3쪽, 레몬 1/4개, 올리브유 1큰술, 소금, 후추","steps":["스파게티 면을 소금 넣은 끓는 물에 삶는 동안 참치캔은 기름을 따라 버리고 올리브는 반으로 썬다.","팬에 올리브유와 저민 마늘을 넣고 약불에서 2분 데워 향을 올린다.","참치와 올리브를 넣어 30초만 뒤적이고, 삶은 면과 면수 3큰술을 부어 센 불에서 섞는다.","불을 끄고 레몬즙을 짜 넣은 뒤 후추로 마무리한다."],"tip":"참치는 오래 볶으면 퍽퍽해지니 데운다는 느낌으로만 섞는다.","use":{"pasta":100,"tuna":100,"arom":3,"lemon":1}},{"id":"r_noodle_n26","cat":"noodle","name":"아라비아타파스타","tags":["west"],"kcal":730,"pro":23,"min":20,"lv":1,"serv":1,"ing":"스파게티 면 100g, 비엔나 소시지 60g, 파스타 소스 150g, 마늘 4쪽, 페페론치노 3개, 올리브유 1큰술, 소금","steps":["스파게티 면을 소금 넣은 끓는 물에 표시 시간대로 삶는다.","소시지는 어슷하게 반으로 자르고 마늘은 저민다.","팬에 올리브유, 마늘, 부순 페페론치노를 넣고 약불에서 2분 볶아 매운 향을 기름에 옮긴다.","소시지를 넣어 1분 굽고 파스타 소스를 부어 중불에서 3분, 소스가 살짝 걸쭉해질 때까지 끓인다.","삶은 면과 면수 3큰술을 넣어 1분 버무리고 간을 맞춘다."],"tip":"매운맛이 부담되면 페페론치노 씨를 털어내고 껍질만 넣는다.","use":{"pasta":100,"sausage":60,"pastasauce":150,"arom":4}},{"id":"r_meat_n26","cat":"meat","name":"허브크러스트양갈비","tags":["west"],"kcal":980,"pro":51,"min":35,"lv":3,"serv":1,"ing":"양갈비(프렌치랙) 250g, 감자 150g, 빵가루 2큰술, 다진 마늘 1큰술, 파슬리 1큰술, 홀그레인 머스터드 1큰술, 올리브유 1큰술, 소금, 후추","steps":["양갈비는 냉장고에서 꺼내 20분 두어 찬기를 빼고 소금과 후추를 양면에 고루 뿌린다.","감자는 한입 크기로 썰어 기름·소금에 버무려 오븐 팬 한쪽에 미리 깔아 둔다.","달군 팬에 기름을 두르고 양갈비 겉면을 면마다 1분씩 굴려가며 진한 갈색이 나게 지진다.","빵가루에 다진 마늘, 파슬리, 올리브유 1작은술을 섞어 축축한 상태로 만든다.","지진 양갈비 살 쪽에 머스터드를 얇게 바르고 허브 빵가루를 손으로 눌러 붙인다.","200도 오븐이나 에어프라이어에서 8분 구운 뒤 꺼내어 5분 쉬게 두고 갈빗대 사이를 자른다."],"tip":"구운 뒤 5분 쉬게 두어야 자를 때 육즙이 흘러나오지 않는다.","use":{"lamb":250,"potato":150}},{"id":"r_meat_n27","cat":"meat","name":"소등심파히타","tags":["west"],"kcal":800,"pro":42,"min":25,"lv":2,"serv":1,"ing":"소등심(구이용) 150g, 또띠아 2장, 양파 1/2개, 피망 1개, 모짜렐라 슈레드 30g, 파프리카가루 1작은술, 올리브유 1큰술, 소금, 후추","steps":["소등심은 1cm 두께로 길게 썰어 소금, 후추, 파프리카가루를 뿌려 5분 둔다.","양파와 피망은 고기와 비슷한 굵기로 길게 썬다.","센 불로 달군 팬에 기름을 두르고 고기를 한 겹으로 펴 1분 30초 굽고 뒤집어 1분 더 구워 접시에 뺀다.","같은 팬에 양파와 피망을 넣고 2분, 가장자리가 그을릴 때까지 볶은 뒤 고기를 다시 넣어 섞는다.","마른 팬에 또띠아를 앞뒤로 20초씩 데우고 속을 올린 다음 치즈를 뿌려 말아 먹는다."],"tip":"고기를 팬에 가득 넣으면 물이 생기니 한 번에 한 겹만 굽는다.","use":{"sirloin":150,"tortilla":2,"arom":1,"veg":6,"cheese":30}},{"id":"r_meat_n28","cat":"meat","name":"한우안심꼬치구이","tags":["west"],"kcal":500,"pro":40,"min":25,"lv":2,"serv":1,"ing":"한우 안심(구이용) 180g, 양파 1/2개, 파프리카 1/2개, 버터 1큰술, 다진 마늘 1작은술, 소금, 후추","steps":["안심은 3cm 정육면체로 썰어 소금과 후추를 뿌리고 상온에 10분 둔다.","양파와 파프리카도 고기와 비슷한 크기로 썰어 꼬치에 고기와 번갈아 꽂는다.","센 불로 달군 팬에 기름을 얇게 두르고 꼬치를 올려 한 면씩 1분 30초, 네 면을 돌려가며 굽는다.","불을 중약으로 낮추고 버터와 다진 마늘을 넣어 녹은 버터를 숟가락으로 고기에 끼얹으며 1분 익힌다.","불을 끄고 접시에 옮겨 3분 두었다가 낸다."],"tip":"안심은 속이 분홍빛일 때 가장 부드러우니 총 6분을 넘기지 않는다.","use":{"tenderloin":180,"arom":1,"veg":1}},{"id":"r_meat_n29","cat":"meat","name":"허니머스터드폭찹","tags":["west"],"kcal":650,"pro":37,"min":25,"lv":2,"serv":1,"ing":"돼지 목살(구이용) 180g, 양파 1/2개, 머스터드 1큰술, 꿀 1큰술, 다진 마늘 1작은술, 올리브유 1큰술, 소금, 후추","steps":["목살은 2cm 두께로 준비해 가장자리 힘줄에 2cm 간격으로 칼집을 넣고 소금과 후추를 뿌린다.","머스터드, 꿀, 다진 마늘, 물 1큰술을 섞어 소스를 만든다.","양파는 굵게 채 썰어 고기를 굽고 난 팬에 넣고 기름을 머금을 때까지 2분 볶는다.","달군 팬에 기름을 두르고 목살을 중강불에서 3분 구워 한 면에 갈색을 낸 뒤 뒤집어 2분 더 굽는다.","불을 약하게 줄이고 소스를 부어 고기를 굴려가며 2분, 소스가 반으로 졸아 윤이 날 때까지 조린다.","도마에 옮겨 3분 쉬게 둔 다음 결 반대로 썰어 남은 소스를 끼얹는다."],"tip":"꿀이 들어간 소스는 잘 타므로 반드시 불을 줄인 뒤에 넣는다.","use":{"porkneck":180,"arom":1}},{"id":"r_meat_n30","cat":"meat","name":"레몬버터치킨스테이크","tags":["west"],"kcal":540,"pro":37,"min":25,"lv":2,"serv":1,"ing":"냉동 닭다리살(정육) 200g, 레몬 1/2개, 버터 1큰술, 마늘 3쪽, 소금, 후추","steps":["닭다리살은 해동해 물기를 닦고 두꺼운 부분에 칼집을 넣어 두께를 고르게 편 뒤 소금과 후추를 뿌린다.","기름 없이 달군 팬에 껍질이 아래로 가게 올리고 중불에서 6분, 껍질이 바삭해질 때까지 누르며 굽는다.","뒤집어 3분 굽고 팬 한쪽에 버터와 저민 마늘을 넣어 향을 낸다.","녹은 버터를 숟가락으로 고기 위에 끼얹으며 1분 더 익힌다.","불을 끄고 레몬즙을 짜 넣어 팬을 흔들어 섞은 다음 썰어 담는다."],"tip":"껍질에서 나온 기름으로 구우면 따로 기름을 두르지 않아도 된다.","use":{"thigh":200,"lemon":1,"arom":3}},{"id":"r_meat_n31","cat":"meat","name":"함박스테이크","tags":["west"],"kcal":400,"pro":20,"min":30,"lv":2,"serv":2,"ing":"다진 소고기 150g, 다진 돼지고기 150g, 식빵 1장, 우유 50ml, 양파 1개, 계란(대란) 1개, 식용유 1큰술, 케첩 2큰술, 우스터소스 1큰술, 소금, 후추","steps":["양파를 잘게 다져 기름 두른 팬에 5분 볶아 투명해지면 접시에 펼쳐 식힌다.","식빵은 가장자리를 떼고 우유에 적셔 손으로 으깬다.","볼에 고기, 식은 양파, 적신 식빵, 계란, 소금, 후추를 넣고 끈기가 생길 때까지 3분 치댄다.","반죽을 둘로 나눠 두께 2cm 타원으로 빚고 가운데를 손가락으로 눌러 오목하게 만든다.","달군 팬에 기름을 두르고 중불에서 한 면 4분씩 구운 뒤 물 3큰술을 붓고 뚜껑을 덮어 5분 찐다.","고기를 꺼낸 팬에 케첩과 우스터소스를 넣어 1분 졸여 소스를 만들고 위에 끼얹는다."],"tip":"가운데를 눌러 두면 익으면서 부풀어 올라 모양이 평평하게 잡힌다.","use":{"beef":150,"pork":150,"bread":1,"milk":50,"arom":1,"eggs":1}},{"id":"r_brunch_n17","cat":"brunch","name":"베이컨감자해시브라운","tags":["west"],"kcal":600,"pro":18,"min":25,"lv":2,"serv":1,"ing":"감자 300g, 베이컨 40g, 계란(대란) 1개, 식용유 1큰술, 소금, 후추","steps":["감자는 껍질을 벗겨 굵게 채 썰고 찬물에 2분 헹궈 전분을 뺀 뒤 면포로 물기를 꽉 짠다.","베이컨은 1cm 폭으로 썰어 팬에 3분 볶아 기름을 내고 감자에 섞어 소금과 후추로 간한다.","같은 팬에 기름을 두르고 감자를 넓게 펴 눌러 붙인 뒤 중약불에서 7분 굽는다.","접시를 덮어 뒤집어 팬에 다시 밀어 넣고 반대면을 6분 구워 바삭하게 만든다.","빈 자리에 계란을 깨 넣어 반숙으로 부치고 해시브라운 위에 올린다."],"tip":"물기를 제대로 짜야 감자가 눌어붙지 않고 한 장으로 붙는다.","use":{"potato":300,"bacon":40,"eggs":1}},{"id":"r_brunch_n18","cat":"brunch","name":"햄치즈퀘사디아","tags":["west","quick"],"kcal":530,"pro":26,"min":15,"lv":1,"serv":1,"ing":"또띠아 2장, 슬라이스햄 60g, 모짜렐라 슈레드 60g, 양파 1/4개, 머스터드 1작은술, 후추","steps":["햄은 굵게 채 썰고 양파는 최대한 얇게 썬다.","또띠아 한 장에 머스터드를 얇게 바르고 치즈 절반, 햄, 양파, 남은 치즈 순으로 올린다.","나머지 또띠아를 덮고 기름 없이 달군 팬에 올려 약불에서 3분, 뒤집어 3분 굽는다.","도마로 옮겨 1분 식힌 뒤 피자처럼 네 조각으로 자른다."],"tip":"치즈를 위아래로 나눠 깔면 속 재료가 붙어 자를 때 쏟아지지 않는다.","use":{"tortilla":2,"ham":60,"cheese":60,"arom":1}},{"id":"r_brunch_n19","cat":"brunch","name":"에그마요샌드위치","tags":["west","lunch"],"kcal":630,"pro":25,"min  5분 담갔다가 물기를 완전히 닦는다.","동태살은 물기를 눌러 닦고 소금과 후추를 뿌린 뒤 밀가루를 얇게 묻힌다.","밀가루 40g에 계란과 우유를 섞어 묽은 반죽을 만든다.","160도 기름에 감자를 5분 튀겨 건지고, 기름을 180도로 올려 다시 2분 튀겨 바삭하게 만든다.","생선에 반죽을 입혀 180도 기름에 넣고 4분, 겉이 진한 노란색이 될 때까지 튀긴다.","기름을 뺀 뒤 감자와 생선에 소금을 뿌려 함께 담는다."],"tip":"감자는 두 번 튀겨야 속은 포슬하고 겉은 바삭해진다.","use":{"whitefish":150,"potato":250,"eggs":1,"milk":50}},{"id":"r_sea_n22","cat":"sea","name":"갈치뫼니에르","tags":["west"],"kcal":440,"pro":34,"min":20,"lv":2,"serv":1,"ing":"흰살생선(갈치) 180g, 우유 100ml, 밀가루 2큰술, 버터 1.5큰술, 마늘 2쪽, 레몬 1/2개, 소금, 후추","steps":["갈치는 토막 내어 우유에 10분 담가 두었다가 건져 물기를 꼼꼼히 닦는다.","소금과 후추를 뿌리고 밀가루를 얇게 입힌 뒤 여분은 털어 낸다.","팬에 버터 1큰술을 녹여 거품이 잦아들면 갈치를 올리고 중불에서 3분 굽는다.","뒤집어 2분 굽고 남은 버터와 저민 마늘을 넣어 녹은 버터를 생선에 끼얹는다.","불을 끄고 레몬즙을 팬에 둘러 소스를 만들어 생선 위에 부어 낸다."],"tip":"우유에 잠깐 담그면 비린내가 빠지고 살이 부드러워진다.","use":{"whitefish":180,"milk":100,"arom":2,"lemon":1}},{"id":"r_sea_n23","cat":"sea","name":"오징어링튀김","tags":["west","anju"],"kcal":620,"pro":41,"min":25,"lv":2,"serv":1,"ing":"냉동 오징어(몸통) 200g, 튀김가루 50g, 계란(대란) 1개, 찬물 60ml, 튀김기름 3컵, 레몬 1/4개, 소금, 후추","steps":["오징어 몸통은 해동해 껍질을 벗기고 1.5cm 폭 링으로 썰어 키친타월로 물기를 완전히 닦는다.","소금과 후추를 뿌리고 튀김가루 1큰술을 먼저 묻혀 표면을 마르게 한다.","남은 튀김가루에 계란과 찬물을 섞어 묽은 반죽을 만들고 오징어를 담근다.","180도 기름에 몇 개씩 나눠 넣고 1분 30초, 옅은 갈색이 될 때까지만 튀긴다.","체에 건져 기름을 빼고 소금을 뿌린 뒤 레몬을 곁들인다."],"tip":"물기가 남으면 기름이 튀고, 오래 튀기면 고무처럼 질겨진다.","use":{"squid":200,"eggs":1,"lemon":1}},{"id":"r_salad_n7","cat":"salad","name":"감자샐러드","tags":["west","lunch"],"kcal":285,"pro":9,"min":25,"lv":2,"serv":2,"ing":"감자 300g, 계란(대란) 1개, 슬라이스햄 40g, 오이 1/2개, 양파 1/4개, 마요 2큰술, 소금, 후추","steps":["감자는 껍질을 벗겨 3cm로 썰고 계란과 함께 소금 넣은 물에 15분 삶아 감자가 포크로 쉽게 갈라지면 건진다.","오이는 얇게 썰어 소금 약간에 5분 절였다가 물기를 짜고, 양파는 다져 찬물에 헹군다.","햄은 잘게 썰고 삶은 계란은 껍질을 까 굵게 다진다.","뜨거운 감자를 포크로 반쯤 으깨 김을 날린 뒤 완전히 식힌다.","식은 감자에 나머지 재료와 마요를 넣어 섞고 소금과 후추로 간한다."],"tip":"감자가 뜨거울 때 마요를 넣으면 기름이 분리되니 반드시 식혀서 섞는다.","use":{"potato":300,"eggs":1,"ham":40,"veg":1,"arom":1}},{"id":"r_salad_n8","cat":"salad","name":"콥샐러드","tags":["west","diet"],"kcal":490,"pro":15,"min":20,"lv":1,"serv":1,"ing":"샐러 function applyTierSwap(mid){

/* 몇 번째 주인가 — 월요일을 주의 시작으로 본다.
   기준을 여기 하나만 두어야 화면마다 다른 주를 가리키는 일이 없다. */
const WEEK0 = "2026-01-05";              // 월요일
function weekIndex(dateS){
  const days = Math.round((parseD(dateS) - parseD(WEEK0)) / 86400000);
  return Math.floor(days / 7);
}
function assignMenu(slot, d, wk){
  const sch=(S.schedule&&S.schedule[slot])||[];
  if(!sch[d]) return null;
  /* 이번 주 안에서 이 끼니가 몇 번째인지 + 지금까지 지나온 주만큼 앞으로.
     주를 안 세면 요일만 남아 일곱 칸을 영원히 맴돈다 — 그게 '매주 같은 밥'의 정체였다. */
  let k=0; for(let i=0;i<d;i++) if(sch[i]) k++;
  const perWeek = (sch.filter(Boolean).length) || 1;
  k += (wk==null ? weekIndex(todayStr()) : wk) * perWeek;
  const pool=POOLS[slot]; if(!pool||!pool.length) return null;
  const off=(S.shuffle&&S.shuffle[slot])||0;
  for(let j=0;j<pool.length;j++){                      // 제외 재료 메뉴는 건너뛰고 다음 후보로
    const cand=applyTierSwap(pool[(k+off+j) % pool.length]);
    if(!menuUsesAvoided(cand)) return cand;
  }
  return applyTierSwap(pool[(k+off) % pool.length]);   // 전부 제외되면 원래 메뉴(빈 끼니 방지)
}
function menuTierMin(id){
  let t=MENU_TIERMIN[id]||20;
  const m=MEALS[id]; if(m) for(const ing in (m.use||{})){ const it=ITEMS[ing]; if(it&&it.tierMin) t=Math.max(t,it.tierMin); }
  return t;
}
function customOf(d,slot){
  const id=S.custom&&S.custom[d+"|"+slot];
  if(id && MEALS[id] && (MENU_SLOTS[id]||[]).includes(slot) && menuTierMin(id)<=(S.tier||20) && !menuUsesAvoided(id)) return id;
  return null; // 커스텀이 없거나, 티어 부족·제외 재료 포함이면 자동으로
}
function planFor(d, wk){
  const p={};
  for(const slot of SLOT_ORDER){
    if(!(S.schedule[slot]&&S.schedule[slot][d])){ p[slot]=null; continue; }
    p[slot]=customOf(d,slot)||assignMenu(slot,d,wk);
  }
  return p;
}

function slotCandidates(slot){

}
function dayKcalCeil(d){ return (S.kcalCap||DAILY_KCAL_CAP); } // 사용자 설정 하루 상한; 끼니 거를수록 남은 끼니 여유↑

function dayKcalFloor(d){ return Math.round(dayKcalCeil(d) * DAILY_KCAL_FLOOR / DAILY_KCAL_CAP); }
function otherSlotsKcal(d, exceptSlot){
  const p=planFor(d); let k=0;

function menuAvailable(d, slot, id){

  if(need>(S.tier||20)) return {ok:false, reason:(TIERS[need]?TIERS[need].name:need+"만")+" 수준부터"};
  if(menuUsesAvoided(id)) return {ok:false, reason:"제외 재료 포함"};
  const dayK=otherSlotsKcal(d,slot)+MEALS[id].kcal;
  if(dayK>dayKcalCeil(d)) return {ok:false, reason:"칼로리 초과"};
  return {ok:true};
}

/* ── 비용: 메뉴 원가는 ITEMS 단가에서 계산 → 스케줄×티어로 월 예상 식비 산출 ── */
function menuCost(mid){
  const m=MEALS[mid]; if(!m) return 0; if(m.fixedCost) return m.fixedCost;
  let c=0; for(const id in (m.use||{})){ const it=ITEMS[id]; if(it) c+=(it.price/it.pack)*m.use[id]; }
  return c;
}
function weeklyMealCost(){
  /* 주마다 메뉴가 달라지므로 한 주만 재면 예산이 주 단위로 출렁인다.
     앞으로 네 주를 평균 내어 '요즘 이 식단은 한 주에 얼마'를 낸다. */
  const w0=weekIndex(todayStr());
  let c=0;
  for(let w=0; w<4; w++)
    for(let d=0;d<7;d++){ const p=planFor(d, w0+w); for(const slot of SLOT_ORDER){ if(p[slot]) c+=menuCost(p[slot]); } }
  c/=4;
  return c;
}
/* 신선식품 한 번 채우는 값(팩) — 계란 한 판, 두부 한 묶음처럼 쪼개 살 수 없는 단위 */
function freshRoundCost(){ return calc("frc", () => {
  const f=needForDays(BUY_FRESH_DAYS); let c=0;
  for(const id in f){ const it=ITEMS[id]; if(it&&it.group==="fresh") c+=Math.ceil(f[id]/it.pack)*it.price; }
  return Math.round(c);
}); }
/* n일을 실제로 사면 얼마인가 — 그램이 아니라 팩으로 센다.
   몰아서 사는 것은 n일치를 한 번에, 신선식품은 7일치씩 나눠 사게 된다. */
/* n일을 나려면 신선식품 장을 몇 번 보게 되는가 — 반 번은 없다 */
function freshRounds(n){ return 1 + Math.max(0, Math.ceil((n-BUY_FRESH_DAYS)/BUY_FRESH_DAYS)); }
function packCostForDays(n){ return calc("pc"+n, () => {
  const need=needForDays(n); let c=0;
  for(const id in need){ const it=ITEMS[id]; if(!it||it.group==="fresh") continue;
    c+=Math.ceil(need[id]/it.pack)*it.price; }
  return Math.round(c + freshRoundCost()*freshRounds(n));
}); }
function monthlyEstimate(){ // 식재료비(그로서리)만 — 외식·구독 등 재량은 별도
  /* 계산대에서 낼 돈으로 적는다. 이론 원가를 적으면 첫 장부터 예산이 어긋난다.
     100원 단위로 굴리지 않는다 — 예산 카드의 금액과 10원이라도 달라 보이면 안 된다. */
  return packCostForDays(30);
}
/* 예산과 메뉴 수준을 갈라 놓는다. 사용자가 정하는 것은 한 달 식재료비 하나뿐이고,
   메뉴 수준은 그 예산을 지금 내 끼니 수로 나눈 값에서 앱이 고른다. */
function tierBudget(){ return +S.budget || (S.tier||20)*10000; }
function perMealBudget(){ const n=mealsPerWeek(); return n ? tierBudget()/(n*4.3) : 0; }
function fitTier(budget){
  let best=TIER_KEYS[0];
  for(const t of TIER_KEYS){ if(estimateForTier(t)<=budget) best=t; else break; }
  return best;
}
function autoFitTier(){
  if(S.tierAuto===false) return null;
  const want=fitTier(tierBudget());
  if(want===S.tier) return null;
  const prev=S.tier; S.tier=want;
  return {prev, now:want};
}
function paceTier(){
  const d=parseD(todayStr());
  const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const gone=d.getDate(), leftDays=last-gone+1;
  if(leftDays<=0) return null;
  /* 한 달치를 몰아서 사는 앱이라 달 초에는 지출이 한쪽으로 쏠린다. */
  if(gone<7) return null;
  const leftWon=tierBudget()-monthSpentSplit().total;
  if(leftWon<=0) return {t:TIER_KEYS[0], leftWon, leftDays};
  const monthlyEquiv=leftWon/(leftDays/last);
  return {t:fitTier(monthlyEquiv), leftWon, leftDays};
}
/* 아직 예산을 정하지 않은 사람에게는 '이 시간표로 실제 가능한 최소'를 보여 준다.
   숫자를 손으로 박아 두면 재료값이나 계산 기준이 바뀔 때 그 값만 홀로 남아,

  const 최소=Math.ceil(estimateForTier(TIER_KEYS[0])/10000)*10000;
  if(S.budget!==최소){ S.budget=최소; S.tierAuto=true; autoFitTier(); }
}
function setBudget(v){
  let raw=String(v==null?"":v).replace(/[^0-9]/g,"");
  let n=+raw||0; if(n>0 && n<=300) n*=10000;
  const won=Math.max(50000, Math.min(3000000, Math.round(n/10000)*10000));
  const prevB=tierBudget(), prevT=S.tier, prevA=S.tierAuto, prevSet=S.budgetSet, fc0=monthForecast().total;
  S.budget=won; S.tierAuto=true; S.budgetSet=true;
  const ch=autoFitTier(); render();
  toast("한 달 식재료비 "+fmt(won)+(ch?" · 메뉴 "+TIERS[ch.now].name:"")+fcDelta(fc0),
    ()=>{ S.budget=prevB; S.tier=prevT; S.tierAuto=prevA; S.budgetSet=prevSet; });
}

function estimateForTier(t){
  /* 잠깐 다른 수준으로 재는 자리 — 캐시는 '상태가 안 변한다'를 전제하므로 여기선 끈다 */
  const cur=S.tier, keep=CALC; CALC=null;

/* 내 식단이 쓰는 재료 — 장 보는 기간과 같은 눈으로 본다.
   전에는 여기만 '이번 한 주'를 보고 [주문] 목록은 '오늘부터 30일'을 봤다.
   주마다 메뉴가 같을 때는 두 값이 같아서 문제가 안 됐지만, 이제는 3주 뒤에 쓰는 재료가
   한 화면에서는 '쓰는 것', 다른 화면에서는 '안 쓰는 것'이 된다.
   기간을 인자로 받아 한 곳에서 센다 — 세는 곳이 둘이면 반드시 갈라진다. */
function usedItemIds(days){
  const n = days || BUY_BULK_DAYS;
  return calc("uid"+n, () => new Set(Object.keys(needForDays(n))));
}
/* 오늘부터 n일 동안 내가 짠 식단이 쓰는 재료 양(거른 끼니 제외, 커스텀·인원수 반영) */
function needForDays(n){ return calc("nd"+n, () => {
  const need={}, t=todayStr();
  for(let i=0;i<n;i++){ const dS=addDays(t,i);
    for(const [slot,mid] of slotsOf(dS)){
      if(S.skips.includes(dS+"|"+slot)) continue;
      const u=MEALS[mid].use||{}; for(const id in u) need[id]=(need[id]||0)+u[id]; } }
  return need;
}); }
/* 🛒 지금 살 것 — 화면에 보이는 그 목록 그대로를 만든다.
   장 보는 리듬에 맞춰 두 묶음으로 나눈다.
     · 몰아서(bulk) — 냉동육·쌀·김치처럼 팩이 커서 한 번에 사는 것 → 한 달치로 본다
     · 신선(fresh)  — 계란·두부·채소·우유 → 다음 7일치로 본다
   한 달치를 7일 기준으로 재면 "이번 주엔 안 사도 됨"이 되어 정작 장 볼 때 빠진다.
   반대로 신선식품을 한 달치로 재면 상해서 버리게 된다. 그래서 기준을 나눴다. */
const BUY_BULK_DAYS = 30, BUY_FRESH_DAYS = 7;
/* 언제 다시 사는가 — 다 떨어지고 나서가 아니라, 떨어지기 조금 전에.
   사고 나서 이만큼 남을 때까지는 목록에 다시 뜨지 않는다(30일치 → 열흘 남을 때 다시). */
const REORDER_DAYS = { bulk: 10, fresh: 3 };
const FREE_SHIP = { bulk:{won:19800, name:"쿠팡 무료배송"}, fresh:{won:15000, name:"로켓프레시 무료배송"} };
function buyPlan(){ return calc("bp", () => {
  const need = { bulk:needForDays(BUY_BULK_DAYS), fresh:needForDays(BUY_FRESH_DAYS) };
  const out = { bulk:[], fresh:[] };
  for(const id in ITEMS){
    const it=ITEMS[id], kind = it.group==="fresh" ? "fresh" : "bulk";
    const want = need[kind][id]||0; if(want<=0) continue;          // 내 식단이 안 쓰는 재료는 아예 안 띄운다
    const my=myStockOf(id), have=stockOf(id)+my.qty;
    const short=want-have; if(short<=0) continue;
    /* 아직 버티는 것은 지금 살 것이 아니다.
       이 줄이 없으면 30일 창이 하루씩 밀릴 때마다 하루치 모자람이 새로 생기고,
       그램이 조금 모자라도 팩은 통째로 사야 해서 매일 한 팩씩 더 사라고 하게 된다.
       버티는 것들은 아래 [나중에 사도 되는 것]이 언제쯤 사면 되는지 알려 준다. */
    if(have>0 && daysLeft(id)>REORDER_DAYS[kind]) continue;
    const lv=itemState(id).level;
    out[kind].push({ id, want, have, short, packs:Math.ceil(short/it.pack), cost:Math.ceil(short/it.pack)*it.price,
      급함: lv==="crit"||lv==="none", 곧: lv==="serious",
      myNote:(my.has&&!my.qty)?my.note:"" });
  }
  const rank=x=> x.급함?0 : x.곧?1 : 2;
  const srt=(a,b)=> rank(a)-rank(b) || b.cost-a.cost;
  out.bulk.sort(srt); out.fresh.sort(srt);
  return out;
}); }
/* 지금은 안 사도 되는 것 — 언제쯤 다시 사면 되는지 순서로 */
function buyLater(){
  const p=buyPlan(), buying=new Set([...p.bulk, ...p.fresh].map(x=>x.id));
  const out=[];
  for(const id of usedItemIds()){ if(buying.has(id)||!ITEMS[id]) continue;
    out.push({id, dl:daysLeft(id)}); }
  return out.sort((a,b)=>a.dl-b.dl);
}

  return PANTRY_WORDS.some(p=>s.includes(normIng(p))); }
/* 레시피는 재료가 글로만 적혀 있다 — 앱이 아는 재료로 옮겨 둔다(한 번만 하고 기억). */
const RKEYS = new Map();
function recipeKeys(r){
  if(RKEYS.has(r.id)) return RKEYS.get(r.id);
  /* 레시피가 이미 구조화된 재료를 갖고 있으면 글을 다시 짐작하지 않는다.
     짐작은 사람이 어떻게 적었느냐에 흔들린다 — 그래서 값을 미리 정해 둔다. */
  if(r.use){ const v={keys:Object.keys(r.use), unknown:[]}; RKEYS.set(r.id, v); return v; }
  const 조각 = String(r.ing||"").split(/[,·]/)
    .map(x=>x.replace(/[0-9]+([./][0-9]+)?\s*(g|kg|ml|L|개|공기|큰술|작은술|컵|장|모|캔|줌|송이|팩|봉|쪽|알|마리|단|스푼|T|t)?/gi,"").trim())
    .filter(Boolean);
  const keys=new Set(), unknown=[];
  for(const w of 조각){ const k=resolveItemKey(w);
    if(k) keys.add(k); else if(!isPantryWord(w)) unknown.push(w); }
  const v={keys:[...keys], unknown};
  RKEYS.set(r.id, v); return v;
}
/* 추천 후보 하나 — 식단 메뉴든 레시피든 같은 모양으로 다룬다 */
function candidatesFor(urgentKeys){
  const have=haveKeySet(), urg=new Set(urgentKeys||[]);
  const out=[];
  for(const mid in MEALS){
    if(menuUsesAvoided(mid)) continue;
    const u=MEALS[mid].use||{}, keys=Object.keys(u); if(!keys.length) continue;
    const missing=keys.filter(k=>!have.has(k));
    out.push({ src:"meal", id:mid, name:MEALS[mid].name, kcal:MEALS[mid].kcal,
      keys, missing, hits:keys.filter(k=>urg.has(k)), cost:menuCost(mid) });
  }
  for(const r of (typeof RECIPES!=="undefined"?RECIPES:[])){
    const {keys, unknown}=recipeKeys(r); if(!keys.length) continue;
    const missing=keys.filter(k=>!have.has(k));
    out.push({ src:"recipe", id:r.id, name:r.name, kcal:r.kcal,
      keys, missing, hits:keys.filter(k=>urg.has(k)), unknown, cost:0 });
  }
  return out;
}
/* 앱 전체가 쓰는 하나의 추천 순서. 화면마다 따로 적으면 곧 서로 다른 추천을 하게 된다. */
function rankByPantry(list){
  const 칸 = x => x.missing.length===0 ? 0 : (x.missing.length<=2 ? 1 : 2);
  return list.slice().sort((a,b)=>
       칸(a)-칸(b)                                   // ① 가진 것만으로 → ② 한두 가지만 더
    || a.missing.length-b.missing.length
    || b.hits.length-a.hits.length                   // ③ 곧 상할 재료를 많이 쓰는 것
    || (a.unknown?a.unknown.length:0)-(b.unknown?b.unknown.length:0)
    || a.cost-b.cost                                 // ④ 그다음에야 값·식단
    || String(a.name).localeCompare(String(b.name)));
}
function makeableMenus(){ return calc("mm", () => {
  const my=myResolvedKeys();
  return Object.keys(MEALS).filter(id=>{
    const u=MEALS[id].use||{}; const keys=Object.keys(u); if(!keys.length) return false;
    /* 내 재료로 갖고 있는 것은 양을 셀 수 없어도 '있다'로 친다 —
       [레시피] 탭이 이미 그렇게 세고 있다(haveKeySet). 두 화면이 다르게 말하면 안 된다. */
    return keys.every(ing=>stockOf(ing)+myStockOf(ing).qty >= u[ing]*0.9 || my.has(ing));
  }).sort((a,b)=>MEALS[b].pro-MEALS[a].pro);
}); }

/* 같은 재료를 다르게 적는 경우를 하나로 통일한다(낫또·나토 → 낫토 등).
   각 묶음의 첫 항목이 대표 표기이고, 나머지는 그 표기로 바뀐다.
   ※ 변형이 대표 표기의 일부인 경우(예: "마요"↔"마요네즈")는 무한 치환이 되므로 넣지 않는다. */
const SPELL_VARIANTS = [
  ["낫토","낫또","나토","natto"],
  ["계란","달걀"],
  ["요거트","요구르트","요플레","yogurt"],

  ["소시지","쏘시지","소세지"],
  ["스파게티","스파게디","스파게치"],
  ["카레","커리","카래"],
  ["샐러드","사라다","샐러디"],
  ["짜장","자장"],
  ["케첩","케찹"],
  ["연어","살몬","salmon"],
  ["새우","쉬림프","shrimp"],
  ["아보카도","아바카도","avocado"],
  ["브로콜리","브로컬리"],
  ["스테이크","스테익"],
  ["또띠아","토르티야","또르띠야","뚜르띠아"],
  ["오트밀","오트밀가루","귀리"]
];
/* 재료·요리 이름 비교용 정규화: 공백·괄호·문장부호 제거 + 소문자 + 표기 통일 */
function normIng(s){
  let t=String(s==null?"":s).toLowerCase().replace(/\(.*?\)/g,"").replace(/[\s·,./&+~\-_'"]/g,"");
  for(const g of SPELL_VARIANTS){ const canon=g[0];
    for(let i=1;i<g.length;i++) if(t.includes(g[i])) t=t.split(g[i]).join(canon); }
  return t;
}
/* 사용자가 적은 이름 → 앱이 아는 재료(ITEMS 키).
   우선순위: ①완전히 같은 이름 ②입력이 별칭을 포함(긴 별칭이 더 구체적)
             ③별칭이 입력을 포함(짧은 별칭이 더 가까움 — "연어"가 "훈제연어"로 새는 것 방지) */
/* 이름 → 재료 짝은 앱이 켜져 있는 동안 바뀌지 않는다(ITEMS·ITEM_ALIAS가 고정).
   못 알아본 이름도 기억해 둔다 — 그래야 매번 전부 다시 훑지 않는다. */
const RESOLVED = new Map();
function resolveItemKey(name){
  if(RESOLVED.has(name)) return RESOLVED.get(name);
  const r = resolveItemKey_(name); RESOLVED.set(name, r); return r;
}
function resolveItemKey_(name){
  const s=normIng(name); if(!s) return null;
  let exact=null, wide=null, wideLen=0, narrow=null, narrowLen=Infinity;
  const scan=(key, raw)=>{
    const a=normIng(raw); if(!a) return;
    if(a===s){ if(!exact) exact=key; return; }        // "쌀"처럼 한 글자라도 정확히 같으면 인정
    if(a.length<2 || s.length<2) return;              // 부분 일치는 2글자 이상일 때만(오매칭 방지)
    if(s.includes(a)){ if(a.length>wideLen){ wide=key; wideLen=a.length; } return; }
    if(a.includes(s)){ if(a.length<narrowLen){ narrow=key; narrowLen=a.length; } }
  };
  for(const k in ITEM_ALIAS) for(const a of ITEM_ALIAS[k]) scan(k,a);
  for(const k in ITEMS) scan(k, ITEMS[k].name);
  return exact||wide||narrow||null;
}
/* 앱 재료로는 없지만 레시피에는 나오는 재료(낫토 등)를 위해 — 레시피 전체 텍스트 색인(캐시) */
let _RCORPUS=null, _RCORPUSN=-1;
function recipeCorpus(){
  const all=allRecipeEntries();
  if(!_RCORPUS || _RCORPUSN!==all.length){ _RCORPUS=all.map(e=>normIng(e.name+" "+e.ing)); _RCORPUSN=all.length; }
  return _RCORPUS;
}
function recipeHits(name){
  const n=normIng(name); if(n.length<2) return 0;
  return recipeCorpus().filter(t=>t.includes(n)).length;
}

function findRecipesFor(name){
  RQ.cat=""; RQ.sort="match"; go("recipes");
  setTimeout(()=>{ const el=$("rc-q"); if(el){ el.value=name; filterRecipes(name); try{ el.scrollIntoView({block:"center"}); }catch(e){} } }, 30);
}
function myItemsArr(){ return Array.isArray(S.myItems)?S.myItems:[]; }
function myKeyOf(m){ return m.key||resolveItemKey(m.name); }
function myResolvedKeys(){ return calc("mk", () => { const set=new Set(); for(const m of myItemsArr()){ const k=myKeyOf(m); if(k&&!myItemSpent(m)) set.add(k); } return set; }); }
/* 내 재료 중 이 재료로 알아본 것들.
   앱 재고와 같은 단위(둘 다 g, 둘 다 개…)로 적힌 것만 수량을 셀 수 있다.
   "2봉지"처럼 앱이 모르는 단위는 몇 g인지 알 길이 없으므로 수량 0, 있음만 true. */
function myStockOf(id){ return calc("ms"+id, () => {
  const it=ITEMS[id]; if(!it) return {qty:0, has:false, note:""};
  let qty=0, has=false, parts=[];
  for(const m of myItemsArr()){
    if(myItemSpent(m)) continue;                 // 기한 지난 것을 재고로 세면 장을 안 보게 된다
    if(myKeyOf(m)!==id) continue;
    has=true;
    const u=String(m.unit||"").trim();
    parts.push(m.qty+(u||"개"));
    if(u===it.unit) qty+=m.qty;
  }
  return {qty, has, note:parts.join(", ")};
}); }
/* 앱 재고(수량>0) + 내 재료 로 '지금 가진' 재료 키 집합 */
function haveKeySet(){ return calc("hk", () => { const set=new Set(); for(const id in ITEMS){ if(stockOf(id)>0) set.add(id); } for(const k of myResolvedKeys()) set.add(k); return set; }); }
/* 내 재료를 쓰는 내장 레시피(부족 재료 표시) */
function recipesFromMyItems(){
  const my=myResolvedKeys(); if(!my.size) return [];
  const have=haveKeySet(); const out=[];
  for(const mid in MEALS){ const u=MEALS[mid].use||{}; const keys=Object.keys(u); if(!keys.length) continue;
    const usesMy=keys.filter(k=>my.has(k)); if(!usesMy.length) continue;
    const missing=keys.filter(k=>!have.has(k));
    out.push({mid, usesMy, missing});
  }
  out.sort((a,b)=> a.missing.length-b.missing.length || MEALS[b.mid].pro-MEALS[a.mid].pro);
  return out;
}
function myExpDD(m){ if(!m.exp) return null; return Math.round((parseD(m.exp)-parseD(todayStr()))/86400000); }
/* 다 먹었거나 기한이 지난 재료 — 지금 요리에 쓸 수 없으니 재고로도 세지 않는다 */
function myItemSpent(m){ const dd=myExpDD(m); return !(m.qty>0) || (dd!=null && dd<0); }

function adjustMyItem(id,delta){ const m=myItemsArr().find(x=>x.id===id); if(m){ m.qty=Math.max(0,Math.round((m.qty+delta)*10)/10); render(); } }
function removeMyItem(id){

/* ============================================================ 유통기한 임박 재료 소진 추천 ============================================================ */
/* 이 재료를 화면에서 뭐라고 부를까 —
   앱으로 산 것이 없고 내가 적은 재료만으로 갖고 있다면, 내가 쓴 이름으로 부른다. */
function keyLabel(k){
  const it=ITEMS[k]; if(!it) return k;
  if(stockOf(k)>0) return it.name;                  // 앱으로도 산 것 → 앱 이름이 맞다
  const mine=myItemsArr().find(m=>!myItemSpent(m) && myKeyOf(m)===k);
  return mine ? mine.name : it.name;
}
function urgentKeys(){
  const ks=new Set(), un=[];
  for(const id of Object.keys(ITEMS)){ const e=expiryInfo(id); if(e&&e.dd>=0&&e.dd<=3&&stockOf(id)>0) ks.add(id); }
  for(const m of myItemsArr()){ const dd=myExpDD(m); if(dd!=null&&dd>=0&&dd<=3&&m.qty>0){ const k=myKeyOf(m); if(k) ks.add(k); else un.push(m); } }
  return {ks:[...ks], un};
}
function urgentUseMenus(){
  const {ks,un}=urgentKeys(); if(!ks.length&&!un.length) return null;
  /* 식단 메뉴와 레시피를 함께 본다 — 예전엔 메뉴 74개만 봐서
     지금 바로 되는 '애호박볶음' 같은 것이 후보에도 없었다. */
  const out=rankByPantry(candidatesFor(ks).filter(x=>x.hits.length));
  return {menus:out, urgentIds:ks, un};
}

  logAction("살 것 추가: "+name);

}
function toggleShop(id){ const x=(S.shoplist||[]).find(i=>i.id===id); if(x){ x.done=!x.done; render(); } }
function removeShopItem(id){
  const arr=(S.shoplist||[]), i=arr.findIndex(x=>x.id===id); if(i<0) return;
  const gone=arr[i];
  S.shoplist=arr.filter(x=>x.id!==id); render();
  toast("「"+gone.name+"」 삭제", ()=>{ const a=(S.shoplist||[]); a.splice(Math.min(i,a.length),0,gone); S.shoplist=a; });
}
function shopBoughtToMy(){
  const done=(S.shoplist||[]).filter(x=>x.done); if(!done.length) return;
  if(!Array.isArray(S.myItems)) S.myItems=[];
  for(const x of done) S.myItems.push({id:"my"+Date.now().toString(36)+Math.floor(Math.random()*1000), name:x.name, qty:1, unit:"개", storage:"냉장", exp:"", key:resolveItemKey(x.name)});
  const 옮긴것=S.myItems.slice(-done.length), 메모전=S.shoplist.slice();
  S.shoplist=S.shoplist.filter(x=>!x.done);

  toast(done.length+"개를 [재고]의 내 재료로 옮겼어요", ()=>{

/* 백업 파일이나 예전 기록으로 들어온 글자에서 태그 모양을 걷어낸다(2차 방어선). */
function stripTags(v){ return typeof v==="string" ? v.replace(/<[^>]*>/g, "").slice(0, 2000) : v; }
function sanitizeUserText(){
  try{
    for(const r of (Array.isArray(S.myRecipes)?S.myRecipes:[])){
      r.name=stripTags(r.name); r.ing=stripTags(r.ing); r.tip=stripTags(r.tip);
      if(Array.isArray(r.steps)) r.steps=r.steps.map(stripTags);
    }
    for(const m of (Array.isArray(S.myItems)?S.myItems:[])){
      m.name=stripTags(m.name); m.unit=stripTags(m.unit); m.storage=stripTags(m.storage);
    }
    for(const x of (Array.isArray(S.shoplist)?S.shoplist:[])) x.name=stripTags(x.name);
    for(const x of (Array.isArray(S.extraMeals)?S.extraMeals:[])) x.name=stripTags(x.name);
    for(const p of (Array.isArray(S.myPresets)?S.myPresets:[])) p.name=stripTags(p.name);
    for(const r of (Array.isArray(S.inbound)?S.inbound:[])) if(r&&r.label) r.label=stripTags(r.label);
    S.nick=stripTags(S.nick);
  }catch(e){}
}
function ensureInboundIds(){
  if(!Array.isArray(S.inbound)) { S.inbound=[]; return; }
  for(const r of S.inbound) if(r && !r.id) r.id=uid("ib");
  absorbAdj();
  sanitizeUserText();
  /* 예전 기록에는 예산이 따로 없었다 — 그때는 '등급 금액'이 곧 예산이었다. */
  if(!(+S.budget)) S.budget=(S.tier||20)*10000;
  if(S.tierAuto===undefined) S.tierAuto=true;
}
/* 구버전의 보이지 않던 재고 보정값(S.adj)을 눈에 보이는 기록 한 줄로 옮긴다. */
function absorbAdj(){
  if(!S.adj || typeof S.adj!=="object") { S.adj={}; return; }
  const t=todayStr();
  for(const id of Object.keys(S.adj)){
    const g=+S.adj[id]||0;
    if(g && ITEMS[id]) S.inbound.push({id:uid("ib"), adjust:true, legacy:true, date:t, itemId:id, packs:g/ITEMS[id].pack, price:0});
    delete S.adj[id];
  }
}

/* ============================================================ 주간 리포트·스트릭·월별 지출 ============================================================ */
function adherence7(){
  let planned=0, eaten=0, kcalSum=0, proSum=0, daysWithEat=0;
  for(let i=0;i<7;i++){
    const dS=addDays(todayStr(),-i); let dayK=0, ate=false;
    for(const [slot,mid] of slotsOf(dS)){
      const key=dS+"|"+slot;
      if(S.skips.includes(key)) continue;
      planned++;
      if(S.eaten.includes(key)){ eaten++; dayK+=MEALS[mid].kcal; proSum+=MEALS[mid].pro; ate=true; }
    }
    for(const x of extrasOf(dS)){ dayK+=x.kcal; proSum+=x.pro; ate=true; }   // 계획 외 섭취 합산
    if(ate){ daysWithEat++; kcalSum+=dayK; }
  }
  return {planned, eaten, pct: planned?Math.round(eaten/planned*100):0,
    avgK: daysWithEat?Math.round(kcalSum/daysWithEat):0, avgP: daysWithEat?Math.round(proSum/daysWithEat):0};
}
function streakDays(){
  let s=0;
  for(let i=0;i<90;i++){
    const dS=addDays(todayStr(),-i);
    const keys=slotsOf(dS).map(([slot])=>dS+"|"+slot).filter(k=>!S.skips.includes(k));
    if(!keys.length) continue;                       // 계획 없는 날은 스트릭 유지
    if(keys.every(k=>S.eaten.includes(k))){ s++; continue; }
    if(i===0) continue;                              // 오늘은 아직 진행 중 — 끊지 않음
    break;
  }
  return s;
}
function monthSeries(n){
  const out=[]; let [y,m]=todayStr().slice(0,7).split("-").map(Number);
  for(let i=0;i<n;i++){
    const mm=y+"-"+String(m).padStart(2,"0");
    out.unshift({m:mm, v:S.inbound.filter(r=>r.date.slice(0,7)===mm).reduce((a,r)=>a+(r.price||0),0)});
    m--; if(m===0){ m=12; y--; }
  }
  return out;
}
/* 🍳 조리 이력·통계 */
function monthConsumption(){
  const m=todayStr().slice(0,7), t=todayStr(); const cost={};
  for(let day=1; day<=31; day++){
    const dS=m+"-"+String(day).padStart(2,"0"); if(dS>t) break;
    for(const [slot,mid] of slotsOf(dS)){
      if(S.skips.includes(dS+"|"+slot)) continue;
      const u=MEALS[mid].use||{}; for(const id in u){ const it=ITEMS[id]; if(it) cost[id]=(cost[id]||0)+it.price/it.pack*u[id]; } } }
  return Object.entries(cost).map(([id,c])=>({id,c})).sort((a,b)=>b.c-a.c).slice(0,5);
}

}

  try{

    if(last && last<t){
      let from=last;
      const floor=addDays(t,-FREEZE_MAX_DAYS);
      if(from<floor) from=floor;
      for(let d=from; d<t; d=addDays(d,1)) if(!S.dayPlan[d]) S.dayPlan[d]=snapshotDay(d);
    }
    S.lastSeen=t;
    /* 아주 오래된 기록은 덜어 낸다(400일) */

               그 재료를 사기 시작한 날 이후만 재료별로 더한다
   재료마다 따로 하면 (재료 수 × 기록 수 + 재료 수 × 날짜 수)만큼 든다. */
function stockLedger(){ return calc("led", () => {
  const bought={}, first={}, last={};
  for(const r of S.inbound){ const id=r.itemId, it=ITEMS[id]; if(!it) continue;
    bought[id]=(bought[id]||0)+(r.packs||0)*it.pack;
    if(!first[id]||r.date<first[id]) first[id]=r.date;
    if(!r.adjust && (!last[id]||r.date>last[id].date)) last[id]=r; }
  const used={};
  let start=null; for(const id in first) if(!start||first[id]<start) start=first[id];
  const end=addDays(todayStr(),-1);
  if(start && start<=end){
    const skip=new Set(S.skips);
    for(let d=start; d<=end; d=addDays(d,1))
      for(const [slot,mid] of slotsOf(d)){
        if(skip.has(d+"|"+slot)) continue;
        const u=MEALS[mid].use||{};
        for(const id in u){ const f=first[id]; if(f&&d>=f) used[id]=(used[id]||0)+u[id]; }
      }
  }
  return {bought, first, last, used};
}); }
function firstInbound(id){ return stockLedger().first[id]||null; }
function lastInbound(id){ return stockLedger().last[id]||null; }
/* 남겨 둔다 — 임의의 기간을 묻는 자리가 생길 수 있다. 재고 계산은 위 장부를 쓴다. */
function plannedUseBetween(id, fromS, toS){
  if(!fromS) return 0;
  return calc("pu"+id+fromS+toS, () => {
  let t=0;
  for(let d=fromS; d<=toS; d=addDays(d,1)){
    for(const [slot,mid] of slotsOf(d)){
      if(S.skips.includes(d+"|"+slot)) continue;
      const u=MEALS[mid].use[id]; if(u) t+=u;
    }
  }
  return t;
  });
}
function rawStockOf(id){ return calc("rs"+id, () => {
  const L=stockLedger();
  /* 어제까지 먹은 몫만 뺀다 — 오늘 몫은 [지금 살 것]이 세고 있다.
     둘 다 세면 산 그날 바로 "또 사세요"가 뜬다. */
  return (L.bought[id]||0) - (L.used[id]||0) + (S.adj[id]||0);
}); }
function stockOf(id){ return Math.max(0, rawStockOf(id)); }
function dailyNeed(id){
  let t=0, d0=todayStr();
  for(let i=0;i<7;i++){ const d=addDays(d0,i);
    for(const [slot,mid] of slotsOf(d)){ const u=MEALS[mid].use[id]; if(u) t+=u; } }
  return t/7;
}
function daysLeft(id){ const n=dailyNeed(id); return n<=0?Infinity:(stockOf(id)+myStockOf(id).qty)/n; }
function expiryInfo(id){
  const l=lastInbound(id); if(!l) return null;
  const exp=addDays(l.date, ITEMS[id].shelf);
  return {exp, dd:Math.round((parseD(exp)-parseD(todayStr()))/86400000)};
}
function itemState(id){
  const st=stockOf(id), e=expiryInfo(id), my=myStockOf(id);
  /* 앱 재고가 비어도 내 재료로 갖고 있으면 사러 가라고 하지 않는다.
     수량까지 셀 수 있으면 그 수량으로, 못 세면 '있다'는 사실만으로 판단한다. */
  if(st+my.qty<=0 && my.has) return {level:"good", label:"내 재료에 있어요"};
  if(!firstInbound(id)) return my.has?{level:"good", label:"내 재료에 있어요"}:{level:"none", label:"입고 전"};
  if(st+my.qty<=0) return {level:"crit", label:"다 떨어졌어요"};
  /* 유통기한은 앱으로 산 것에만 붙는다. 앱 재고가 비었으면 그 날짜는 이미 지난 이야기다. */
  if(st>0 && e && e.dd<0) return {level:"crit", label:"유통기한 지남 — 확인 후 폐기"};
  if(st>0 && e && e.dd<=3) return {level:"warn", label:`유통기한 D-${e.dd}`};
  /* 화면에는 내림한 날짜가 뜬다. 판정도 그 숫자로 해야 어긋나지 않는다. */
  const dl=Math.floor(daysLeft(id));
  if(dl<=LEAD_DAYS) return {level:"serious", label:"곧 떨어져요"};
  if(dl<=7) return {level:"warn", label:`${dl}일치 남음`};
  return {level:"good", label:"여유"};
}
function monthSpend(){ const m=todayStr().slice(0,7); return S.inbound.filter(r=>r.date.slice(0,7)===m).reduce((a,r)=>a+(r.price||0),0); }
/* 이번 달 돈은 세 덩어리로 — 예산 − 이미 쓴 돈 − 앞으로 살 것. */
function monthSpentSplit(){
  const m=todayStr().slice(0,7);
  let grocery=0, dining=0;
  for(const r of (S.inbound||[])){
    if((r.date||"").slice(0,7)!==m) continue;
    if(r.itemId==="extra") dining+=(r.price||0); else grocery+=(r.price||0);
  }
  return {grocery, dining, total:grocery+dining};
}
function plannedBuyCost(){
  const p=buyPlan();
  return [...p.bulk, ...p.fresh].reduce((a,x)=>a+x.cost,0);
}
function monthLeft(){ return tierBudget()-monthSpentSplit().total-plannedBuyCost(); }
/* 이번 달 식비를 '계산대에서 낼 돈'이 아니라 '이번 달에 먹어 없앨 몫'으로 센다.
   팩 단위로 올림하지 않는 것이 핵심이다 — 올림한 만큼은 다음 달 몫이니까. */
function daysLeftInMonth(){
  const d=parseD(todayStr());
  return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate()-d.getDate()+1;
}
function costForDays(n){
  const need=needForDays(n); let c=0;
  for(const id in need){ const it=ITEMS[id]; if(!it) continue; c+=need[id]/it.pack*it.price; }
  return Math.round(c);
}
function stockValueFor(n){
  const need=needForDays(n); let c=0;
  for(const id in need){ const it=ITEMS[id]; if(!it) continue;
    const have=stockOf(id)+myStockOf(id).qty;
    c+=Math.min(Math.max(0,have), need[id])/it.pack*it.price; }
  return Math.round(c);
}
/* 앞으로 나갈 돈 = 지금 [살 것]에 뜬 금액 + 남은 기간에 다시 살 신선식품.
   화면에 보이는 장바구니 금액을 그대로 쓰기 때문에, 목록대로 사면
   '쓴 돈'이 늘어난 만큼 '앞으로'가 줄어 총액이 움직이지 않는다.
   전에는 이론 원가로 앞을 재고 팩값으로 뒤를 재서, 사는 순간 총액이 뛰었다. */
function willSpendRest(){
  const D=daysLeftInMonth();
  const 다시살신선 = (freshRounds(D)-1) * freshRoundCost();
  return plannedBuyCost() + 다시살신선;
}
function monthForecast(){
  const D=daysLeftInMonth(), spent=monthSpentSplit().total;
  const need=packCostForDays(D), covered=stockValueFor(D);
  const willSpend=willSpendRest();
  return {D, spent, need, covered, willSpend, total:spent+willSpend,
          budget:tierBudget(), left:tierBudget()-spent-willSpend};
}
function buyCarryOver(){
  const D=daysLeftInMonth(), p=buyPlan(), needD=needForDays(D);
  let carry=0;
  for(const x of [...p.bulk, ...p.fresh]){
    const it=ITEMS[x.id]; if(!it) continue;
    const bought=x.packs*it.pack;
    const leftover=Math.max(0, x.have+bought-(needD[x.id]||0));
    carry+=Math.min(bought, leftover)/it.pack*it.price;
  }
  return Math.round(carry);
}
function budgetTooLow(){
  const c=estimateForTier(TIER_KEYS[0]);
  return c>tierBudget() ? c : 0;
}
function fcDelta(before){
  const d=monthForecast().total-before;
  /* 아무 말도 안 하면 "내가 잘못 눌렀나?" 하고 두 번 확인하게 된다.
     신선식품은 일주일치 팩으로 사서, 끼니를 조금 줄여도 팩 수가 그대로면 돈도 그대로다. */
  if(Math.abs(d)<1000) return " · 이번 달 예상은 그대로예요(팩 단위로 사서요)";
  return " · 이번 달 예상 "+(d>0?"+":"−")+fmt(Math.abs(d));
}
function expiringSoon(){ return Object.keys(ITEMS).filter(id=>{ const e=expiryInfo(id); return e&&e.dd>=0&&e.dd<=3&&stockOf(id)>0; }); }
/* ============================================================ 레시피 탭 — 라이브러리·검색·내 레시피 ============================================================ */
let RQ={cat:"", tag:"", sort:"match", q:"", limit:30};
function uid(p){ return p+Date.now().toString(36)+Math.floor(Math.random()*1000); }
function haveKeywordSets(){
  const sets=[];
  for(const k of haveKeySet()){
    const words=[(ITEMS[k].name||"").replace(/\(.*?\)/g,"").replace(/[·,]/g," ").trim()];
    for(const a of (ITEM_ALIAS[k]||[])) words.push(a);
    sets.push(words.map(normIng).filter(w=>w.length>=2));
  }
  // 앱이 모르는 재료(낫토 등)도 이름 그대로 레시피 매칭에 참여시킨다
  for(const m of myItemsArr()) if(m.qty>0 && m.name){ const n=normIng(m.name); if(n.length>=2) sets.push([n]); }
  return sets.filter(w=>w.length);
}
/* 레시피의 재료 글은 앱이 켜져 있는 동안 바뀌지 않는다 — 정규화는 한 번이면 된다.
   한 화면에 439번, 검색할 때마다 다시 하던 일이다. */
const NING = new Map();
function normIngCached(t){
  let v=NING.get(t); if(v===undefined){ v=normIng(t); NING.set(t, v); }
  return v;
}
function recipeMatchCount(ingText, sets){
  const s=normIngCached(ingText); let n=0;
  for(const words of sets){ if(words.some(w=>s.includes(w))) n++; }
  return n;
}
/* 그리는 동안에는 레시피 목록이 변하지 않는다 — 그 사이에만 기억한다.

function allRecipeEntries(){ return calc("are", allRecipeEntries_); }
function allRecipeEntries_(){
  const out=[];
  for(const id in MEALS){ if(id.startsWith("ur_")) continue; const m=MEALS[id];
    out.push({src:"plan", id, name:m.name, kcal:m.kcal, pro:m.pro, min:null, lv:null, ing:m.ing||"", steps:m.steps||null, tip:m.tip||"", cat:"plan"}); }
  for(const r of RECIPES) out.push({src:"lib", id:r.id, name:r.name, kcal:r.kcal, pro:r.pro, min:r.min, lv:r.lv, ing:r.ing, steps:r.steps, tip:r.tip, cat:r.cat, tags:r.tags||[], use:r.use});
  for(const r of (S.myRecipes||[])) out.push({src:"my", id:r.id, name:r.name, kcal:+r.kcal||0, pro:+r.pro||0, min:r.min||null, lv:null, ing:r.ing||"", steps:r.steps||null, tip:r.tip||"", cat:"my"});
  return out;
}
function findEntry(src,id){ return allRecipeEntries().find(e=>e.src===src&&String(e.id)===String(id)); }
const LV_TXT={1:"쉬움",2:"보통",3:"정성"};
/* 좁은 칸에서 이름이 갈라질 때 요리 이름의 '끝말' 앞에서 갈라지게 한다. */
const NAME_TAILS = ["카레라이스","스테이크","찌개+밥","볶음+밥","구이+밥","볶음밥","비빔밥","샐러드","파스타",
  "토스트","셰이크","스무디","김치찜","라이스","덮밥","국밥","김밥","찌개","정식","구이","볶음","무침","조림",
  "튀김","전골","한상"];

/* 지금 조건에 맞는 레시피 목록. 검색어까지 여기서 걸러 낸다 —
   전에는 화면에 다 깔고 CSS로 숨겼는데, 레시피가 365개가 되자 그리기만으로 300ms가 넘었다. */
/* '재료 N개 있음' 배지를 붙인 레시피 전체. 냉장고가 바뀌기 전까지는 그대로다.
   글자를 칠 때마다 다시 만들면 5년치 장부를 매번 훑게 된다 — 실제로 330ms였다.
   화면을 다시 그릴 때(render) 버리고, 그 사이에는 이 값을 쓴다. */
let RSCORED=null;
function recipeScored(){
  if(RSCORED) return RSCORED;
  const sets=haveKeywordSets();
  RSCORED=allRecipeEntries().map(e=>({...e, match:recipeMatchCount(e.ing, sets)}));
  return RSCORED;

function recipeList(){
  let list=recipeScored();
  const total=list.length;
  if(RQ.cat==="plan") list=list.filter(e=>e.src==="plan");
  else if(RQ.cat==="my") list=list.filter(e=>e.src==="my");
  else if(RQ.cat) list=list.filter(e=>e.cat===RQ.cat);
  if(RQ.tag) list=list.filter(e=>(e.tags||[]).includes(RQ.tag));
  const toks=String(RQ.q||"").trim().split(/\s+/).map(normIng).filter(t=>t.length>0);
  if(toks.length) list=list.filter(e=>{
    const d=normIngCached(e.name+" "+e.ing);
    return toks.every(t=>d.includes(t));
  });
  if(RQ.sort==="match") list.sort((a,b)=> b.match-a.match || a.name.localeCompare(b.name,"ko"));
  else if(RQ.sort==="time") list.sort((a,b)=> (a.min||99)-(b.min||99));
  else list.sort((a,b)=> a.name.localeCompare(b.name,"ko"));
  return {list, total};
}

  const meta=[e.kcal?`${e.kcal}kcal`:null, e.pro?`단백질 ${e.pro}g`:null, e.min?`${e.min}분`:null, e.lv?LV_TXT[e.lv]:null].filter(Boolean).join(" · ");
  const steps=(e.steps&&e.steps.length)?`<ol style="margin:8px 0 0;padding-left:20px;line-height:1.7">${e.steps.map(s=>`<li style="margin-bottom:6px">${escH(s)}</li>`).join("")}</ol>`:"";
  const acts = e.src==="my"
    ? `<button class="btn" onclick="assignRecipeToday('${e.src}','${e.id}','lunch')">오늘 점심에 넣기</button>
       <button class="btn" onclick="assignRecipeToday('${e.src}','${e.id}','dinner')">오늘 저녁에 넣기</button>
       <button class="btn ghost" onclick="openRecipeEditor('${e.id}')">고치기</button>
       <button class="btn ghost" style="color:var(--crit-text)" onclick="deleteMyRecipe('${e.id}')">삭제</button>`
    : `<button class="btn" onclick="assignRecipeToday('${e.src}','${e.id}','lunch')">오늘 점심에 넣기</button>
       <button class="btn primary" onclick="assignRecipeToday('${e.src}','${e.id}','dinner')">오늘 저녁에 넣기</button>
       ${e.src==="lib"?`<button class="btn ghost" onclick="saveLibToMy('${e.id}')">⭐ 내 레시피에 담기</button>`:""}`;
  $("rsheet-root").style.display="block";
  $("rsheet-root").innerHTML=`<div class="sheet-back" onclick="closeRSheet()"></div>
    <div class="sheet"><div class="sheet-grip"></div>
      <div class="sheet-h"><span>${escH(e.name)}</span><button class="sheet-x" onclick="closeRSheet()">✕</button></div>
      <div class="tiny" style="margin-bottom:8px">${meta}</div>
      <div class="muted" style="background:var(--page);border-radius:14px;padding:11px 13px">🧺 ${escH(e.ing)}</div>
      ${steps}
      ${e.tip?`<div class="rtip" style="margin-top:10px">💡 ${escH(e.tip)}</div>`:""}
      <div class="btnrow" style="margin-top:14px">${acts}</div>
    </div>`;
}
function closeRSheet(){ const r=$("rsheet-root"); r.style.display="none"; r.innerHTML=""; }
function ensureMyCopy(e){
  const ex=(S.myRecipes||[]).find(r=>r.name===e.name); if(ex) return ex.id;
  const id=uid("mr");
  if(!Array.isArray(S.myRecipes)) S.myRecipes=[];
  S.myRecipes.push({id, name:e.name, kcal:e.kcal, pro:e.pro, min:e.min, ing:e.ing, steps:e.steps||[], tip:e.tip||""});
  return id;
}
function saveLibToMy(id){
  const e=findEntry("lib",id); if(!e) return;
  const already=(S.myRecipes||[]).some(r=>r.name===e.name);
  const newId=ensureMyCopy(e);
  render(); closeRSheet();
  if(already){ toast("이미 내 레시피에 있어요"); return; }
  /* 되돌리기 — 방금 만든 사본만 지운다. 이름이 같은 예전 사본은 건드리지 않는다. */
  toast("「"+e.name+"」 내 레시피에 담음", ()=>{
    S.myRecipes=(S.myRecipes||[]).filter(r=>r.id!==newId); rebuildUserMeals();
  });
}
function assignRecipeToday(src,id,slot){
  const e=findEntry(src,id); if(!e) return;
  const d=dow(todayStr()), key=d+"|"+slot;
  let mid, addedId=null;
  if(src==="plan") mid=id;
  else if(src==="my") mid="ur_"+id;
  else {
    const had=(S.myRecipes||[]).some(r=>r.name===e.name);
    const rid=ensureMyCopy(findEntry("lib",id));
    if(!had) addedId=rid;                       // 라이브러리에서 온 것은 사본이 생긴다
    mid="ur_"+rid;
  }
  /* 덮어쓰기 전의 상태를 그대로 적어 둔다 — 없던 값은 '없었음'으로 되돌려야 한다 */
  const hadCustom=Object.prototype.hasOwnProperty.call(S.custom||{},key), prevCustom=S.custom[key];
  const prevSched=S.schedule[slot][d];
  rebuildUserMeals();
  S.schedule[slot][d]=1; S.custom[key]=mid;
  closeRSheet(); go("today"); render();
  toast("오늘 "+SLOT_SHORT[slot]+" → "+e.name, ()=>{
    if(hadCustom) S.custom[key]=prevCustom; else delete S.custom[key];
    S.schedule[slot][d]=prevSched;
    if(addedId) S.myRecipes=(S.myRecipes||[]).filter(r=>r.id!==addedId);
    rebuildUserMeals();
  });
}

function saveMyRecipe(id){
  const name=($("re-name").value||"").trim(); if(!name){ toast("요리 이름을 적어 주세요"); $("re-name").focus(); return; }
  const rec={ name, kcal:+$("re-kcal").value||0, pro:+$("re-pro").value||0, min:+$("re-min").value||0,
    ing:($("re-ing").value||"").trim(), steps:($("re-steps").value||"").split("\n").map(s=>s.trim()).filter(Boolean),
    tip:($("re-tip").value||"").trim() };
  if(!Array.isArray(S.myRecipes)) S.myRecipes=[];
  if(id){ const r=S.myRecipes.find(x=>x.id===id); if(r) Object.assign(r,rec); }
  else S.myRecipes.push({id:uid("mr"), ...rec});
  rebuildUserMeals(); closeRSheet(); render();
}
function deleteMyRecipe(id){
  const arr=(S.myRecipes||[]), i=arr.findIndex(x=>x.id===id); if(i<0) return;
  const gone=arr[i], usedAt={};
  S.myRecipes=arr.filter(x=>x.id!==id);
  for(const k of Object.keys(S.custom||{})) if(S.custom[k]==="ur_"+id){ usedAt[k]=S.custom[k]; delete S.custom[k]; }
  rebuildUserMeals(); closeRSheet(); render();
  toast("「"+gone.name+"」 레시피 삭제", ()=>{
    if(!Array.isArray(S.myRecipes)) S.myRecipes=[];
    S.myRecipes.splice(Math.min(i,S.myRecipes.length),0,gone);
    for(const k of Object.keys(usedAt)) S.custom[k]=usedAt[k];
    rebuildUserMeals();
  });
}
/* ============================================================ 피드 — 사진·레시피 공유(방 단위)·좋아요·댓글 ============================================================ */
const FEED_KEY="mealapp_feed_v1", DEV_KEY="mealapp_dev";
let FEED_REMOTE=null, _draftPhoto=null;
function devId(){ try{ let d=localStorage.getItem(DEV_KEY); if(!d){ d=uid("dev"); localStorage.setItem(DEV_KEY,d); } return d; }catch(e){ return "dev-local"; } }
function loadFeed(){
  try{ const raw=localStorage.getItem(FEED_KEY); if(raw) S.feedLocal=JSON.parse(raw)||[]; }catch(e){}
  /* v24 이관: 예전 피드 게시물에는 날짜가 없다. 작성 시각(at)으로 날짜를 채워 캘린더 안으로 흡수한다. */
  let moved=0;
  for(const p of (S.feedLocal||[])){
    if(!p.date){ const d=new Date(p.at||Date.now());
      p.date = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      moved++; }
  }
  if(moved) try{ saveFeed(); }catch(e){}
}
/* 그날의 요리 기록(사진·메모) */
function logsOf(dS){ return (S.feedLocal||[]).filter(p=>p.date===dS).sort((a,b)=>b.at-a.at); }
function saveFeed(){
  try{ localStorage.setItem(FEED_KEY, JSON.stringify(S.feedLocal||[])); }
  catch(e){ try{ (S.feedLocal||[]).slice(8).forEach(p=>p.photo=null); localStorage.setItem(FEED_KEY, JSON.stringify(S.feedLocal||[])); }catch(_){ alert("저장 공간이 가득 찼어요. 오래된 게시물을 지워 주세요."); } }
}
function activeFeedRef(){ return null; }   /* 로컬 전용 — 원격 피드 없음 */
function feedShared(){ return false; }
function feedItems(){ return (S.feedLocal||[]).slice().sort((a,b)=>b.at-a.at); }
function timeAgo(at){ const s=(Date.now()-at)/1000; if(s<60)return"방금"; if(s<3600)return Math.floor(s/60)+"분 전"; if(s<86400)return Math.floor(s/3600)+"시간 전"; return Math.floor(s/86400)+"일 전"; }
function pickPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image();
    img.onload=()=>{
      const compress=(max,q)=>{ const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c.toDataURL("image/jpeg",q); };
      let d=compress(720,.72); if(d.length>260000) d=compress(560,.6);
      _draftPhoto=d; const pv=$("fd-preview"); if(pv){ pv.src=d; pv.style.display="block"; }
    };
    img.src=rd.result; };
  rd.readAsDataURL(f);
}

  const name=(($("fd-name")||{}).value||"").trim(), body=(($("fd-body")||{}).value||"").trim();
  if(!name&&!body&&!_draftPhoto){ alert("요리 이름이나 사진을 넣어 주세요."); return; }
  const post={ id:uid("po"), at:Date.now(), date:todayStr(), by:devId(), nick:(S.nick||""), name, body,
    photo:_draftPhoto||null, likes:{}, comments:{} };
  if(!Array.isArray(S.feedLocal)) S.feedLocal=[];
  S.feedLocal.unshift(post); saveFeed();
  _draftPhoto=null;
  const pv=$("fd-preview"); if(pv){ pv.style.display="none"; pv.src=""; }
  toast("오늘 기록에 담았어요");
  render(); if(CAL.open) openDay(CAL.open);
}
function toggleLike(pid){

  if(fr && FEED_REMOTE){ const p=FEED_REMOTE[pid]; if(!p) return;

  S.feedLocal=(S.feedLocal||[]).filter(x=>x.id!==pid); saveFeed(); render();

/* ============================================================ 기록 캘린더 — 애플 건강 앱 활동 링 문법
   링 = 그날 먹은 끼니 / 그날 계획한 끼니(의도적으로 거른 끼니는 분모에서 뺀다).
   그래서 "점심·저녁만 계획한 날 둘 다 먹음"도, "하루 한 끼 계획한 날 한 끼 먹음"도 100%가 된다.
   지난 날짜는 잠긴다 — 소급 입력을 열어 두면 링은 기록이 아니라 그림이 되기 때문. ============ */
const CAL = { ym:null, open:null };
function ymOf(dS){ return dS.slice(0,7); }
function ymShift(ym, k){ let [y,m]=ym.split("-").map(Number); m+=k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+"-"+String(m).padStart(2,"0"); }
function daysInMonth(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); }
function firstDow(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m-1,1).getDay(); }

/* 그날의 링 상태 — planned(계획 끼니 수) / eaten(먹은 수) / pct / full */
function dayRing(dS){
  let planned=0, eaten=0;
  for(const [slot] of slotsOf(dS)){
    const key=dS+"|"+slot;
    if(S.skips.includes(key)) continue;      // 처음부터 거르기로 한 끼니는 분모에서 제외
    planned++;
    if(S.eaten.includes(key)) eaten++;
  }
  return {planned, eaten, pct: planned?eaten/planned:0, full: planned>0 && eaten===planned};
}
/* 한 달 통계 — 꽉 채운 날, 계획이 있던 날, 평균 실천율 */
function monthStats(ym){
  const n=daysInMonth(ym), t=todayStr(); let full=0, withPlan=0, sumPct=0, done=0;
  for(let d=1; d<=n; d++){
    const dS=ym+"-"+String(d).padStart(2,"0");
    if(dS>t) continue;                        // 아직 오지 않은 날은 세지 않는다
    const r=dayRing(dS); if(!r.planned) continue;
    withPlan++; sumPct+=r.pct; if(r.full) full++; done++;
  }
  return {full, withPlan, avg: done?Math.round(sumPct/done*100):0};
}
/* 링 SVG. pct 0~1, size는 뷰박스 기준. 애플처럼 12시 방향에서 시계 방향으로 채운다. */
function ringSVG(pct, opt){
  const o=opt||{}, s=o.size||44, sw=o.sw||6, r=(s-sw)/2, c=2*Math.PI*r, dash=c*Math.max(0, Math.min(1, pct));
  const track=o.track||"var(--grid)", col=o.color||"url(#ringgrad)";
  return `<svg viewBox="0 0 ${s} ${s}" aria-hidden="true">
    <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/>
    ${dash>0?`<circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${dash.toFixed(2)} ${(c-dash).toFixed(2)}"
      transform="rotate(-90 ${s/2} ${s/2})"/>`:``}
  </svg>`;
}
function calPrev(){ CAL.ym=ymShift(CAL.ym||ymOf(todayStr()),-1); paint(renderCal); }
function calNext(){ const t=ymOf(todayStr()); const nx=ymShift(CAL.ym||t,1); if(nx>t) return; CAL.ym=nx; paint(renderCal); }

function ensureRingDefs(){
  if(document.getElementById("ringdefs")) return;
  const sv=document.createElementNS("http://www.w3.org/2000/svg","svg");
  sv.setAttribute("id","ringdefs"); sv.setAttribute("width","0"); sv.setAttribute("height","0");
  sv.setAttribute("aria-hidden","true"); sv.style.position="absolute";
  sv.innerHTML='<defs><linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">'
    +'<stop class="g0" offset="0%"/><stop class="g1" offset="100%"/></linearGradient></defs>';
  document.body.appendChild(sv);
}
function renderCal(){
  ensureRingDefs();
  const t=todayStr(), curYm=ymOf(t);
  if(!CAL.ym) CAL.ym=curYm;
  const ym=CAL.ym, [yy,mm]=ym.split("-").map(Number);
  const n=daysInMonth(ym), lead=firstDow(ym), st=monthStats(ym);

  let cells="";
  for(let i=0;i<lead;i++) cells+=`<span class="cal-cell blank">${ringSVG(0)}</span>`;
  for(let d=1; d<=n; d++){
    const dS=ym+"-"+String(d).padStart(2,"0");
    const fut=dS>t, isToday=dS===t, r=dayRing(dS);
    const cls=["cal-cell"];
    if(fut) cls.push("fut"); if(isToday) cls.push("today"); if(r.full) cls.push("full");
    if(!r.planned && !fut) cls.push("none");
    const track = isToday ? "var(--accent-soft)" : "var(--grid)";
    const svg = ringSVG(fut?0:r.pct, {track, sw:5});
    const label = fut ? `${d}일 · 아직 오지 않은 날`
      : (!r.planned ? `${d}일 · 계획 없음` : `${d}일 · ${r.planned}끼 중 ${r.eaten}끼`);
    cells+=`<button class="${cls.join(" ")}" onclick="openDay('${dS}')" aria-label="${label}">${svg}<span class="dn">${d}</span></button>`;
  }

  const streak=streakDays();
  const head=`<div class="card calcard">
    <div class="cal-top">
      <div class="cal-eyebrow">식사 기록</div>
      <button class="cal-share" onclick="shareMonthImage()" aria-label="이번 달 기록 공유">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M8.5 7.5 12 4l3.5 3.5"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></svg>
      </button>
    </div>
    <div class="cal-head">
      <button class="cal-nav" onclick="calPrev()" aria-label="이전 달">‹</button>
      <div class="ym">${yy}년 ${mm}월</div>
      <button class="cal-nav" onclick="calNext()" ${ym>=curYm?"disabled":""} aria-label="다음 달">›</button>
    </div>
    <div class="cal-stats">
      <div class="cal-stat"><div class="k">꽉 채운 날</div><div class="v">${st.full}<span>일</span></div></div>
      <div class="cal-stat"><div class="k">연속</div><div class="v">${streak}<span>일</span></div></div>
      <div class="cal-stat"><div class="k">계획대로</div><div class="v">${st.avg}<span>%</span></div></div>
    </div>
    <div class="cal-dowk">${DOWK.map(w=>`<span>${w}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span><i style="background:#0a84ff"></i>계획한 끼니를 다 먹으면 꽉 참</span>
      <span>🔒 ${LOCKED_MSG}</span>
    </div>
  </div>`;

  const todayR=dayRing(t);
  const todayCard=`<div class="card">
    <h2>📸 오늘 만든 요리<span class="sub">${(()=>{const n=(S.feedLocal||[]).filter(x=>x&&x.date===t).length; return n?`오늘 ${n}장 남김`:"사진과 메모로 남겨요";})()}</span></h2>
    <div class="fd-row">
      <label class="btn" style="flex:0 0 auto">📷 사진<input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)"></label>
      <input id="fd-name" type="text" placeholder="요리 이름 (예: 두부김치)" style="flex:1">
    </div>
    <img id="fd-preview" style="display:${_draftPhoto?"block":"none"};width:100%;border-radius:14px;margin-top:9px" src="${_draftPhoto||""}">
    <textarea id="fd-body" style="margin-top:9px" placeholder="오늘의 한 줄 · 조리 후기를 남겨 보세요"></textarea>
    <div class="btnrow"><button class="btn primary" style="flex:1" onclick="publishPost()">오늘 기록에 담기</button></div>
    <div class="tiny" style="margin-top:8px">사진과 메모는 이 기기에만 저장되고 어디로도 전송되지 않아요. 달력에서 그날을 누르면 다시 볼 수 있어요.</div>
  </div>`;

  $("view-cal").innerHTML=head+todayCard;
}

/* 날짜 상세 — 링을 누르면 열린다. 그날 끼니 + 그날 남긴 요리 기록. */
function openDay(dS){
  const t=todayStr();
  if(dS>t){ toast("아직 오지 않은 날이에요"); return; }
  CAL.open=dS;
  const r=dayRing(dS), locked=dS!==t;
  const slots=slotsOf(dS).map(([slot,mid])=>{
    const key=dS+"|"+slot, skip=S.skips.includes(key), eaten=S.eaten.includes(key);
    const cls=["day-slot"]; if(eaten) cls.push("done"); if(skip) cls.push("skip");
    return `<div class="${cls.join(" ")}">
      <span class="sl">${SLOT_SHORT[slot]}</span>
      <span class="nm">${escH((MEALS[mid]||{}).name||"—")}</span>
      ${skip?`<span class="badge plain">거름</span>`
            :`<button class="day-mark ${eaten?"on":""}" ${locked?"disabled":""} onclick="markEaten('${key}'); openDay('${dS}')"
                aria-label="${SLOT_SHORT[slot]} 먹음 체크">${eaten?"✓":""}</button>`}
    </div>`;
  }).join("") || `<div class="tiny" style="padding:10px 0">이 날은 계획된 끼니가 없어요.</div>`;

  const logs=logsOf(dS).map(p=>`<div class="day-log">
      ${p.photo?`<img src="${p.photo}" loading="lazy">`:""}
      ${p.name?`<div class="nm">${escH(p.name)}</div>`:""}
      ${p.body?`<div class="bd">${escH(p.body).replace(/\n/g,"<br>")}</div>`:""}
      <div class="btnrow" style="margin-top:8px"><button class="btn sm" onclick="deleteDayLog('${p.id}')">삭제</button></div>
    </div>`).join("");

  const [Y,M,D]=dS.split("-").map(Number);
  $("rsheet-root").style.display="block";
  $("rsheet-root").innerHTML=`<div class="sheet-back" onclick="closeDay()"></div>
    <div class="sheet"><div class="sheet-grip"></div>
    <div class="sheet-h"><span>${M}월 ${D}일 (${DOWK[dow(dS)]})</span>
      <button class="sheet-x" onclick="closeDay()">✕</button></div>
    <div class="day-hero">
      ${ringSVG(r.pct,{size:76, sw:10})}
      <div>
        <div class="t">${r.planned?(r.full?"계획한 끼니를 다 먹은 날":`${r.planned}끼 중 ${r.eaten}끼`):"계획이 없던 날"}</div>
        <div class="s">${r.planned?`실천 ${Math.round(r.pct*100)}%`:"쉬어 가는 날이에요"}</div>
        ${locked?`<div class="day-lock">🔒 ${LOCKED_MSG}</div>`:``}
      </div>
    </div>
    ${slots}
    ${logs?`<hr class="h"><div class="tiny" style="margin-bottom:8px">이 날의 요리 기록</div><div class="day-logs">${logs}</div>`:``}
    ${!locked&&!logs?`<hr class="h"><div class="tiny">아래 [오늘 뭐 만들었어요?]에서 사진과 메모를 남기면 이 날짜에 함께 담깁니다.</div>`:``}
    </div>`;
}

/* 📤 인스타 스토리 규격(1080×1920) 공유 이미지 — 월 격자 + 채운 날·연속·평균 */
/* 📤 인스타 스토리 카드(1080×1920) — 앱과 같은 얼굴로 나간다(테마를 따름).
   구성은 앱의 [기록] 탭과 동일: 마이크로 라벨 · 히어로 숫자 · 활동 링 격자. */
function shareMonthImage(){
  const ym=CAL.ym||ymOf(todayStr()), [yy,mm]=ym.split("-").map(Number);
  const t=todayStr(), n=daysInMonth(ym), lead=firstDow(ym), st=monthStats(ym), streak=streakDays();
  const W=1080, H=1920, C=document.createElement("canvas"); C.width=W; C.height=H;
  const x=C.getContext("2d");
  const dark=document.documentElement.getAttribute("data-theme")==="dark"
    || (matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.getAttribute("data-theme")!=="light");
  const ACC=dark?"#0a84ff":"#0071e3", ACC2=dark?"#64d2ff":"#4db8ff";
  const INK=dark?"#ffffff":"#1d1d1f", MUTE=dark?"#8b95a3":"#86868b", DIM=dark?"#49525f":"#c9ced6";
  const TRACK=dark?"rgba(255,255,255,.085)":"#e7eaf0";
  const ls=(v)=>{ try{ x.letterSpacing=v; }catch(e){} };   /* 크로미움·사파리 지원, 미지원이면 무시 */

  /* 바탕 — 앱의 페이지 색을 그대로 쓰고, 액센트 후광 두 점으로 깊이만 준다 */
  const g=x.createLinearGradient(0,0,W*0.5,H);
  if(dark){ g.addColorStop(0,"#1b1f26"); g.addColorStop(.55,"#0d0f13"); g.addColorStop(1,"#050608"); }
  else { g.addColorStop(0,"#ffffff"); g.addColorStop(.55,"#f5f6f9"); g.addColorStop(1,"#eef1f6"); }
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const glow=x.createRadialGradient(W*0.88,H*0.10,0,W*0.88,H*0.10,W*0.8);
  glow.addColorStop(0,dark?"rgba(10,132,255,.36)":"rgba(0,113,227,.12)"); glow.addColorStop(1,"rgba(0,113,227,0)");
  x.fillStyle=glow; x.fillRect(0,0,W,H);
  const glow2=x.createRadialGradient(W*0.06,H*0.94,0,W*0.06,H*0.94,W*0.75);
  glow2.addColorStop(0,dark?"rgba(100,210,255,.16)":"rgba(77,184,255,.10)"); glow2.addColorStop(1,"rgba(77,184,255,0)");
  x.fillStyle=glow2; x.fillRect(0,0,W,H);

  x.textAlign="center"; x.textBaseline="alphabetic";

  /* 상단 — 연·월 */
  ls("12px");
  x.fillStyle=MUTE; x.font="800 34px sans-serif";
  x.fillText(`${yy}.${String(mm).padStart(2,"0")}`, W/2+6, 300);
  ls("0px");

  /* 히어로 — 이번 달 꽉 채운 날 */
  x.fillStyle=INK; x.font="900 232px sans-serif";
  x.fillText(String(st.full), W/2, 508);
  ls("10px");
  x.fillStyle=ACC; x.font="800 34px sans-serif";
  x.fillText("꽉 채운 날", W/2+5, 574);
  ls("0px");

  /* 링 격자 — 카드 프레임 없이 바탕 위에 바로 */
  const pad=112, gw=W-pad*2, cell=gw/7, rowH=cell*0.95;
  const R=cell*0.325, SW=cell*0.115, gy=694;
  ls("4px");
  x.fillStyle=DIM; x.font="800 24px sans-serif";
  for(let i=0;i<7;i++) x.fillText(DOWK[i], pad+cell*i+cell/2, gy-34);
  ls("0px");
  for(let d=1; d<=n; d++){
    const idx=lead+d-1, col=idx%7, row=Math.floor(idx/7);
    const ccx=pad+cell*col+cell/2, ccy=gy+row*rowH+R;
    const dS=ym+"-"+String(d).padStart(2,"0"), fut=dS>t, r=dayRing(dS);
    /* 트랙 */
    x.beginPath(); x.arc(ccx,ccy,R,0,Math.PI*2);
    x.strokeStyle=TRACK; x.lineWidth=SW; x.lineCap="butt"; x.shadowBlur=0; x.stroke();
    /* 채움 — 좌상단→우하단 그라디언트, 꽉 찬 날은 글로우 */
    if(!fut && r.pct>0){
      const rg=x.createLinearGradient(ccx-R,ccy-R,ccx+R,ccy+R);
      rg.addColorStop(0,ACC); rg.addColorStop(1,ACC2);
      if(r.full && dark){ x.shadowColor="rgba(10,132,255,.65)"; x.shadowBlur=22; }
      x.beginPath(); x.arc(ccx,ccy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*r.pct);
      x.strokeStyle=rg; x.lineWidth=SW; x.lineCap="round"; x.stroke();
      x.shadowBlur=0;
    }
    x.fillStyle=fut?DIM:(r.full?INK:MUTE);
    x.font=(!fut&&r.full)?"900 25px sans-serif":"700 25px sans-serif";
    x.fillText(String(d), ccx, ccy+9);
  }
  const gBottom=gy+Math.ceil((lead+n)/7)*rowH;

  /* 하단 — 연속 · 평균 실천 */
  const sy=Math.min(gBottom+140, H-430);
  [[String(streak),"연속","일"],[String(st.avg),"계획대로","%"]].forEach((s,i)=>{
    const sx=W/2+(i?1:-1)*196;
    x.fillStyle=INK; x.font="900 74px sans-serif";
    const num=s[0], unit=s[2];
    const wn=x.measureText(num).width;
    x.font="800 30px sans-serif"; const wu=x.measureText(unit).width;
    x.textAlign="left";
    const startX=sx-(wn+wu)/2;
    x.font="900 74px sans-serif"; x.fillStyle=INK; x.fillText(num, startX, sy);
    x.fillStyle=MUTE; x.font="800 30px sans-serif"; x.fillText(unit, startX+wn+4, sy);
    x.textAlign="center";
    ls("6px"); x.fillStyle=MUTE; x.font="700 26px sans-serif"; x.fillText(s[1], sx+3, sy+50); ls("0px");
  });

  /* 워드마크 */
  x.beginPath(); x.moveTo(W/2-34,H-330); x.lineTo(W/2+34,H-330);
  x.strokeStyle=dark?"rgba(255,255,255,.16)":"rgba(0,0,0,.12)"; x.lineWidth=3; x.lineCap="round"; x.stroke();
  ls("8px");
  x.fillStyle=MUTE; x.font="800 28px sans-serif"; x.fillText("식단 매니저", W/2+4, H-272);
  ls("0px");

  /* 네이티브 공유 시트로 넘긴다 — 인스타 스토리·메시지가 그 시트에 바로 뜬다.
     iOS는 '사용자 탭' 문맥에서만 share를 허용하므로 비동기 toBlob을 쓰지 않고
     toDataURL(동기)로 같은 틱 안에서 File을 만든다. */
  const fname="식단기록_"+ym+".jpg";
  let file=null;
  try{
    const url=C.toDataURL("image/jpeg", .92);
    const bin=atob(url.split(",")[1]);
    const buf=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    file=new File([buf], fname, {type:"image/jpeg"});
  }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(()=>{});   /* 사용자가 닫으면 조용히 끝낸다 */
    return;
  }
  /* 공유를 지원하지 않는 환경 — 내려받기로 폴백 */
  C.toBlob(blob=>{
    if(!blob){ toast("이미지를 만들지 못했어요"); return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=fname; a.click(); URL.revokeObjectURL(a.href);
    toast("이미지를 저장했어요 · 스토리에 올려 보세요");
  }, "image/jpeg", .92);
}

/* 입력 중인 칸은 render()로 화면을 다시 그려도 살아남아야 한다.
   (재고 탭에서 재료 이름을 치다가 다른 버튼을 누르면 통째로 지워지던 문제) */
const KEEP_INPUTS = ["mi-name","mi-qty","mi-unit","mi-exp","xm-name","xm-kcal","xm-pro","sl-name","rs-name","rs-ing","rs-steps","rs-tip","rs-kcal","rs-pro","paste-code","re-name","re-ing","re-steps","re-tip","re-kcal","re-pro"];
function snapInputs(){
  const o={};
  try{
    const a=document.activeElement;
    o._focus = a && a.id && KEEP_INPUTS.includes(a.id) ? a.id : null;
    o._sel = o._focus && a.selectionStart!=null ? [a.selectionStart, a.selectionEnd] : null;
    for(const id of KEEP_INPUTS){ const el=document.getElementById(id); if(el && el.value!=="") o[id]=el.value; }
  }catch(e){}
  return o;
}
function restoreInputs(o){
  try{
    for(const id of KEEP_INPUTS){
      if(!(id in o)) continue;
      const el=document.getElementById(id);
      if(el && el.value==="") el.value=o[id];
    }
    if(o._focus){
      const el=document.getElementById(o._focus);
      if(el){ el.focus(); if(o._sel && el.setSelectionRange){ try{ el.setSelectionRange(o._sel[0], o._sel[1]); }catch(e){} } }
    }
  }catch(e){}
}

        <div class="tile"><div class="k">균형</div><div class="v" style="font-size:14px;color:${band.c};line-height:1.25">${totK<floor?"가벼움":totK>cap?"많음":"적정"}</div><div class="s">하루 목표</div></div>
      </div>

    이 30분이 평일 요리를 전부 10분 안쪽으로 만들어 줍니다.</div>`);

function renderStock(){
  /* 한 번도 산 적 없는 재료는 '재고'가 아니라 '앞으로 살 것'이다.
     세 카드에 섞여 있으면 실제로 가진 것을 찾기 어렵다 → 따로 모아 접는다. */
  const st={냉동:[],냉장:[],실온:[]}, none=[];
  const used=usedItemIds();
  for(const id in ITEMS){
    if(!used.has(id) && stockOf(id)<=0) continue;
    const it=ITEMS[id], s=itemState(id), stq=stockOf(id);
    const pct=Math.min(100, stq/it.pack*100);
    const dl=daysLeft(id), e=expiryInfo(id);
    const badge = s.level==="none"?`<span class="badge plain">— 입고 전</span>`
      : s.level==="good"?`<span class="badge good">● ${s.label}</span>`
      : s.level==="warn"?`<span class="badge warn">▲ ${s.label}</span>`
      : s.level==="serious"?`<span class="badge serious">▲ ${s.label}</span>`
      : `<span class="badge crit">⛔ ${s.label}</span>`;
    const qty = it.unit==="g" ? (stq>=1000?(stq/1000).toFixed(1)+"kg":Math.round(stq)+"g") : Math.round(stq*10)/10+it.unit;
    const row=`<div class="inv-item">
      <div class="top"><span class="nm">${it.name}</span>${badge}<span class="qty">${qty} / ${it.packLabel}</span></div>
      <div class="bar"><i style="width:${pct}%; background:${s.level==="crit"?"var(--crit)":s.level==="serious"?"var(--serious)":"var(--accent)"}"></i></div>
      <div class="meta">
        ${(stq<=0&&myStockOf(id).has)?`앱 재고는 0 — 지금은 내 재료(${escH(myStockOf(id).note)})를 쓰는 중`
          :isFinite(dl)?`다 떨어지기까지 약 ${Math.max(0,Math.floor(dl))}일`:"당분간 안 써요"}
        ${(e&&stq>0)?` · 기한 ${e.exp}(D${e.dd>=0?"-"+e.dd:"+"+(-e.dd)})`:""}
        <a class="shop" target="_blank" rel="noopener" href="${coup(it.q)}">쿠팡</a><a class="shop" target="_blank" rel="noopener" href="${kurl(it.q)}">컬리</a>
        <span class="ops">
          <button class="btn sm" onclick="adjust('${id}',-1)">−</button>
          <button class="btn sm" onclick="adjust('${id}',1)">＋</button>
          <button class="btn sm" onclick="inboundOne('${id}')">1팩 채우기</button>
        </span>
      </div>
    </div>`;
    if(s.level==="none") none.push(row);
    else (it.storage.startsWith("냉동")?st.냉동:it.storage.startsWith("냉장")?st.냉장:st.실온).push(row);
  }
  $("view-stock").innerHTML=myStockCard()
    +["냉동","냉장","실온"].map(k=> st[k].length
      ? `<div class="card"><h2>${k==="냉동"?"🧊":k==="냉장"?"🥛":"🌾"} ${k} 보관 <span class="sub">${st[k].length}가지</span></h2>
         ${k==="냉동"?`<div class="tiny" style="margin:-2px 0 8px">재고는 <b>날짜가 지나면 식단대로</b> 줄어들어요([먹었어요] 체크와는 별개예요). 실제와 다르면 ＋/−로 고치세요.</div>`:""}
         <div class="inv">${st[k].join("")}</div></div>`
      : "").join("")
    + (none.length ? foldCard("stocknone", "📥 아직 안 산 재료", none.length+"가지",
        `<div class="tiny" style="margin-bottom:6px">식단에 쓰이지만 한 번도 산 적이 없어요. 얼마나 살지는 [주문] 탭이 계산해 둡니다.</div>`
        + `<div class="inv">${none.join("")}</div>`) : "")
;
}

function buyAmtText(id, v){
  const it=ITEMS[id];
  return it.unit==="g" ? (v>=1000 ? (v/1000).toFixed(1)+"kg" : Math.round(v)+"g")
                       : (Math.ceil(v*10)/10)+it.unit;
}
function buySectionHtml(kind, plan){
  const meta = kind==="bulk"
    ? {t:"📦 이번에 몰아서", note:`냉동육·쌀·김치처럼 팩이 큰 것. 앞으로 ${BUY_BULK_DAYS}일치에서 모자란 만큼이에요.`}
    : {t:"🥬 신선식품 채우기", note:`계란·두부·채소·우유. 상하기 전에 먹을 만큼만 — 앞으로 ${BUY_FRESH_DAYS}일치예요.`};
  if(!plan.length) return `<div class="buy-sec">
    <div class="buy-h">${meta.t}<span class="amt" style="color:var(--good-text)">살 것 없음</span></div>
    <div class="buy-note">지금 가진 것으로 충분해요.</div></div>`;
  const total=plan.reduce((a,x)=>a+x.cost,0), packs=plan.reduce((a,x)=>a+x.packs,0);
  const ship=FREE_SHIP[kind], left=ship.won-total;
  const rows=plan.map(x=>{ const it=ITEMS[x.id];
    /* 지금 형편을 부족한 양과 한 문장으로 붙여 쓴다.
       빨간 배지를 줄마다 달면 거의 모든 줄이 빨개져서 아무것도 구분해 주지 못한다. */
    const 형편 = x.have<=0 ? `<b style="color:var(--crit-text)">지금 없음</b>`
      : `${buyAmtText(x.id,x.have)} 남음`;
    return `<div class="order-row">
      <div><div class="nm">${it.name}</div>
        <div class="qy">${형편} · ${buyAmtText(x.id,x.short)} 모자라 <b>${x.packs}팩</b> (${it.packLabel})${x.myNote?` · 내 재료에 ${escH(x.myNote)} 있음`:""}</div></div>
      <div class="links">${shopLinks(it.q)}</div>
      <div class="pr">${fmt(x.cost)}</div></div>`; }).join("");
  return `<div class="buy-sec">
    <div class="buy-h">${meta.t}<span class="amt">${packs}팩 · ${fmt(total)}</span></div>
    <div class="buy-note">${meta.note}</div>
    ${rows}
    <div class="buy-ship">${left>0
      ? `${ship.name}까지 <b>${fmt(left)}</b> 남았어요.`
      : `${ship.name} 기준을 넘었어요 (${fmt(ship.won)}↑).`}</div>
    <div class="btnrow">
      <button class="btn" onclick="copyBuyList('${kind}')">목록 복사</button>
      <button class="btn primary" onclick="inboundPlan('${kind}')">도착했어요 · ${packs}팩 입고</button>
    </div></div>`;
}
/* 이번 달 쓰는 속도를 보고 제안한다. 자동으로 바꾸지는 않는다. */
function paceCardHtml(){
  const p=paceTier(); if(!p) return "";
  if(p.t===S.tier) return "";
  const up=p.t>S.tier;
  return `<div class="pace ${up?"up":"down"}">
    <div><b>${up?"이번 달, 예산이 남고 있어요":"이번 달, 예산을 앞서 쓰고 있어요"}</b>
      <div class="tiny" style="margin-top:3px">남은 ${p.leftDays}일에 ${fmt(Math.max(0,p.leftWon))} — 이 속도라면 <b>${TIERS[p.t].name}</b> 수준이 맞아요.</div></div>
    <button class="btn sm" onclick="setTier(${p.t})">${up?"메뉴 올리기":"메뉴 낮추기"}</button>
  </div>`;
}
/* 예산 카드를 보고 나면 할 일이 있어야 한다 — 상황에 맞는 다음 걸음 하나. */
function budgetNextHtml(fc){
  if(paceCardHtml()) return "";
  if(fc.left<0)
    return `<div class="btnrow" style="margin-top:10px">
      <button class="btn" style="flex:1" onclick="go('plan')">메뉴·예산 손보기</button></div>`;
  /* 실제로 올릴 수 있는 수준이 있을 때만 권한다.
     예산에 맞춰 이미 가장 높은 수준을 고른 상태라면 눌러도 갈 곳이 없다. */
  const next = TIER_KEYS.find(t=>t>(S.tier||20));
  if(fc.left>0 && next && estimateForTier(next)<=fc.budget)
    return `<div class="btnrow" style="margin-top:10px">
      <button class="btn" style="flex:1" onclick="go('plan')">메뉴 수준 올려 보기</button></div>`;
  return "";
}
function renderOrder(){

    ${fc.total>bud
      ? `<div class="bar2 over"><i class="a" style="width:100%"></i></div>`
      : `<div class="bar2"><i class="a" style="width:${barSpent}%"></i><i class="b" style="width:${Math.max(0,barAll-barSpent)}%"></i></div>`}
    <div class="bgt">
      <div class="bgt-row"><span>한 달 예산</span><b>${fmt(bud)}</b></div>
      <div class="bgt-row"><span>이미 쓴 돈</span><b>${fmt(fc.spent)}</b></div>
      ${fc.spent?`<div class="bgt-row sub2"><span>· 장보기</span><b>${fmt(sp2.grocery)}</b></div>
      <div class="bgt-row sub2"><span>· 외식·간식</span><b>${fmt(sp2.dining)}</b></div>`:""}

            <div class="links">${shopLinks(it.q)}</div>

  /* "첫 달 팁" 카드를 없앴다 — 손으로 셈한 금액 다섯 개로 되어 있었고,

  $("view-order").innerHTML=h;
