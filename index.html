/* ============================================================ 동작 ============================================================ */
function markEaten(k){
  /* 그날이 지나면 잠금 — 소급 체크를 막아야 캘린더 링이 '실제로 지킨 기록'이 된다 */
  if(String(k).split("|")[0] !== todayStr()){ toast(LOCKED_MSG); return; }
  const i=S.eaten.indexOf(k);
  const parts=k.split("|"); const mid=(planFor(dow(parts[0]), weekIndex(parts[0]))||{})[parts[1]];   // 조리 통계용
  if(!S.cookStats) S.cookStats={};
  if(i>=0){ S.eaten.splice(i,1); if(mid&&S.cookStats[mid]>0) S.cookStats[mid]--; }
  else { S.eaten.push(k); if(mid) S.cookStats[mid]=(S.cookStats[mid]||0)+1;
    const j=S.skips.indexOf(k); if(j>=0)S.skips.splice(j,1);
    if(mid&&MEALS[mid]) logAction("'"+MEALS[mid].name+"' 먹음 체크"); }
  render();
  /* 하루 중 몇 끼를 채웠는지 그 자리에서 알려 준다 — 되돌리기도 붙인다. */
  const day=slotsOf(parts[0]).filter(([sl])=>!S.skips.includes(parts[0]+"|"+sl));
  const done=day.filter(([sl])=>S.eaten.includes(parts[0]+"|"+sl)).length;
  const nm=(mid&&MEALS[mid])?MEALS[mid].name:SLOT_SHORT[parts[1]];
  toast((i>=0?"체크 취소 · ":"")+nm+" · 오늘 "+day.length+"끼 중 "+done+"끼",
    ()=>{ const j=S.eaten.indexOf(k);
      if(i>=0){ if(j<0) S.eaten.push(k); if(mid) S.cookStats[mid]=(S.cookStats[mid]||0)+1; }
      else { if(j>=0) S.eaten.splice(j,1); if(mid&&S.cookStats[mid]>0) S.cookStats[mid]--; } });
}
function markSkip(k){
  const i=S.skips.indexOf(k), 전=plannedBuyCost();
  const parts=String(k).split("|"), nm=SLOT_SHORT[parts[1]]||"끼니";
  if(i>=0) S.skips.splice(i,1);
  else { S.skips.push(k); const j=S.eaten.indexOf(k); if(j>=0) S.eaten.splice(j,1); }
  render();
  /* 누르고 나서 아무 말도 없으면 눌린 건지도 모른다. 무엇이 달라졌는지 그 자리에서 말한다.
     금액이 그대로일 때도 말해야 한다 — 재료는 줄었는데 팩은 통째로 사야 해서 낼 돈이 같은 것뿐이다.
     말하지 않으면 "걸렀는데 왜 그대로지?"가 되고, 앱이 적어 둔 설명과 어긋나 보인다. */
  const 차=plannedBuyCost()-전;
  const 말 = (i>=0) ? nm+" 다시 챙겨요"
    : nm+" 걸렀어요 · " + (Math.abs(차)>=100 ? "살 것 "+fmt(Math.abs(차))+" 줄었어요"
                                            : "살 것 금액은 그대로예요(팩 단위로 사서요)");
  toast(말, ()=>{ const j=S.skips.indexOf(k); if(i>=0){ if(j<0) S.skips.push(k); } else if(j>=0) S.skips.splice(j,1); });
}

function adjust(id,dir){
  const it=ITEMS[id]; if(!it) return;
  let delta=dir*it.step;
  if(delta<0){
    const have=rawStockOf(id);
    if(have<=0){ toast(it.name+"은 이미 0이에요"); return; }
    delta=-Math.min(-delta, have);            /* 0 아래로는 내려가지 않는다 */
  }
  const rec={id:uid("ib"), adjust:true, date:todayStr(), itemId:id, packs:delta/it.pack, price:0};
  S.inbound.push(rec);
  logAction(it.name+" 재고 "+(dir>0?"＋":"－")+"보정");
  render();
  toast(it.name+" "+(delta>0?"＋":"−")+fmtAmt(id, Math.abs(delta)), ()=>{ dropInbound([rec]); });
}
/* 재료 양을 사람이 읽는 단위로 */
function fmtAmt(id, g){
  const it=ITEMS[id]; if(!it) return String(g);
  if(it.unit==="g") return g>=1000 ? (g/1000).toFixed(1)+"kg" : Math.round(g)+"g";
  return (Math.round(g*10)/10)+it.unit;
}
/* 끼니를 거른 이유는 대개 외식이다. 그 자리에서 금액을 남길 수 있게 한다. */
function logDining(key){
  const parts=String(key).split("|");
  const label=(SLOT_SHORT[parts[1]]||"외식")+" 외식";
  const old=(S.inbound||[]).find(r=>r&&r.diningKey===key);
  const p=prompt(label+" — 얼마 쓰셨어요? (원)", old?old.price:"");
  if(p===null) return;
  const won=Math.max(0, Math.round(+String(p).replace(/[^0-9]/g,"")||0));
  const prev=old?{...old}:null;
  if(old) S.inbound=S.inbound.filter(r=>r!==old);
  let rec=null;
  if(won>0){ rec={id:uid("ib"), date:parts[0]||todayStr(), itemId:"extra", packs:0, price:won, label, diningKey:key};
    S.inbound.push(rec); }
  render();
  toast(won>0?label+" "+fmt(won):"외식비를 지웠어요", ()=>{
    if(rec) S.inbound=S.inbound.filter(r=>r!==rec);
    if(prev) S.inbound.push(prev);
  });
}
function extraSpend(label, def){
  const p=prompt(label+" — 실제 결제금액(원)을 입력하세요.", def);
  if(p===null) return;

}
function inboundOne(id){
  /* 한 품목만 넣을 때도 같다 — 묻지 않고 표준가로 적는다 */
  const rec={id:uid("ib"), date:todayStr(), itemId:id, packs:1, price:ITEMS[id].price};
  S.inbound.push(rec);
  logAction(ITEMS[id].name+" 입고");
  render();
  toast(ITEMS[id].name+" 1팩 채웠어요 · "+rec.price.toLocaleString()+"원", ()=>{ dropInbound([rec]); });

/* 방금 넣은 입고 줄을 정확히 그것만 뺀다(참조 → id 순으로 찾는다) */
function dropInbound(recs){
  for(const r of recs){
    let i=S.inbound.indexOf(r);
    if(i<0 && r && r.id) i=S.inbound.findIndex(x=>x && x.id===r.id);
    if(i>=0) S.inbound.splice(i,1);
  }
}
/* ── 입고·지출 내역 — 화면에서 직접 보고 고치고 지운다 ───────────────── */
function inboundName(r){
  if(r.itemId==="extra") return r.label||"따로 쓴 돈";
  const nm=(ITEMS[r.itemId]&&ITEMS[r.itemId].name)||r.itemId;
  return r.adjust ? nm+" 재고 보정" : nm;
}
function inboundQty(r){
  if(r.itemId==="extra"||!ITEMS[r.itemId]) return "";
  const it=ITEMS[r.itemId];
  if(r.adjust){
    const g=(r.packs||0)*it.pack;
    return (g>0?"＋":"−")+fmtAmt(r.itemId, Math.abs(g))+(r.legacy?" · 예전 기록에서 옮김":"");
  }
  return (r.packs||0)+"팩 · "+it.packLabel;
}
function deleteInbound(id){
  const i=S.inbound.findIndex(r=>r&&r.id===id); if(i<0) return;
  const gone=S.inbound[i];
  S.inbound.splice(i,1); render();
  toast(inboundName(gone)+" 기록 삭제", ()=>{ S.inbound.splice(Math.min(i,S.inbound.length),0,gone); });
}
function deleteInboundBatch(bid){
  const gone=S.inbound.map((r,i)=>({r,i})).filter(x=>x.r&&x.r.batch===bid);
  if(!gone.length) return;
  /* 묻지 않는다 — 바로 아래 [되돌리기]가 6초간 떠 있다 */
  S.inbound=S.inbound.filter(r=>!(r&&r.batch===bid)); render();
  toast(gone.length+"개 기록 삭제", ()=>{ for(const x of gone) S.inbound.splice(Math.min(x.i,S.inbound.length),0,x.r); });
}
function editInboundPrice(id){
  const r=S.inbound.find(x=>x&&x.id===id); if(!r) return;
  const p=prompt(inboundName(r)+" — 실제 결제금액(원)", r.price||0);
  if(p===null) return;
  const before=r.price||0;
  r.price=Math.max(0, Math.round(+String(p).replace(/[^0-9.-]/g,"")||0));
  render();
  toast("금액을 "+r.price.toLocaleString()+"원으로 고쳤어요", ()=>{ r.price=before; });
}
function editInboundPacks(id, delta){
  const r=S.inbound.find(x=>x&&x.id===id); if(!r||r.itemId==="extra") return;
  const before=r.packs||0;
  const next=Math.max(0, before+delta);
  if(next===before) return;
  r.packs=next;
  if(next===0){ deleteInbound(id); return; }
  render();
  toast(inboundName(r)+" "+next+"팩", ()=>{ r.packs=before; });
}
function toggleLedger(){ S.ledgerAll=!S.ledgerAll; render(); }
function ledgerCardHtml(){
  const all=(S.inbound||[]).slice().sort((a,b)=> (b.date||"").localeCompare(a.date||"") || String(b.id||"").localeCompare(String(a.id||"")));
  if(!all.length) return `<div class="card"><h2>🧾 장보기·지출 기록</h2>
    <div class="muted">아직 기록이 없어요. 물건이 도착하면 [도착했어요]를 누르세요. 잘못 눌러도 여기서 바로 지울 수 있습니다.</div></div>`;
  const m=todayStr().slice(0,7);
  const showAll=!!S.ledgerAll;
  const rows=showAll?all:all.filter(r=>(r.date||"").slice(0,7)===m);
  const monthTotal=all.filter(r=>(r.date||"").slice(0,7)===m).reduce((a,r)=>a+(r.price||0),0);
  const older=all.length-all.filter(r=>(r.date||"").slice(0,7)===m).length;
  const seenBatch={};
  const body = rows.length ? rows.map(r=>{
    const q=inboundQty(r);

      head=`<div class="led-batch">

        <span class="led-act"><button class="del" onclick="deleteInboundBatch('${r.batch}')">묶음 삭제</button></span></div>`;
    }
    const packable = r.itemId!=="extra" && ITEMS[r.itemId] && !r.adjust;
    return head+`<div class="led">
      <div class="led-top">
        <span class="led-nm">${escH(inboundName(r))}</span>
        <span class="led-pr">${fmt(r.price||0)}</span>
      </div>
      <div class="led-bot">
        <span class="led-sub">${r.date}${q?" · "+q:""}</span>
        <span class="led-act">
          ${packable?`<button onclick="editInboundPacks('${r.id}',-1)" aria-label="한 팩 줄이기">−</button><button onclick="editInboundPacks('${r.id}',1)" aria-label="한 팩 늘리기">＋</button>`:""}
          ${r.adjust?"":`<button onclick="editInboundPrice('${r.id}')">금액</button>`}
          <button class="del" onclick="deleteInbound('${r.id}')">삭제</button>
        </span>
      </div></div>`;
  }).join("") : `<div class="muted">이번 달 기록이 없어요.</div>`;
  return `<div class="card"><h2>🧾 장보기·지출 기록 <span class="sub">${showAll?"전체 "+all.length+"건":"이번 달 "+fmt(monthTotal)}</span></h2>
    <div class="tiny" style="margin-bottom:6px">장을 보고 [도착했어요]를 누른 기록이 여기 쌓여요. 실제 결제액이 다르면 <b>[금액]</b>으로 고치고, 잘못 눌렀으면 <b>[묶음 삭제]</b>로 그 장보기를 통째로 지울 수 있어요.</div>
    ${body}
    ${older>0?`<div class="btnrow" style="margin-top:8px"><button class="btn ghost" onclick="toggleLedger()">${showAll?"이번 달만 보기":"지난 기록도 보기 ("+older+"건)"}</button></div>`:""}
  </div>`;
}
function inboundPlan(kind){
  const plan=(buyPlan()[kind]||[]);
  if(!plan.length){ toast("채울 것이 없어요"); return; }
  const total=plan.reduce((a,x)=>a+x.cost,0), packs=plan.reduce((a,x)=>a+x.packs,0);
  /* 예전에는 "실제 결제 총액을 입력하세요" 창이 떴다. 장을 보고 돌아온 사람에게
     가장 중요한 순간인데 시스템 창이 길을 막았고, 빈 칸으로 확인하면 장보기 전체가
     0원으로 기록됐다. 이제 표준가로 바로 적고, 다르면 [내역]의 [금액]에서 고친다. */
  const d=todayStr(), bid=uid("bt"), added=[];
  for(const x of plan){ const rec={id:uid("ib"), batch:bid, date:d, itemId:x.id, packs:x.packs, price:x.cost};
    S.inbound.push(rec); added.push(rec); }
  logAction("장보기 "+packs+"팩 입고");
  render();
  toast(packs+"팩 · "+total.toLocaleString()+"원 채웠어요", ()=>{ dropInbound(added); });
}
/* [목록 복사] — 붙여넣어 그대로 주문할 수 있게 팩 수와 합계까지 넣는다 */

    return `- ${it.name} ${it.packLabel} × ${x.packs}팩 (약 ${x.cost.toLocaleString()}원) → 검색어: ${it.q}`; }).join("\n")
    +`\n합계 약 ${plan.reduce((a,x)=>a+x.cost,0).toLocaleString()}원`;

/* 접히는 카드 — 새로 열면 다시 접힌다(자주 보는 것이 아니라서 기억해 둘 이유가 없다) */
let FOLD={};
function toggleFold(k){ FOLD[k]=!FOLD[k]; render(); }
function foldCard(k, title, sub, bodyHtml, openByDefault){

    <button class="fold-h" aria-expanded="${on}" onclick="toggleFold('${k}')">
      <h2>${title}${sub?`<span class="sub">${sub}</span>`:""}</h2><span class="fx">${on?"▾":"▸"}</span>
    </button>
    ${on?`<div class="fold-b">${bodyHtml}</div>`:""}</div>`;
}
function resetRecords(){

function doInstall(){ if(!_installEvt) return; _installEvt.prompt(); _installEvt.userChoice.finally(()=>{ _installEvt=null; try{render();}catch(_){} }); }
function installCardHtml(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let body;
  if(IS_NATIVE) body=`<div class="muted">✅ 앱으로 실행 중이에요. 기록은 이 기기에 자동 저장되고, 오프라인에서도 동작합니다.</div>`;
  else if(isStandalone()) body=`<div class="muted">✅ 홈 화면 앱으로 실행 중이에요. 오프라인에서도 열립니다.</div>`;

  else if(_installEvt) body=`<div class="muted" style="margin-bottom:8px">홈 화면에 설치하면 앱처럼 전체화면으로 열리고, 인터넷이 끊겨도 동작해요.</div><div class="btnrow"><button class="btn primary" onclick="doInstall()">📲 홈 화면에 설치</button></div>`;
  else if(ios) body=`<div class="muted">사파리 하단 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르면 앱으로 설치돼요.</div>`;
  else body=`<div class="muted">브라우저 메뉴(⋮)에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르면 앱으로 설치돼요.</div>`;
  return `<div class="card"><h2>📲 앱으로 설치</h2>${body}</div>`;
}
/* 첫 실행 온보딩 — 가로로 넘기는 사용법 슬라이드(설정에서 다시 보기 가능) */
const INTRO_KEY="mealapp_intro_v2";
/* 설명문이 스스로 낡지 않게 — 숫자는 문장에 적지 않고 실제 값에서 읽어 채운다.
   {레시피수} 처럼 써 두면 화면에 그릴 때 지금 값으로 바뀐다.
   손으로 적은 숫자는 기능이 바뀌어도 따라오지 않아, 결국 앱이 자기와 다른 말을 하게 된다. */
function copyVars(){
  return {
    레시피수: (typeof RECIPES!=="undefined" ? RECIPES.length : 0) + Object.keys(MEALS).length,
    메뉴수: Object.keys(MEALS).length,
    재료수: Object.keys(ITEMS).length,
    기본열량: DAILY_KCAL_CAP.toLocaleString(),
    기본단백질: DAILY_PRO_TARGET,
    몰아서일수: BUY_BULK_DAYS,
    신선일수: BUY_FRESH_DAYS,
    기한임박일: LEAD_DAYS + 1,
  };
}
/* 같은 규칙을 세 곳에 각각 적어 두면 규칙이 바뀔 때 한 곳만 고치게 된다 */
const LOCKED_MSG = "지난 날짜는 고칠 수 없어요";
function fillCopy(s){
  const v=copyVars();
  /* \w 는 한글을 못 잡는다 — 이름표는 한글로 쓰므로 중괄호 안을 통째로 본다 */
  return String(s).replace(/\{([^{}\s]+)\}/g, (m,k)=> (k in v) ? v[k] : m);
}

  { art:"🧺", step:"", t:"직접 산 재료도,<br>우리집 레시피도",
    d:"앱 목록에 없는 재료를 <b>[재고]</b> 탭에 적어 두면 그 재료로 만들 수 있는 요리를 찾아 드려요. <b>{레시피수}가지 레시피</b> 검색과 내 레시피 등록도 됩니다." },

];
let _obIdx=0;
function obHtml(){
  return `<div class="ob" id="ob-root">
    <div class="ob-top"><button class="ob-skip" onclick="closeIntro()">건너뛰기</button></div>
    <div class="ob-track" id="ob-track">
      ${OB_SLIDES.map(sl=>`<div class="ob-slide">
        <div class="ob-art">${sl.art}</div>
        ${sl.step?`<div class="ob-step">${sl.step}</div>`:""}
        <div class="ob-t">${fillCopy(sl.t)}</div>
        <div class="ob-d">${fillCopy(sl.d)}</div>
      </div>`).join("")}
    </div>
    <div class="ob-bot">
      <div class="ob-hint" id="ob-hint"><b>←</b> 옆으로 밀면 이전 화면</div>
      <div class="ob-dots" id="ob-dots">${OB_SLIDES.map((_,i)=>`<button type="button" class="ob-dot${i===0?" on":""}" aria-label="${i+1}번째 안내로" onclick="obGo(${i})"></button>`).join("")}</div>
      <button class="btn primary ob-cta" id="ob-cta" onclick="obNext()">다음</button>
    </div>
  </div>`;
}
function obSync(){
  const tr=document.getElementById("ob-track"); if(!tr) return;
  const w=tr.clientWidth||1;
  const i=Math.max(0, Math.min(OB_SLIDES.length-1, Math.round(tr.scrollLeft/w)));
  if(i===_obIdx) return;
  _obIdx=i;
  const dots=document.getElementById("ob-dots");
  if(dots) [...dots.children].forEach((d,k)=>d.classList.toggle("on", k===i));
  const hint=document.getElementById("ob-hint");
  if(hint) hint.classList.toggle("on", i>0);           // 2번째 화면부터 "밀면 이전" 안내
  const cta=document.getElementById("ob-cta");
  if(cta) cta.textContent = (i===OB_SLIDES.length-1) ? "시작하기" : "다음";
}
/* 앞으로는 [다음] 버튼, 뒤로는 손으로 미는 스와이프가 기본.
   화살표키·점 탭은 손가락을 못 쓰는 환경(PC 등)을 위한 보조 수단. */
function obGo(i){
  const tr=document.getElementById("ob-track"); if(!tr) return;
  i=Math.max(0, Math.min(OB_SLIDES.length-1, i));
  const w=tr.clientWidth||1;
  const far=Math.abs(i-_obIdx)>1;   // 두 칸 이상 건너뛰면(점 탭) 중간 화면을 훑지 않고 바로 이동
  try{ tr.scrollTo({left:i*w, behavior: far?"auto":"smooth"}); }catch(e){ tr.scrollLeft=i*w; }
  setTimeout(obSync, far?60:380);
}
function obNext(){ if(_obIdx>=OB_SLIDES.length-1){ closeIntro(); return; } obGo(_obIdx+1); }
function obPrev(){ if(_obIdx>0) obGo(_obIdx-1); }
function obKey(e){
  if(!document.getElementById("ob-root")) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); obPrev(); }
  else if(e.key==="ArrowRight"&&_obIdx<OB_SLIDES.length-1){ e.preventDefault(); obGo(_obIdx+1); }
}
function openIntro(){
  if(document.getElementById("ob-root")) return;
  _obIdx=0;
  const d=document.createElement("div"); d.id="ob-wrap"; d.innerHTML=obHtml();
  document.body.appendChild(d);
  const tr=document.getElementById("ob-track");
  if(tr){ tr.scrollLeft=0; tr.addEventListener("scroll", obSync, {passive:true}); }
  document.addEventListener("keydown", obKey);
}
/* 소개가 끝나면 시간표 한 장. [식단표]의 그 화면을 그대로 쓴다. */
const SETUP_KEY="mealapp_setup_v1";
function setupDone(){ try{ return !!localStorage.getItem(SETUP_KEY); }catch(e){ return true; } }
function openSetup(){
  if(document.getElementById("setup-wrap")) return;
  const d=document.createElement("div"); d.id="setup-wrap";
  d.innerHTML=`<div class="setup-back"></div>
    <div class="setup-box" role="dialog" aria-label="내 식사 시간표">
      <h2 style="font-size:18px;margin:0 0 4px">시작 전에</h2>
      <div class="tiny" style="margin-bottom:2px">쓰는 목적, 챙겨 먹는 끼니, 한 달 식비 — 이 셋만 고르면 시작이에요. 나중에 언제든 바꿀 수 있어요.</div>
      <div id="setup-body">${setupBodyHtml()}</div>
      <div class="setup-cta">
        <button class="btn primary" style="width:100%" onclick="closeSetup()">이대로 시작하기</button>
      </div>
    </div>`;
  document.body.appendChild(d);
}
function closeSetup(){
  try{ localStorage.setItem(SETUP_KEY,"1"); }catch(e){}
  /* 시작 화면에서 본 그 금액이 이 사람이 정한 값이다.
     여기서 못 박지 않으면, 나중에 인분이나 끼니를 바꿀 때 앱이 예산을 멋대로 다시 계산한다. */
  S.budgetSet=true;
  const w=document.getElementById("setup-wrap"); if(w) w.remove();
}
function maybeIntro(){
  try{
    if(!lsAvailable()) return;
    if(!localStorage.getItem(INTRO_KEY)){ openIntro(); return; }
    /* 소개만 넘기고 나간 사람 — 아직 아무것도 정하지 않았으면 다시 묻는다 */
    if(!setupDone()) openSetup();
  }catch(e){}
}
function closeIntro(){
  try{ localStorage.setItem(INTRO_KEY,"1"); }catch(e){}
  document.removeEventListener("keydown", obKey);
  const w=document.getElementById("ob-wrap"); if(w) w.remove();
  const old=document.getElementById("intro-root"); if(old) old.remove();   // 구버전 잔재
  if(!setupDone()) openSetup();
}
function guideCardHtml(){

    <div class="muted">이 앱은 <b>로그인·회원가입이 없어요.</b> 열자마자 바로 쓰고, 모든 기록은 이 기기에 자동 저장됩니다. 서버로 전송되는 정보는 없어요.</div>
    <div class="tiny" style="margin-top:8px">기기를 바꿀 때는 아래 <b>[기록 저장·복원]</b>에서 내보내기 → 새 기기에서 가져오기 한 번이면 그대로 이어집니다.</div>
    <div class="btnrow"><button class="btn" onclick="openIntro()">🔁 사용법 다시 보기</button></div></div>`;

function _bootMsg(txt){ try{ var d=document.createElement("div");
  d.setAttribute("style","margin:14px;padding:14px;border:1px solid #ff2d2d;border-radius:12px;background:#fff;color:#111;font:14px/1.6 -apple-system,system-ui,sans-serif");
  d.innerHTML=txt; document.body.insertBefore(d, document.body.firstChild); }catch(_){} }
/* ===== 확대(줌) 고정 ===== */
function lockZoom(){
  try{
    var stop=function(e){ e.preventDefault(); };
    ["gesturestart","gesturechange","gestureend"].forEach(function(t){
      document.addEventListener(t, stop, {passive:false});
    });
    document.addEventListener("dblclick", stop, {passive:false});
    document.addEventListener("touchstart", function(e){
      if(e.touches && e.touches.length>1) e.preventDefault();
    }, {passive:false});
  }catch(e){}
}
function boot(){
  try{ loadLocal(); }catch(e){}
  try{ loadFeed(); }catch(e){}
  try{ applyTheme(); }catch(e){}
  try{ lockZoom(); }catch(e){}
  try{ render(); }
  catch(e){ _bootMsg("앱을 그리는 중 문제가 생겼어요. 카카오톡 인앱 화면 대신 <b>사파리·크롬</b>으로 열면 정상 동작합니다.<br><span style=\"color:#888;font-size:12px\">("+(e&&e.message||e)+")</span>"); }
  try{ nativeInit(); }catch(e){}
  try{ pwaInit(); }catch(e){}
  try{ maybeIntro(); }catch(e){}
  /* 안전장치: 조금 뒤에도 본문이 비면 안내(인앱 브라우저가 JS를 제한하는 경우) */
  setTimeout(function(){ try{ var v=document.getElementById("view-today");
    if(v && v.innerHTML.trim()===""){ _bootMsg("화면이 비어 보이면, 이 파일을 카카오톡 인앱 화면 말고 <b>사파리·크롬</b>으로 열어 주세요. (파일 열 때 “<b>브라우저로 열기</b>” 선택)"); }
  }catch(_){} }, 500);
}
boot();
