<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>한달식단 매니저 — 운동·식비 관리</title>
<style>
/* ============ 디자인 시스템 v3 — Apple HIG · Liquid Glass (시스템 그레이 + 애플 블루 + 유리 바 + 흰 카드) ============ */
:root{
  color-scheme: light;
  --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out-strong: cubic-bezier(0.77, 0, 0.175, 1);
  --surface-1:#ffffff; --page:#f5f5f7;
  --ink-1:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
  --grid:#f0f0f2; --axis:#e3e3e8; --ring:#ececf0;
  --accent:#0071e3; --accent-soft:#e8f2ff;
  --good:#34c759; --good-text:#1f9d4d; --warn:#ff9500; --serious:#ff6b35; --crit:#ff3b30;
  --good-bg:rgba(52,199,89,.12); --warn-bg:rgba(255,149,0,.12); --serious-bg:rgba(255,107,53,.12); --crit-bg:rgba(255,59,48,.10);
  --navbar:rgba(255,255,255,.78); --navbar-on:#0071e3; --navbar-off:#86868b;
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.88); --hairline:rgba(0,0,0,.07);
  /* Liquid Glass: 유리 틴트·135° 좌상단 스펙큘러 림·iOS26 2단 그림자 */
  --glass-tint:rgba(210,220,240,.12); --glass-sat:120%;
  --rim-hi:rgba(255,255,255,.55); --rim-lo:rgba(255,255,255,.10); --sheen:rgba(255,255,255,.42);
  --elev:0 2px 8px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.02);
  --elev-float:0 8px 28px rgba(0,0,0,.13), 0 2px 6px rgba(0,0,0,.05);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:100ms; --dur:200ms; --dur-slow:300ms;
  --r-sm:8px; --r-md:16px; --r-lg:20px; --r-cap:9999px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1c1c1e; --page:#000000;
  --ink-1:#f5f5f7; --ink-2:#9a9aa0; --ink-3:#6e6e76;
  --grid:#2c2c2e; --axis:#38383a; --ring:rgba(255,255,255,.07);
  --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
  --good:#30d158; --good-text:#30d158; --warn:#ff9f0a; --serious:#ff7d5c; --crit:#ff453a;
  --good-bg:rgba(48,209,88,.14); --warn-bg:rgba(255,159,10,.14); --serious-bg:rgba(255,125,92,.14); --crit-bg:rgba(255,69,58,.14);
  --navbar:rgba(28,28,30,.8); --navbar-on:#2997ff; --navbar-off:#7c7c81;
  --glass:rgba(28,28,30,.72); --glass-strong:rgba(28,28,30,.88); --hairline:rgba(255,255,255,.09);
  --glass-tint:rgba(255,255,255,.08); --glass-sat:120%;
  --rim-hi:rgba(255,255,255,.16); --rim-lo:rgba(255,255,255,.04); --sheen:rgba(255,255,255,.10);
  --elev:0 2px 8px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.20);
  --elev-float:0 8px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#1c1c1e; --page:#000000;
    --ink-1:#f5f5f7; --ink-2:#9a9aa0; --ink-3:#6e6e76;
    --grid:#2c2c2e; --axis:#38383a; --ring:rgba(255,255,255,.07);
    --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
    --good:#30d158; --good-text:#30d158; --warn:#ff9f0a; --serious:#ff7d5c; --crit:#ff453a;
    --good-bg:rgba(48,209,88,.14); --warn-bg:rgba(255,159,10,.14); --serious-bg:rgba(255,125,92,.14); --crit-bg:rgba(255,69,58,.14);
    --navbar:rgba(28,28,30,.8); --navbar-on:#2997ff; --navbar-off:#7c7c81;
    --glass:rgba(28,28,30,.72); --glass-strong:rgba(28,28,30,.88); --hairline:rgba(255,255,255,.09);
    --glass-tint:rgba(255,255,255,.08); --glass-sat:120%;
    --rim-hi:rgba(255,255,255,.16); --rim-lo:rgba(255,255,255,.04); --sheen:rgba(255,255,255,.10);
    --elev:0 2px 8px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.20);
    --elev-float:0 8px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  }
}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; overflow-x:clip; touch-action:manipulation }
body{ touch-action:manipulation }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
body{margin:0; background:var(--page); color:var(--ink-1);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px; line-height:1.55; padding-bottom:calc(96px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased; letter-spacing:-.01em}
.wrap{max-width:760px; margin:0 auto; padding:14px 16px 24px}
header.app{position:sticky; top:0; z-index:40; border-bottom:0;
  background:linear-gradient(var(--glass-tint),var(--glass-tint)), var(--glass);
  -webkit-backdrop-filter:saturate(var(--glass-sat)) blur(20px); backdrop-filter:saturate(var(--glass-sat)) blur(20px);
  box-shadow:inset 0 1px 0 var(--rim-hi);
  display:flex; align-items:center; gap:8px; padding:calc(12px + env(safe-area-inset-top)) 6px 12px; margin:-14px -16px 16px}
/* ProgressiveBlur — 바 아래로 갈수록 흐림이 사라져 콘텐츠가 '녹아' 끝난다(하드 컷 라인 제거) */
header.app::after{content:""; position:absolute; top:100%; left:0; right:0; height:22px; pointer-events:none;
  -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px);
  -webkit-mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%);
  mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%)}
.ab-side{width:40px; display:flex; align-items:center; justify-content:flex-end}
.ab-side.l{justify-content:flex-start}
.ab-title{flex:1; text-align:center; min-width:0}
header.app h1{font-size:17px; margin:0; font-weight:800; letter-spacing:-.3px}
header.app .date{color:var(--ink-3); font-size:11.5px; letter-spacing:0; margin-top:1px}
.theme-btn{border:0; background:none; color:var(--ink-2); font-size:17px; cursor:pointer; padding:6px 8px; line-height:1; border-radius:10px;
  transition:transform 120ms var(--ease-out-strong)}
.theme-btn:active{transform:scale(.9)}
/* stat tiles */
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:4px 0 14px}
@media (max-width:560px){ .tiles{grid-template-columns:repeat(2,1fr)} }
.tile{background:var(--surface-1); border:1px solid var(--ring); border-radius:var(--r-lg); padding:14px 15px; box-shadow:var(--elev)}
.tile .k{font-size:12px; color:var(--ink-3); margin-bottom:3px; font-weight:600}
.tile .v{font-size:22px; font-weight:800; letter-spacing:-.5px}
.tile .s{font-size:11.5px; color:var(--ink-2); margin-top:1px}
.tile .bar{height:7px; background:var(--grid); border-radius:5px; margin-top:9px; overflow:hidden}
.tile .bar i{display:block; height:100%; background:var(--accent); border-radius:5px}
/* tabs */
nav.tabs{position:fixed; bottom:calc(10px + env(safe-area-inset-bottom)); left:12px; right:12px; max-width:600px; margin:0 auto;
  background:linear-gradient(var(--glass-tint),var(--glass-tint)), var(--navbar);
  -webkit-backdrop-filter:saturate(var(--glass-sat)) blur(22px); backdrop-filter:saturate(var(--glass-sat)) blur(22px);
  border:1px solid var(--hairline); border-radius:var(--r-cap); overflow:hidden; isolation:isolate;
  display:flex; z-index:50; box-shadow:var(--elev-float), inset 0 1px 0 var(--rim-hi), inset 0 -1px 0 var(--rim-lo)}
/* 135°(좌상단) 광원 스펙큘러 — 유리 윗면이 빛을 받는 느낌 */
nav.tabs::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:-1; border-radius:inherit;
  background:linear-gradient(135deg, var(--sheen) 0%, rgba(255,255,255,0) 42%)}
nav.tabs button{flex:1; border:0; background:none; color:var(--navbar-off); font-size:10.5px;
  margin:5px 3px; border-radius:var(--r-cap); padding:8px 0 7px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:600;
  transition:transform var(--dur) var(--ease-spring), color var(--dur-fast) ease, background-color var(--dur) ease}
nav.tabs button:active{transform:scale(.9)}
nav.tabs button .ico{width:23px; height:23px; display:block}
nav.tabs button .ico svg{width:23px; height:23px; display:block; stroke:currentColor; fill:none; stroke-width:1.8}
nav.tabs button.on{color:var(--navbar-on); font-weight:800; background:var(--accent-soft); box-shadow:inset 0 1px 0 var(--rim-hi)}
/* cards */
.card{background:var(--surface-1); border:1px solid var(--ring); border-radius:var(--r-lg); padding:17px 18px; margin-bottom:12px;
  box-shadow:var(--elev)}
.card h2{font-size:15.5px; margin:0 0 10px; display:flex; align-items:center; gap:7px; font-weight:800; letter-spacing:-.2px}
.card h2 .sub{font-weight:500; font-size:12px; color:var(--ink-3); margin-left:auto}
.muted{color:var(--ink-2); font-size:13.5px}
.tiny{color:var(--ink-3); font-size:12px}
hr.h{border:0; border-top:1px solid var(--grid); margin:12px 0}
/* buttons */
.btn{border:0; background:var(--grid); color:var(--ink-1);
  border-radius:var(--r-cap); min-height:48px; padding:12px 18px; font-size:14px; cursor:pointer; font-weight:700; letter-spacing:-.2px;
  transition:transform var(--dur) var(--ease-spring), background-color var(--dur-fast) ease, opacity var(--dur-fast) ease}
.btn:active{transform:scale(.955)}
@media (hover: hover) and (pointer: fine){
  .btn:hover{filter:brightness(.97)}
  .btn.primary:hover{filter:brightness(1.06)}
  a.shop:hover{filter:brightness(.96)}
}
.btn.primary{background:var(--accent); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.btn.dark{background:var(--ink-1); color:var(--surface-1)}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.sm{padding:8px 13px; font-size:12.5px; border-radius:var(--r-cap); min-height:0; font-weight:600; background:var(--grid)}
.btn:disabled{opacity:.4; cursor:default}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
/* badges */
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700;
  border-radius:20px; padding:3px 9px}
.badge.good{color:var(--good-text); background:var(--good-bg)}
.badge.warn{color:var(--warn); background:var(--warn-bg)}
:root[data-theme="dark"] .badge.warn{color:var(--warn)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge.warn{color:var(--warn)} }
.badge.serious{color:var(--serious); background:var(--serious-bg)}
:root[data-theme="dark"] .badge.serious{color:var(--serious)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge.serious{color:var(--serious)} }
.badge.crit{color:var(--crit); background:var(--crit-bg)}
.badge.plain{color:var(--ink-2); background:var(--grid)}
/* meal card */
.meal .name{font-size:17px; font-weight:800; letter-spacing:-.3px}
.meal .nutri{font-size:12.5px; color:var(--ink-2); margin:3px 0 8px}
.meal ul{margin:6px 0 0; padding-left:18px; font-size:13px; color:var(--ink-2)}
.meal .recipe{font-size:13px; color:var(--ink-2); margin-top:9px; background:var(--grid);
  border-radius:14px; padding:11px 13px}
.state-line{margin-top:9px; font-size:12.5px; color:var(--ink-2)}
details.rsteps{margin-top:7px}
details.rsteps summary{cursor:pointer; font-size:12.5px; color:var(--accent); font-weight:700; list-style:none; user-select:none;
  transition:transform 120ms var(--ease-out-strong)}
details.rsteps summary::-webkit-details-marker{display:none}
details.rsteps summary::before{content:"▸"; display:inline-block; margin-right:5px;
  transition:transform 200ms var(--ease-out-strong)}
details.rsteps[open] summary::before{transform:rotate(90deg)}
details.rsteps summary:active{transform:scale(.98)}
details.rsteps[open] > *:not(summary){animation:contentIn 180ms var(--ease-out-strong)}
@keyframes contentIn{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
details.rsteps ol{margin:8px 0 0; padding-left:20px; line-height:1.65}
details.rsteps li{margin-bottom:5px}
.rtip{margin-top:7px; font-size:12.5px; color:var(--ink-2)}
/* inventory */
.inv{display:flex; flex-direction:column; gap:9px}
.inv-item{background:var(--grid); border-radius:14px; padding:12px 14px}
.inv-item .top{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.inv-item .nm{font-weight:700; font-size:14px}
.inv-item .qty{margin-left:auto; font-size:12.5px; color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums}
.inv-item .bar{height:7px; background:var(--axis); border-radius:5px; margin:8px 0 6px; overflow:hidden}
.inv-item .bar i{display:block; height:100%; border-radius:5px; background:var(--accent)}
.inv-item .meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11.5px; color:var(--ink-3)}
/* 버튼이 늘어난 줄(쿠팡·컬리·레시피 보기·수량·삭제)은 다음 줄로 넘겨 글자가 쪼개지지 않게 한다 */
.inv-item .ops{margin-left:auto; display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; align-items:center}
.inv-item .meta > .ops{flex:1 0 100%; margin-top:7px}
.inv-item .btn.sm{background:var(--surface-1); white-space:nowrap}
.inv-item .ops a.shop{padding:5px 9px}
/* order */
.order-row{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--grid); font-size:13.5px}
.order-row:last-child{border-bottom:0}
.order-row .nm{font-weight:700}
.order-row .qy{color:var(--ink-3); font-size:12px}
.order-row .pr{margin-left:auto; white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:600}
.order-row .links{display:flex; gap:5px}
a.shop{font-size:11.5px; font-weight:700; text-decoration:none; border:0; border-radius:var(--r-cap);
  padding:5px 11px; color:var(--accent); background:var(--accent-soft); white-space:nowrap; display:inline-block;
  transition:transform 120ms var(--ease-out-strong), filter 120ms ease}
a.shop:active{transform:scale(.95)}
.total-line{display:flex; justify-content:space-between; font-weight:800; padding-top:10px; font-size:14.5px}
.alertbox{border-radius:16px; padding:12px 14px; margin-bottom:9px; font-size:13px; display:flex; gap:9px; align-items:flex-start}
.alertbox.warn{background:var(--warn-bg)} .alertbox.serious{background:var(--serious-bg)}
.alertbox.crit{background:var(--crit-bg)} .alertbox.info{background:var(--accent-soft)}
/* table */
table.plan{width:100%; border-collapse:collapse; font-size:12.5px}
table.plan th{color:var(--ink-3); font-weight:700; text-align:left; padding:7px 6px; border-bottom:1.5px solid var(--axis); font-size:11px; letter-spacing:.02em}
table.plan td{padding:8px 6px; border-bottom:1px solid var(--grid); vertical-align:top}
table.plan td b{font-size:12.5px}
table.plan .n{color:var(--ink-3); font-size:11px; font-variant-numeric:tabular-nums}
/* 투명도 감소 선호 · backdrop-filter 미지원 → 라이브러리의 minimal 변형처럼 불투명 표면으로 */
@media (prefers-reduced-transparency: reduce){
  header.app, nav.tabs, .sheet{background:var(--surface-1); -webkit-backdrop-filter:none; backdrop-filter:none}
  header.app{border-bottom:1px solid var(--ring)}
  header.app::after, nav.tabs::before{display:none}
}
@supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){
  header.app, nav.tabs, .sheet{background:var(--surface-1)}
  header.app{border-bottom:1px solid var(--ring)}
  header.app::after{display:none}
}
/* reduced motion */
@media (prefers-reduced-motion: reduce){
  main section{animation:viewFade 120ms ease}
  details.rsteps[open] > *:not(summary){animation:viewFade 120ms ease}
  @keyframes viewFade{from{opacity:0} to{opacity:1}}
  .btn:active, nav.tabs button:active, a.shop:active, .theme-btn:active, details.rsteps summary:active{transform:none}
  .sheet{animation:none} .scell, .chip, .opt{transition:none}
  details.rsteps summary::before{transition:none}
}
/* forms */
input[type=text],input[type=number],input[type=date],input[type=password],textarea{
  width:100%; border:1.5px solid transparent; background:var(--grid); color:var(--ink-1);
  border-radius:var(--r-md); padding:12px 16px; font-size:16px; font-family:inherit; transition:border-color 120ms ease, background-color 120ms ease}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,input[type=password]:focus,textarea:focus{outline:none; border-color:var(--accent); background:var(--surface-1)}
textarea{min-height:70px}
label.f{display:block; font-size:12.5px; color:var(--ink-2); margin:11px 0 5px; font-weight:600}
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 4px; -webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto; border:0; background:var(--grid); color:var(--ink-2);
  border-radius:var(--r-cap); padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  transition:transform var(--dur) var(--ease-spring), background-color var(--dur-fast) ease, color var(--dur-fast) ease}
.chip.on{background:var(--accent); color:#fff; font-weight:700}
.chip:active{transform:scale(.95)}
table.tiers{width:100%; border-collapse:collapse; font-size:12px}
table.tiers td{padding:6px 4px; border-bottom:1px solid var(--grid); vertical-align:top}
table.tiers td.n{white-space:nowrap; font-variant-numeric:tabular-nums}
table.tiers tr.on td{font-weight:800; color:var(--accent)}
/* 주간표 메뉴 선택 버튼 */
.mpick{display:inline-block; margin:0 6px 6px 0; padding:9px 13px; font-size:12.5px; font-weight:600;
  border:0; background:var(--grid); color:var(--ink-1); border-radius:11px; cursor:pointer;
  transition:transform 120ms var(--ease-out-strong), background-color 120ms ease}
.mpick b{color:var(--ink-3); font-weight:700; margin-right:4px}
.mpick:active{transform:scale(.96)}
.mpick.custom{background:var(--accent-soft); color:var(--accent)}
.mpick.custom b{color:var(--accent)}
.mpick.off{background:transparent; border:1.5px dashed var(--axis); color:var(--ink-3)}
.mpick.off b{color:var(--ink-3)}
.lowk{display:inline-block; font-size:11px; color:var(--serious); font-weight:700; margin-left:2px}
.mk-list{display:flex; flex-wrap:wrap; gap:7px}
.mk-item{background:var(--grid); border-radius:11px; padding:8px 12px; font-size:13px; font-weight:600}
@media (hover:hover){ .mpick:hover{filter:brightness(.97)} }
/* 바텀시트 피커 */
/* 온보딩 — 첫 실행 사용법 슬라이드(가로 스와이프) */
.ob{position:fixed; inset:0; z-index:150; background:var(--page); display:flex; flex-direction:column; animation:fadeIn 200ms ease}
.ob-top{flex:0 0 auto; display:flex; justify-content:flex-end; padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.ob-skip{border:0; background:transparent; color:var(--ink-3); font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer; padding:8px 10px; border-radius:10px}
.ob-track{flex:1 1 auto; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; scrollbar-width:none}
.ob-track::-webkit-scrollbar{display:none}
.ob-slide{flex:0 0 100%; width:100%; scroll-snap-align:center; scroll-snap-stop:always; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:14px 28px 6px; overflow-y:auto; -webkit-overflow-scrolling:touch}
.ob-art{flex:0 0 auto; width:96px; height:96px; border-radius:28px; background:var(--surface-1); box-shadow:0 10px 30px rgba(15,25,40,.10);
  display:flex; align-items:center; justify-content:center; font-size:48px; line-height:1; margin-bottom:20px}
.ob-step{font-size:11.5px; font-weight:800; letter-spacing:.6px; color:var(--accent); margin-bottom:8px}
.ob-t{font-size:21.5px; font-weight:800; letter-spacing:-.5px; line-height:1.38; color:var(--ink-1); word-break:keep-all}

 "오래 끓일수록 뽀얗고 깊어진다."}, {"id": "r_soup_5", "cat": "soup", "name": "부대찌개", "kcal": 560, "pro": 25, "min": 25, "lv": 2, "ing": "스팸 1/2, 소시지 2개, 김치 80g, 라면사리, 베이크드빈 2큰술, 고추장 1큰술", "steps": ["재료를 냄비에 둘러 담고 고추장·고춧가루·마늘 양념을 얹는다.", "육수(또는 물) 500ml를 붓고 10분 끓인다.", "사리를 넣고 3분 더."], "tip": "치즈 한 장 올리면 국물이 부드러워진다."}, {"id": "r_soup_6", "cat": "soup", "name": "콩나물국", "kcal": 120, "pro": 8, "min": 15, "lv": 1, "ing": "콩나물 200g, 대파, 다진마늘, 소금(또는 새우젓), 고춧가루 약간", "steps": ["물 500ml에 콩나물·마늘을 넣고 뚜껑 덮고 5분 끓인다.", "파·소금(새우젓) 간을 하고 2분 더.", "취향껏 고춧가루."], "tip": "뚜껑을 열었다 닫았다 하면 비린내가 난다. 한 번에."}, {"id": "r_soup_7", "cat": "soup", "name": "갈비탕(간편)", "kcal": 520, "pro": 35, "min": 60, "lv": 3, "ing": "소갈비 300g, 무 150g, 대파, 마늘, 국간장, 당면(선택)", "steps": ["갈비를 찬물에 30분 담가 핏물을 뺀다.", "끓는 물에 5분 데쳐 헹군 뒤 새 물 1L에 무·마늘과 40분 끓인다.", "국간장·소금 간, 파·당면 넣고 5분."], "tip": "압력솥이면 20분으로 단축된다."}, {"id": "r_soup_8", "cat": "soup", "name": "어묵탕", "kcal": 300, "pro": 14, "min": 15, "lv": 1, "ing": "어묵 150g, 무 100g, 대파, 청양고추, 국간장, 멸치육수", "steps": ["멸치육수 600ml에 나박 썬 무를 5분 끓인다.", "어묵·고추를 넣고 5분 더.", "국간장으로 간하고 파 마무리."], "tip": "겨자장에 찍어 먹으면 포장마차 맛."}, {"id": "r_soup_9", "cat": "soup", "name": "닭곰탕", "kcal": 400, "pro": 38, "min": 50, "lv": 2, "ing": "닭다리 3개(또는 닭 반 마리), 대파, 마늘 5톨, 생강, 소금, 후추", "steps": ["닭·마늘·생강·파 뿌리를 물 1L에 40분 끓인다.", "닭을 건져 살만 찢고 국물은 체에 거른다.", "국물+살+파, 소금·후추로 간. 밥 말아 먹는다."], "tip": "국물을 식혀 기름을 걷으면 더 깔끔하다."}, {"id": "r_soup_10", "cat": "soup", "name": "떡국", "kcal": 480, "pro": 16, "min": 15, "lv": 1, "ing": "떡국떡 150g, 계란 1개, 김가루, 대파, 멸치육수(또는 사골팩)", "steps": ["떡을 물에 10분 불린다.", "육수 500ml가 끓으면 떡을 넣고 3~4분.", "계란지단(또는 줄알)·김가루·파 마무리."], "tip": "사골팩을 쓰면 5분 요리."}, {"id": "r_soup_11", "cat": "soup", "name": "감자탕(미니)", "kcal": 620, "pro": 40, "min": 90, "lv": 3, "ing": "돼지등뼈 500g, 감자 2개, 우거지, 들깻가루 2큰술, 고추장·고춧가루", "steps": ["등뼈를 1시간 물에 담가 핏물 빼고 데친다.", "양념(고추장1·고춧가루2·마늘·된장1)과 물 1L로 1시간 끓인다.", "감자·우거지 넣고 20분, 들깻가루 마무리."], "tip": "주말에 만들어 두 끼 먹는 보양식."}, {"id": "r_soup_12", "cat": "soup", "name": "황태해장국", "kcal": 280, "pro": 30, "min": 20, "lv": 2, "ing": "황태채 30g, 무, 두부 1/2모, 계란 1개, 새우젓, 들기름", "steps": ["들기름에 황태채를 1분 볶는다.", "물 600ml·무를 넣고 10분 끓인다.", "두부·계란 줄알·새우젓 간."], "tip": "술 마신 다음 날의 구원자."}, {"id": "r_soup_13", "cat": "soup", "name": "시래기된장국", "kcal": 220, "pro": 12, "min": 25, "lv": 2, "ing": "삶은 시래기 150g, 된장 1.5큰술, 들깻가루 1큰술, 마늘, 멸치육수", "steps": ["시래기를 된장·마늘·들기름에 조물조물 무친다.", "육수 600ml에 넣고 15분 끓인다.", "들깻가루 마무리."], "tip": "시래기는 오래 끓일수록 부드럽다."}, {"id": "r_soup_14", "cat": "soup", "name": "계란국", "kcal": 150, "pro": 12, "min": 10, "lv": 1, "ing": "계란 2개, 대파, 멸치육수(또는 물+국간장), 소금", "steps": ["육수 500ml를 끓인다.", "계란을 풀어 원을 그리며 붓고 젓지 않는다.", "파·소금 간."], "tip": "10분 컷. 어떤 밥상에도 어울린다."}, {"id": "r_soup_15", "cat": "soup", "name": "삼계탕(전기밥솥)", "kcal": 650, "pro": 55, "min": 60, "lv": 2, "ing": "영계 1마리, 찹쌀 50g, 마늘 6톨, 대추, 인삼(선택)", "steps": ["닭 뱃속에 불린 찹쌀·마늘·대추를 채운다.", "전기밥솥에 닭과 물 700ml를 넣고 만능찜 50분.", "소금·후추로 간해 먹는다."], "tip": "밥솥이 다 해준다. 초복·중복 필수."}, {"id": "r_meat_0", "cat": "meat", "name": "삼겹살구이", "kcal": 700, "pro": 35, "min": 15, "lv": 1, "ing": "삼겹살 200g, 소금, 후추, 쌈채소, 쌈장", "steps": ["팬을 충분히 달군 뒤 삼겹살을 올린다.", "한 면이 바삭해질 때까지 뒤집지 않고 굽는다(3~4분).", "가위로 잘라 소금이나 쌈장, 쌈채소와 먹는다."], "tip": "자주 뒤집으면 육즙이 빠진다. 면당 1번."}, {"id": "r_meat_1", "cat": "meat", "name": "돼지고기김치찜", "kcal": 580, "pro": 35, "min": 50, "lv": 2, "ing": "돼지 앞다리(또는 목살) 300g, 신김치 1/4포기, 양파, 설탕 1/2큰술, 마늘", "steps": ["냄비 바닥에 김치→고기→양파 순으로 쌓는다.", "김치국물+물 300ml·설탕·마늘을 붓고 뚜껑 덮어 약불 40분.", "고기를 잘라 김치에 싸 먹는다."], "tip": "신 김치일수록 성공. 두부 추가 강추."}, {"id": "r_meat_2", "cat": "meat", "name": "닭갈비", "kcal": 620, "pro": 40, "min": 30, "lv": 2, "ing": "닭다리살 250g, 양배추, 고구마, 떡, 고추장 2큰술, 고춧가루 1큰술, 카레가루 1작은술", "steps": ["양념(고추장·고춧가루·간장1·설탕1·마늘·카레가루)에 닭을 30분 재운다.", "팬에 닭·야채·떡을 넣고 중불에서 뒤적이며 15분 볶는다.", "마지막에 들기름 반 바퀴."], "tip": "남은 양념에 밥 볶는 것까지가 닭갈비다."}, {"id": "r_meat_3", "cat": "meat", "name": "수육", "kcal": 550, "pro": 45, "min": 60, "lv": 2, "ing": "돼지 앞다리(수육용) 400g, 된장 1큰술, 마늘, 대파, 통후추, 월계수잎(선택)", "steps": ["물 1.5L에 된장·파·마늘·후추를 넣고 끓인다.", "고기를 넣고 중불 50분 삶는다.", "10분 뜸 들인 후 썰어 새우젓과 먹는다."], "tip": "삶은 물에 우거지 넣으면 국까지 해결."}, {"id": "r_meat_4", "cat": "meat", "name": "찜닭", "kcal": 680, "pro": 45, "min": 40, "lv": 2, "ing": "닭볶음탕용 닭 500g, 감자, 당근, 당면, 간장 4큰술, 설탕 2큰술, 콜라 100ml(선택)", "steps": ["닭을 끓는 물에 3분 데친다.", "간장·설탕·마늘·물 400ml에 닭·야채를 넣고 25분 조린다.", "불린 당면을 넣고 5분 더."], "tip": "콜라를 쓰면 윤기와 단맛이 쉽게 잡힌다."}, {"id": "r_meat_5", "cat": "meat", "name": "제육볶음(기본)", "kcal": 600, "pro": 35, "min": 20, "lv": 1, "ing": "돼지 앞다리 200g, 양파, 대파, 고추장 1.5큰술, 고춧가루 1큰술, 간장·설탕 각 1큰술", "steps": ["양념을 섞어 고기를 10분 재운다.", "센 불에 고기를 펼쳐 굽듯이 볶는다.", "양파·파를 넣고 2분 더."], "tip": "불맛의 비결은 팬을 흔들지 않는 것."}, {"id": "r_meat_6", "cat": "meat", "name": "소고기스테이크", "kcal": 650, "pro": 45, "min": 15, "lv": 2, "ing": "소고기 등심 200g, 소금, 후추, 버터 1조각, 마늘, 로즈마리(선택)", "steps": ["고기를 실온에 30분 꺼내두고 소금·후추 밑간.", "달군 팬에 면당 2분씩 굽는다.", "버터·마늘을 넣고 숟가락으로 버터를 끼얹으며 1분, 5분 레스팅."], "tip": "레스팅을 건너뛰면 육즙이 도마로 다 빠진다."}, {"id": "r_meat_7", "cat": "meat", "name": "닭볶음탕", "kcal": 590, "pro": 42, "min": 35, "lv": 2, "ing": "닭볶음탕용 닭 500g, 감자 2개, 당근, 양파, 고추장 2큰술, 고춧가루 2큰술, 간장 2큰술", "steps": ["닭을 데치고 양념·물 400ml와 함께 15분 끓인다.", "감자·당근을 넣고 15분 더 조린다.", "파·깨 마무리."], "tip": "국물에 밥 비비는 맛으로 먹는다."}, {"id": "r_meat_8", "cat": "meat", "name": "LA갈비구이", "kcal": 750, "pro": 40, "min": 20, "lv": 2, "ing": "LA갈비 300g, 간장 3큰술, 설탕 1.5큰술, 배즙(또는 콜라) 3큰술, 마늘, 참기름", "steps": ["갈비를 찬물에 30분 담가 핏물을 뺀다.", "양념에 3시간~하루 재운다.", "팬 또는 에어프라이어 180도 12분."], "tip": "하루 재운 갈비는 실패하지 않는다."}, {"id": "r_meat_9", "cat": "meat", "name": "훈제오리볶음", "kcal": 520, "pro": 35, "min": 15, "lv": 1, "ing": "훈제오리 200g, 부추(또는 파채), 양파, 후추", "steps": ["마른 팬에 훈제오리를 굽는다(기름이 나온다).", "양파를 넣고 노릇하게 볶는다.", "부추를 얹어 잔열로 숨만 죽인다. 소금장에."], "tip": "이미 익은 고기라 데우기만 해도 된다."}, {"id": "r_meat_10", "cat": "meat", "name": "탕수육(에어프라이어)", "kcal": 680, "pro": 30, "min": 30, "lv": 3, "ing": "돼지 등심 200g, 전분 5큰술, 계란 1개, 설탕 3큰술, 식초 3큰술, 간장 1큰술, 야채", "steps": ["고기에 밑간 후 전분+계란 반죽을 입힌다.", "에어프라이어 200도 15분(중간에 뒤집기).", "설탕·식초·간장·물 150ml를 끓여 전분물로 농도, 부어 먹는다."], "tip": "튀기지 않아도 충분히 바삭하다."}, {"id": "r_meat_11", "cat": "meat", "name": "차돌숙주볶음", "kcal": 480, "pro": 28, "min": 10, "lv": 1, "ing": "차돌박이 150g, 숙주 200g, 대파, 굴소스 1큰술, 마늘, 후추", "steps": ["센 불에 차돌을 굽고 기름이 나오면 마늘·파를 볶는다.", "숙주를 넣고 30초만 볶는다.", "굴소스·후추 간을 하고 바로 불을 끈다."], "tip": "숙주는 아삭해야 한다. 오래 볶으면 실패."}, {"id": "r_meat_12", "cat": "meat", "name": "고추장불고기", "kcal": 610, "pro": 34, "min": 20, "lv": 1, "ing": "돼지 목살 200g, 고추장 2큰술, 설탕 1큰술, 간장 1큰술, 마늘, 양파", "steps": ["양념에 고기를 20분 재운다.", "중불에서 타지 않게 뒤적이며 굽는다.", "상추쌈과 함께."], "tip": "고추장 양념은 잘 타니 중불 유지."}, {"id": "r_meat_13", "cat": "meat", "name": "장조림", "kcal": 380, "pro": 35, "min": 40, "lv": 2, "ing": "소고기 홍두깨살 300g, 간장 5큰술, 설탕 1.5큰술, 마늘 10톨, 꽈리고추, 삶은계란", "steps": ["고기를 40분 삶아 결대로 찢는다.", "삶은 물 300ml+간장·설탕에 고기·마늘을 20분 조린다.", "꽈리고추·삶은계란을 넣고 5분 더."], "tip": "일주일 밑반찬. 계란 추가는 필수."}, {"id": "r_meat_14", "cat": "meat", "name": "등갈비김치찜", "kcal": 720, "pro": 45, "min": 70, "lv": 3, "ing": "돼지 등갈비 500g, 묵은지 1/4포기, 양파, 설탕, 마늘", "steps": ["등갈비를 30분 물에 담가 핏물 빼고 데친다.", "냄비에 묵은지·등갈비를 쌓고 물 500ml로 1시간 약불 찜.", "설탕 1/2큰술로 김치 신맛을 잡는다."], "tip": "주말 2시간 투자로 이틀이 행복하다."}, {"id": "r_meat_15", "cat": "meat", "name": "규카츠식 소고기커틀릿", "kcal": 700, "pro": 38, "min": 25, "lv": 3, "ing": "소고기 등심 150g, 빵가루, 계란, 밀가루, 식용유", "steps": ["고기에 소금·후추, 밀가루→계란→빵가루 순서로 입힌다.", "기름 1cm 깊이에서 면당 1분씩만 튀긴다(레어).", "결 반대로 썰어 소금·와사비와."], "tip": "속은 붉어야 정상이다. 오래 튀기면 스테이크가 아니라 신발."}, {"id": "r_sea_0", "cat": "sea", "name": "고등어구이", "kcal": 420, "pro": 35, "min": 15, "lv": 1, "ing": "간고등어 1손, 식용유, 레몬(선택)", "steps": ["고등어 물기를 키친타월로 제거한다.", "기름 두른 팬에 껍질면부터 중불 4분, 뒤집어 3분.", "무 간 것이나 레몬과 함께."], "tip": "뚜껑을 덮으면 속까지 촉촉하게 익는다."}, {"id": "r_sea_1", "cat": "sea", "name": "연어스테이크", "kcal": 520, "pro": 40, "min": 15, "lv": 2, "ing": "생연어 180g, 소금, 후추, 버터, 레몬, 아스파라거스(선택)", "steps": ["연어에 소금·후추 밑간을 한다.", "달군 팬에 껍질면부터 3분, 뒤집어 2분.", "버터·레몬즙을 끼얹어 마무리."], "tip": "속은 살짝 덜 익은 미디엄이 촉촉하다."}, {"id": "r_sea_2", "cat": "sea", "name": "오징어볶음", "kcal": 450, "pro": 30, "min": 20, "lv": 2, "ing": "오징어 1마리, 양파, 당근, 대파, 고추장 1.5큰술, 고춧가루 1큰술, 설탕 1/2큰술", "steps": ["오징어를 손질해 칼집 내고 한입 크기로 썬다.", "양념을 만들어 오징어에 버무린다.", "센 불에 야채와 함께 3~4분만 볶는다."], "tip": "오징어는 오래 볶으면 고무가 된다. 3분이면 충분."}, {"id": "r_sea_3", "cat": "sea", "name": "새우버터구이", "kcal": 380, "pro": 28, "min": 10, "lv": 1, "ing": "냉동새우 12마리, 버터 1조각, 마늘 3톨, 파슬리(선택), 소금", "steps": ["새우를 해동해 물기를 뺀다.", "버터에 편마늘을 볶아 향을 낸다.", "새우를 넣고 앞뒤 2분씩, 소금 간."], "tip": "머리째 구우면 감칠맛이 배가 된다."}, {"id": "r_sea_4", "cat": "sea", "name": "갈치조림", "kcal": 480, "pro": 32, "min": 30, "lv": 2, "ing": "갈치 2토막, 무 150g, 양파, 고춧가루 2큰술, 간장 2큰술, 설탕 1/2큰술, 마늘", "steps": ["냄비 바닥에 무를 깔고 갈치를 올린다.", "양념장+물 300ml를 붓고 중불 20분 조린다.", "국물을 끼얹어가며 5분 더."], "tip": "무가 갈치보다 맛있는 게 정상이다."}, {"id": "r_sea_5", "cat": "sea", "name": "조개술찜", "kcal": 320, "pro": 25, "min": 15, "lv": 2, "ing": "바지락 400g, 청주(소주) 100ml, 마늘, 청양고추, 버터, 파", "steps": ["바지락을 소금물에 30분 해감한다.", "팬에 버터·마늘을 볶고 바지락·술을 넣고 뚜껑을 덮는다.", "입이 다 벌어지면(4~5분) 파·고추 마무리."], "tip": "국물에 파스타 사리를 넣으면 봉골레."}, {"id": "r_sea_6", "cat": "sea", "name": "참치김치찌개", "kcal": 380, "pro": 25, "min": 20, "lv": 1, "ing": "참치캔 1, 김치 150g, 두부 1/2모, 대파, 고춧가루", "steps": ["김치를 볶다가 물 400ml를 붓고 10분 끓인다.", "참치·두부를 넣고 5분 더.", "파 마무리."], "tip": "참치는 마지막에 넣어야 부서지지 않는다."}, {"id": "r_sea_7", "cat": "sea", "name": "낙지볶음", "kcal": 420, "pro": 28, "min": 20, "lv": 3, "ing": "낙지 2마리, 양파, 대파, 고추장 1큰술, 고춧가루 2큰술, 설탕 1/2큰술", "steps": ["낙지를 밀가루로 주물러 씻는다.", "끓는 물에 5초 데쳐 먹기 좋게 자른다.", "센 불에 양념과 1~2분만 볶는다. 소면과 함께."], "tip": "데침+센불 1분이 부드러운 낙지의 전부다."}, {"id": "r_sea_8", "cat": "sea", "name": "멸치볶음", "kcal": 280, "pro": 15, "min": 10, "lv": 1, "ing": "잔멸치 80g, 견과류, 간장 1/2큰술, 설탕 1큰술, 물엿 1큰술, 식용유", "steps": ["마른 팬에 멸치를 1분 볶아 비린내를 날린다.", "기름·간장·설탕을 넣고 약불로 볶는다.", "불 끄고 물엿·깨를 섞는다."], "tip": "물엿은 꼭 불 끄고. 아니면 돌덩이가 된다."}, {"id": "r_sea_9", "cat": "sea", "name": "동태전", "kcal": 350, "pro": 25, "min": 25, "lv": 2, "ing": "동태포 200g, 계란 2개, 밀가루, 소금, 후추", "steps": ["동태포 물기를 제거하고 소금·후추 밑간.", "밀가루→계란물 순서로 입힌다.", "약불에 앞뒤 노릇하게 부친다."], "tip": "약불 인내심이 부드러운 전을 만든다."}, {"id": "r_sea_10", "cat": "sea", "name": "문어숙회", "kcal": 280, "pro": 35, "min": 15, "lv": 2, "ing": "자숙문어 200g, 오이, 초고추장", "steps": ["자숙문어를 얇게 어슷 썬다.", "오이와 함께 담고 초고추장을 곁들인다.", "(생문어라면 40분 삶아 사용)"], "tip": "참기름+소금장도 잘 어울린다."}, {"id": "r_sea_11", "cat": "sea", "name": "훈제연어샐러드", "kcal": 380, "pro": 28, "min": 10, "lv": 1, "ing": "훈제연어 100g, 샐러드채소, 양파 슬라이스, 케이퍼(선택), 올리브유, 레몬", "steps": ["채소를 씻어 물기를 빼고 접시에 깐다.", "훈제연어·양파를 올린다.", "올리브유+레몬즙+후추를 뿌린다."], "tip": "드레싱은 심플할수록 연어가 산다."}, {"id": "r_sea_12", "cat": "sea", "name": "골뱅이무침", "kcal": 380, "pro": 30, "min": 15, "lv": 1, "ing": "골뱅이캔 1, 오이, 양파, 대파, 초고추장 3큰술, 식초 1큰술, 설탕 1/2큰술", "steps": ["야채를 채 썰고 골뱅이는 반으로 자른다.", "초고추장·식초·설탕·마늘로 버무린다.", "소면을 삶아 곁들인다."], "tip": "소면 없이 먹으면 저탄수 안주."}, {"id": "r_sea_13", "cat": "sea", "name": "전복버터구이", "kcal": 350, "pro": 30, "min": 15, "lv": 2, "ing": "전복 3미, 버터 1조각, 마늘, 간장 약간", "steps": ["전복 살을 분리해 칼집을 낸다.", "버터·마늘에 앞뒤 2분씩 굽는다.", "간장 몇 방울로 마무리."], "tip": "내장도 같이 구우면 별미다."}, {"id": "r_sea_14", "cat": "sea", "name": "해물파전", "kcal": 480, "pro": 22, "min": 25, "lv": 2, "ing": "쪽파 한 줌, 오징어·새우 100g, 부침가루 1컵, 계란 1개", "steps": ["부침가루+물로 약간 되직한 반죽을 만든다.", "팬에 기름을 넉넉히, 파를 깔고 반죽을 붓는다.", "해물·계란을 올리고 앞뒤 바삭하게."], "tip": "뒤집기는 한 번만. 자신 없으면 접시를 쓰자."}, {"id": "r_sea_15", "cat": "sea", "name": "쭈꾸미볶음", "kcal": 400, "pro": 30, "min": 20, "lv": 2, "ing": "쭈꾸미 300g, 양파, 대파, 고추장 1큰술, 고춧가루 2큰술, 설탕 1/2큰술", "steps": ["쭈꾸미를 밀가루로 씻고 데친다(10초).", "양념에 버무려 센 불에 2분 볶는다.", "콩나물이나 소면과 함께."], "tip": "봄 쭈꾸미는 머리(알)가 진리."}, {"id": "r_noodle_0", "cat": "noodle", "name": "알리오올리오", "kcal": 550, "pro": 14, "min": 15, "lv": 2, "ing": "스파게티 100g, 마늘 6톨, 올리브유 3큰술, 페페론치노(청양고추), 면수, 소금", "steps": ["면을 소금물에 8분 삶는다(면수 확보).", "약불 올리브유에 편마늘을 천천히 노릇하게.", "면·면수 3큰술을 넣고 흔들어 유화시킨다."], "tip": "면수의 전분이 소스를 만든다. 버리지 말 것."}, {"id": "r_noodle_1", "cat": "noodle", "name": "토마토파스타", "kcal": 600, "pro": 18, "min": 20, "lv": 1, "ing": "스파게티 100g, 파스타소스 150g, 양파, 마늘, 올리브유, 파마산(선택)", "steps": ["면을 8분 삶는다.", "마늘·양파를 볶고 소스를 부어 데운다.", "면·면수 2큰술을 넣고 1분 볶는다."], "tip": "베이컨이나 새우를 추가하면 단백질 보강."}, {"id": "r_noodle_2", "cat": "noodle", "name": "까르보나라(정통)", "kcal": 700, "pro": 25, "min": 20, "lv": 3, "ing": "스파게티 100g, 베이컨 50g, 계란노른자 2개, 파마산 20g, 후추", "steps": ["노른자+치즈+후추를 섞어 소스를 만든다.", "베이컨을 바삭하게 굽고 면을 넣어 섞는다.", "불을 끄고 소스를 부어 잔열로만 크림화한다."], "tip": "불 위에서 소스를 넣으면 스크램블이 된다."}, {"id": "r_noodle_3", "cat": "noodle", "name": "잔치국수", "kcal": 480, "pro": 16, "min": 15, "lv": 1, "ing": "소면 100g, 멸치육수 600ml, 계란 1개, 애호박, 김가루, 국간장", "steps": ["육수를 끓여 국간장으로 간한다.", "소면을 3분 삶아 찬물에 헹군다.", "고명(지단·호박볶음·김)을 얹고 육수를 붓는다."], "tip": "면은 꼭 헹궈야 국물이 안 탁해진다."}, {"id": "r_noodle_4", "cat": "noodle", "name": "비빔국수", "kcal": 520, "pro": 14, "min": 15, "lv": 1, "ing": "소면 100g, 고추장 1.5큰술, 식초 1.5큰술, 설탕 1큰술, 참기름, 오이, 삶은계란", "steps": ["양념장을 미리 섞어둔다.", "소면을 삶아 얼음물에 빡빡 헹군다.", "양념에 비비고 오이채·계란 반쪽을 올린다."], "tip": "면을 차갑게 할수록 탱탱하다."}, {"id": "r_noodle_5", "cat": "noodle", "name": "김치볶음우동", "kcal": 580, "pro": 16, "min": 15, "lv": 1, "ing": "우동면 1봉, 김치 80g, 대파, 간장 1/2큰술, 버터 1조각, 가쓰오부시(선택)", "steps": ["버터에 김치를 볶는다.", "데친 우동면·간장을 넣고 센 불에 볶는다.", "가쓰오부시를 얹는다."], "tip": "버터+김치는 배신하지 않는 조합."}, {"id": "r_noodle_6", "cat": "noodle", "name": "짜파구리", "kcal": 650, "pro": 18, "min": 10, "lv": 1, "ing": "짜파게티 1, 너구리 1, 물, 대파(선택)", "steps": ["두 면을 함께 4분 삶고 물을 조금만 남기고 버린다.", "짜장분말 전부+너구리분말 1/2을 넣고 볶는다.", "파기름이나 계란프라이를 더하면 업그레이드."], "tip": "물 조절이 전부다. 종이컵 반 컵만 남기기."}, {"id": "r_noodle_7", "cat": "noodle", "name": "냉모밀", "kcal": 450, "pro": 16, "min": 15, "lv": 1, "ing": "메밀면 100g, 쯔유 3큰술, 물 150ml, 무 간 것, 쪽파, 와사비", "steps": ["쯔유+찬물을 섞어 냉장고에 둔다.", "메밀면을 4분 삶아 얼음물에 헹군다.", "무·파·와사비를 곁들여 찍어 먹는다."], "tip": "삶은 후 전분을 씻어내는 게 핵심."}, {"id": "r_noodle_8", "cat": "noodle", "name": "볶음우동", "kcal": 620, "pro": 22, "min": 15, "lv": 2, "ing": "우동면 1봉, 돼지고기(또는 해물) 80g, 양배추, 굴소스 1큰술, 간장 1/2큰술", "steps": ["고기를 볶다가 양배추를 넣는다.", "데친 우동면·굴소스·간장을 넣고 센 불 2분.", "가쓰오부시·마요네즈(선택)."], "tip": "면은 미리 데쳐 풀어놔야 안 뭉친다."}, {"id": "r_noodle_9", "cat": "noodle", "name": "콩국수", "kcal": 550, "pro": 30, "min": 15, "lv": 2, "ing": "소면 100g, 콩물 400ml(시판), 오이, 소금(또는 설탕), 얼음", "steps": ["소면을 삶아 차게 헹군다.", "그릇에 면·콩물·얼음을 담는다.", "오이채를 올리고 소금 간(전라식은 설탕)."], "tip": "검은콩 콩물이면 더 고소하다."}, {"id": "r_noodle_10", "cat": "noodle", "name": "라볶이", "kcal": 600, "pro": 15, "min": 15, "lv": 1, "ing": "라면 1, 떡 100g, 어묵 2장, 고추장 1.5큰술, 설탕 1큰술, 대파, 삶은계란", "steps": ["물 400ml에 양념을 풀고 떡·어묵을 5분 끓인다.", "면을 넣고 3분 더.", "파·계란을 올린다."], "tip": "국물 자작할 때 불 끄면 딱 좋다."}, {"id": "r_noodle_11", "cat": "noodle", "name": "들기름막국수", "kcal": 480, "pro": 12, "min": 10, "lv": 1, "ing": "메밀면 100g, 들기름 2큰술, 간장(쯔유) 2큰술, 김가루, 깨", "steps": ["메밀면을 삶아 찬물에 헹군다.", "들기름·쯔유를 넣고 비빈다.", "김가루·깨를 듬뿍."], "tip": "재료 4개로 끝나는 미니멀 별미."}, {"id": "r_noodle_12", "cat": "noodle", "name": "크림파스타", "kcal": 750, "pro": 25, "min": 20, "lv": 2, "ing": "스파게티 100g, 생크림(또는 우유+치즈) 200ml, 베이컨 50g, 양파, 마늘", "steps": ["베이컨·마늘·양파를 볶는다.", "생크림을 붓고 약불로 졸인다.", "면·면수를 넣고 농도를 맞추고 후추."], "tip": "우유로 만들면 슈레드치즈 한 줌으로 농도를."}, {"id": "r_noodle_13", "cat": "noodle", "name": "쌀국수(간편)", "kcal": 480, "pro": 25, "min": 20, "lv": 2, "ing": "쌀국수면 100g, 소고기 샤브용 80g, 숙주, 양파, 쌀국수육수(시판), 고수(선택)", "steps": ["면을 미지근한 물에 20분 불린다.", "육수를 끓여 불린 면을 1분 데친다.", "고기를 넣어 익히고 숙주·양파를 올린다."], "tip": "라임(레몬)즙 한 번이 화룡점정."}, {"id": "r_noodle_14", "cat": "noodle", "name": "메밀소바샐러드", "kcal": 520, "pro": 18, "min": 15, "lv": 2, "ing": "메밀면 100g, 샐러드채소, 오리엔탈드레싱, 계란 1개, 방울토마토", "steps": ["메밀면을 삶아 차게 헹군다.", "채소·토마토와 함께 담는다.", "드레싱을 붓고 반숙계란을 올린다."], "tip": "면+샐러드로 한 끼 영양이 완성된다."}, {"id": "r_noodle_15", "cat": "noodle", "name": "차슈멘식 라면", "kcal": 620, "pro": 28, "min": 20, "lv": 2, "ing": "라면 1, 수육(또는 차슈) 80g, 계란 1개, 대파, 숙주", "steps": ["계란을 6분30초 삶아 반숙을 만든다.", "라면을 끓이되 분말은 2/3만.", "수육·반숙·파·숙주를 올린다."], "tip": "고명이 라면을 요리로 만든다."}, {"id": "r_side_0", "cat": "side", "name": "계란말이", "kcal": 300, "pro": 20, "min": 10, "lv": 1, "ing": "계란 4개, 당근, 쪽파, 소금, 식용유", "steps": ["계란을 풀어 다진 야채·소금을 섞는다.", "약불 팬에 1/3씩 부어가며 돌돌 만다.", "한 김 식힌 후 썬다."], "tip": "약불+인내심=예쁜 계란말이."}, {"id": "r_side_1", "cat": "side", "name": "두부조림", "kcal": 280, "pro": 18, "min": 15, "lv": 1, "ing": "두부 1모, 간장 2큰술, 고춧가루 1큰술, 설탕 1/2큰술, 대파, 마늘", "steps": ["두부를 도톰하게 썰어 노릇하게 굽는다.", "양념장+물 100ml를 붓고 조린다.", "국물을 끼얹으며 5분."], "tip": "구운 두부라 부서지지 않는다."}, {"id": "r_side_2", "cat": "side", "name": "시금치나물", "kcal": 120, "pro": 6, "min": 10, "lv": 1, "ing": "시금치 한 단, 국간장 1작은술, 참기름, 마늘, 깨", "steps": ["끓는 물에 소금 넣고 시금치를 30초 데친다.", "찬물에 헹궈 꼭 짠다.", "양념에 조물조물 무친다."], "tip": "데치는 시간 30초를 넘기지 말 것."}, {"id": "r_side_3", "cat": "side", "name": "감자조림", "kcal": 250, "pro": 4, "min": 20, "lv": 1, "ing": "감자 2개, 간장 2큰술, 설탕 1큰술, 물엿 1/2큰술, 깨", "steps": ["감자를 깍둑 썰어 물에 헹군다(전분 제거).", "간장·설탕·물 200ml에 15분 조린다.", "물엿·깨로 윤기 마무리."], "tip": "젓지 말고 팬을 흔들어야 안 부서진다."}, {"id": "r_side_4", "cat": "side", "name": "애호박볶음", "kcal": 130, "pro": 4, "min": 10, "lv": 1, "ing": "애호박 1개, 새우젓 1작은술, 마늘, 대파, 들기름", "steps": ["애호박을 반달 썬다.", "들기름에 마늘·호박을 볶는다.", "새우젓 간, 파·깨 마무리."], "tip": "새우젓이 호박의 단맛을 끌어올린다."}, {"id": "r_side_5", "cat": "side", "name": "진미채볶음", "kcal": 320, "pro": 25, "min": 10, "lv": 1, "ing": "진미채 100g, 고추장 1큰술, 마요네즈 1큰술, 물엿 1큰술, 마늘", "steps": ["진미채를 물에 헹궈 부드럽게 한다.", "약불에 고추장·마늘을 볶다가 진미채 투입.", "불 끄고 마요·물엿을 섞는다."], "tip": "마요네즈가 부드러움의 비밀."}, {"id": "r_side_6", "cat": "side", "name": "콩나물무침", "kcal": 100, "pro": 8, "min": 10, "lv": 1, "ing": "콩나물 200g, 소금, 고춧가루, 마늘, 파, 참기름", "steps": ["콩나물을 뚜껑 덮고 5분 삶는다.", "찬물에 헹궈 물기를 뺀다.", "양념에 무친다."], "tip": "아삭함이 생명. 삶은 후 바로 헹구기."}, {"id": "r_side_7", "cat": "side", "name": "가지볶음", "kcal": 140, "pro": 3, "min": 10, "lv": 1, "ing": "가지 2개, 간장 1큰술, 마늘, 대파, 들기름, 고추", "steps": ["가지를 어슷 썰어 센 불에 굽듯이 볶는다.", "숨이 죽으면 간장·마늘을 넣는다.", "파·들기름 마무리."], "tip": "가지는 기름을 먹는다. 센 불에 빨리."}, {"id": "r_side_8", "cat": "side", "name": "무생채", "kcal": 90, "pro": 2, "min": 10, "lv": 1, "ing": "무 300g, 고춧가루 1.5큰술, 식초 1큰술, 설탕 1큰술, 소금, 마늘", "steps": ["무를 채 썰어 소금에 10분 절인다.", "물기를 짜고 양념에 무친다.", "깨 마무리. 냉장 보관."], "tip": "비빔밥·국수 고명으로 만능이다."}, {"id": "r_side_9", "cat": "side", "name": "메추리알장조림", "kcal": 300, "pro": 22, "min": 25, "lv": 1, "ing": "메추리알 20개(깐 것), 간장 4큰술, 설탕 1.5큰술, 마늘, 꽈리고추", "steps": ["간장·설탕·물 300ml를 끓인다.", "메추리알·마늘을 넣고 15분 조린다.", "꽈리고추 넣고 5분 더."], "tip": "깐 메추리알을 사면 인생이 편하다."}, {"id": "r_side_10", "cat": "side", "name": "브로콜리두부무침", "kcal": 180, "pro": 14, "min": 10, "lv": 1, "ing": "브로콜리 1/2송이, 두부 1/2모, 소금, 참기름, 깨", "steps": ["브로콜리를 1분 데치고, 두부도 데쳐 물기를 짠다.", "두부를 으깨 브로콜리와 섞는다.", "소금·참기름·깨로 무친다."], "tip": "고소한 단백질 반찬. 도시락에도 좋다."}, {"id": "r_side_11", "cat": "side", "name": "오이무침", "kcal": 80, "pro": 2, "min": 5, "lv": 1, "ing": "오이 2개, 고춧가루 1큰술, 식초 1큰술, 설탕 1/2큰술, 마늘, 소금", "steps": ["오이를 어슷 썰어 소금에 5분 절인다.", "물기를 짜고 양념에 무친다.", "깨 마무리."], "tip": "여름 입맛 살리는 5분 반찬."}, {"id": "r_side_12", "cat": "side", "name": "버섯볶음", "kcal": 150, "pro": 6, "min": 10, "lv": 1, "ing": "느타리·표고 등 버섯 200g, 간장 1큰술, 마늘, 버터(또는 들기름), 후추", "steps": ["버섯을 기름 없이 먼저 볶아 수분을 날린다.", "버터·마늘을 넣고 노릇하게.", "간장·후추 마무리."], "tip": "수분 날리기가 쫄깃함의 비결."}, {"id": "r_side_13", "cat": "side", "name": "어묵볶음", "kcal": 280, "pro": 12, "min": 10, "lv": 1, "ing": "어묵 150g, 간장 1큰술, 설탕 1/2큰술, 물엿 1/2큰술, 마늘, 대파", "steps": ["어묵을 한입 크기로 썰어 뜨거운 물을 부어 기름을 뺀다.", "기름에 마늘·어묵을 볶고 간장·설탕 투입.", "물엿·깨 마무리."], "tip": "뜨거운 물 샤워 한 번이 잡내를 없앤다."}, {"id": "r_side_14", "cat": "side", "name": "마늘종볶음", "kcal": 180, "pro": 8, "min": 10, "lv": 1, "ing": "마늘종 150g, 건새우 20g, 간장 1/2큰술, 설탕 1/2큰술, 물엿", "steps": ["마늘종을 4cm로 썰어 1분 데친다.", "기름에 건새우를 볶아 고소하게.", "마늘종·양념을 넣고 2분 볶는다."], "tip": "데치면 색이 살고 아린 맛이 빠진다."}, {"id": "r_side_15", "cat": "side", "name": "숙주나물", "kcal": 90, "pro": 7, "min": 8, "lv": 1, "ing": "숙주 250g, 소금, 마늘, 파, 참기름", "steps": ["끓는 물에 숙주를 1분만 데친다.", "찬물 헹굼 없이 펼쳐 식힌다.", "양념에 가볍게 무친다."], "tip": "헹구지 않아야 고소함이 남는다."}, {"id": "r_salad_0", "cat": "salad", "name": "닭가슴살샐러드", "kcal": 350, "pro": 40, "min": 10, "lv": 1, "ing": "닭가슴살 150g, 샐러드채소, 방울토마토, 발사믹(또는 오리엔탈)드레싱", "steps": ["닭가슴살을 삶거나 에어프라이어에 굽는다.", "채소·토마토와 함께 담는다.", "드레싱을 뿌린다."], "tip": "닭가슴살은 삶은 후 결대로 찢으면 촉촉하다."}, {"id": "r_salad_1", "cat": "salad", "name": "리코타치즈샐러드", "kcal": 420, "pro": 18, "min": 15, "lv": 2, "ing": "우유 500ml, 레몬즙(식초) 2큰술, 소금, 샐러드채소, 견과, 발사믹", "steps": ["우유를 끓기 직전까지 데우고 레몬즙을 넣어 몽글하게 만든다.", "면보에 걸러 30분 두면 리코타 완성.", "채소 위에 리코타·견과·발사믹."], "tip": "수제 리코타는 반의 반 값이다."}, {"id": "r_salad_2", "cat": "salad", "name": "포케볼", "kcal": 520, "pro": 35, "min": 15, "lv": 2, "ing": "밥(또는 현미밥) 150g, 생연어(또는 참치) 100g, 아보카도 1/2, 오이, 스리라차마요", "steps": ["밥을 그릇에 담고 재료를 구역별로 올린다.", "연어는 깍둑, 아보카도는 슬라이스.", "스리라차마요+간장을 뿌린다."], "tip": "하와이식 회덮밥. 재료는 냉장고 사정대로."}, {"id": "r_salad_3", "cat": "salad", "name": "그릭요거트볼", "kcal": 320, "pro": 20, "min": 5, "lv": 1, "ing": "그릭요거트 150g, 그래놀라 30g, 블루베리, 꿀 약간", "steps": ["그릇에 그릭요거트를 담는다.", "그래놀라·블루베리를 올린다.", "꿀을 두른다."], "tip": "아침 대용 최강. 단백질 20g 확보."}, {"id": "r_salad_4", "cat": "salad", "name": "두부면샐러드", "kcal": 380, "pro": 28, "min": 10, "lv": 1, "ing": "두부면 1팩, 샐러드채소, 방울토마토, 참깨드레싱, 삶은계란", "steps": ["두부면을 헹궈 물기를 뺀다.", "채소·토마토·계란과 함께 담는다.", "참깨드레싱."], "tip": "면 대신 두부면 — 탄수 걱정 없는 한 끼."}, {"id": "r_salad_5", "cat": "salad", "name": "단호박에그슬럿", "kcal": 280, "pro": 14, "min": 15, "lv": 1, "ing": "단호박 1/4, 계란 2개, 우유 2큰술, 소금, 치즈 약간", "steps": ["단호박을 전자레인지 5분 돌려 속을 파낸다.", "속에 계란·우유·치즈를 넣는다.", "전자레인지 2분30초."], "tip": "숟가락으로 퍼먹는 건강 디저트 겸 식사."}, {"id": "r_salad_6", "cat": "salad", "name": "참치샐러드랩", "kcal": 380, "pro": 25, "min": 10, "lv": 1, "ing": "또띠아 1장, 참치캔 1/2, 양상추, 마요 1/2큰술, 스리라차", "steps": ["참치 기름을 빼고 마요에 버무린다.", "또띠아에 양상추·참치를 올린다.", "돌돌 말아 반으로 자른다."], "tip": "랩으로 싸두면 내일 아침 도시락."}, {"id": "r_salad_7", "cat": "salad", "name": "퀴노아샐러드", "kcal": 450, "pro": 16, "min": 20, "lv": 2, "ing": "퀴노아 60g, 오이, 방울토마토, 페타(또는 리코타), 올리브유, 레몬", "steps": ["퀴노아를 12분 삶아 식힌다.", "야채를 깍둑 썰어 섞는다.", "올리브유·레몬·소금으로 버무린다."], "tip": "퀴노아는 헹궈서 삶아야 쓴맛이 없다."}, {"id": "r_salad_8", "cat": "salad", "name": "샤브샐러드", "kcal": 400, "pro": 32, "min": 15, "lv": 1, "ing": "소고기 샤브용 120g, 샐러드채소, 숙주, 오리엔탈드레싱, 깨", "steps": ["끓는 물에 고기를 데쳐 식힌다.", "숙주도 살짝 데친다.", "채소와 함께 담고 드레싱."], "tip": "고기를 찬물에 헹구면 기름기가 빠진다."}, {"id": "r_salad_9", "cat": "salad", "name": "카프레제", "kcal": 380, "pro": 16, "min": 5, "lv": 1, "ing": "토마토 1개, 생모짜렐라 100g, 바질(선택), 올리브유, 발사믹, 소 function applyTierSwap(mid){
  let m=mid;
  for(const t of TIER_KEYS){ if(t>(S.tier||20)) break;
    const sw=TIERS[t].swaps||{}; if(sw[m]) m=sw[m]; }

function assignMenu(slot, d){
  const sch=(S.schedule&&S.schedule[slot])||[];
  if(!sch[d]) return null;
  let k=0; for(let i=0;i<d;i++) if(sch[i]) k++;
  const pool=POOLS[slot]; if(!pool||!pool.length) return null;
  const off=(S.shuffle&&S.shuffle[slot])||0;
  for(let j=0;j<pool.length;j++){                      // 제외 재료 메뉴는 건너뛰고 다음 후보로
    const cand=applyTierSwap(pool[(k+off+j) % pool.length]);
    if(!menuUsesAvoided(cand)) return cand;
  }
  return applyTierSwap(pool[(k+off) % pool.length]);   // 전부 제외되면 원래 메뉴(빈 끼니 방지)
}
function menuTierMin(id){
  let t=MENU_TIERMIN[id]||20;
  const m=MEALS[id]; if(m) for(const ing in (m.use||{})){ const it=ITEMS[ing]; if(it&&it.tierMin) t=Math.max(t,it.tierMin); }
  return t;
}
function customOf(d,slot){
  const id=S.custom&&S.custom[d+"|"+slot];
  if(id && MEALS[id] && (MENU_SLOTS[id]||[]).includes(slot) && menuTierMin(id)<=(S.tier||20) && !menuUsesAvoided(id)) return id;
  return null; // 커스텀이 없거나, 티어 부족·제외 재료 포함이면 자동으로
}
function planFor(d){

    if(!(S.schedule[slot]&&S.schedule[slot][d])){ p[slot]=null; continue; }
    p[slot]=customOf(d,slot)||assignMenu(slot,d);
  }

}

function monthlyItemNeed(){
  const weekly={};
  for(let d=0; d<7; d++){ const p=planFor(d);
    for(const slot of SLOT_ORDER){ if(!p[slot]) continue;
      for(const id in (MEALS[p[slot]].use||{})) weekly[id]=(weekly[id]||0)+MEALS[p[slot]].use[id]; } }
  const out=[];
  for(const id in weekly){ const it=ITEMS[id]; if(!it) continue;
    const amt=weekly[id]*4.3, packs=Math.max(1,Math.ceil(amt/it.pack));
    out.push({id, amt, packs, cost:packs*it.price}); }
  return out.sort((a,b)=>b.cost-a.cost);
}
/* 🧮 스마트 장보기: 다음 7일 계획(커스텀·인원 반영) 필요량 − 보유 재고 = 부족분만 */
function weeklyShortage(){
  const need={}; const t=todayStr();
  for(let i=0;i<7;i++){ const dS=addDays(t,i);
    for(const [slot,mid] of slotsOf(dS)){
      if(S.skips.includes(dS+"|"+slot)) continue;
      const u=MEALS[mid].use||{}; for(const id in u) need[id]=(need[id]||0)+u[id]; } }
  const out=[];
  for(const id in need){ const it=ITEMS[id]; if(!it) continue;
    const short=need[id]-stockOf(id); if(short<=0) continue;
    const packs=Math.ceil(short/it.pack);
    out.push({id, need:need[id], short, packs, cost:packs*it.price}); }
  return out.sort((a,b)=>b.cost-a.cost);
}

    return keys.every(ing=>stockOf(ing) >= u[ing]*0.9);
  }).sort((a,b)=>MEALS[b].pro-MEALS[a].pro);
}

const SPELL_VARIANTS = [
  ["낫토","낫또","나토","natto"],
  ["계란","달걀"],
  ["요거트","요구르트","요플레","yogurt"],

/* 재료·요리 이름 비교용 정규화: 공백·괄호·문장부호 제거 + 소문자 + 표기 통일 */
function normIng(s){
  let t=String(s==null?"":s).toLowerCase().replace(/\(.*?\)/g,"").replace(/[\s·,./&+~\-_'"]/g,"");
  for(const g of SPELL_VARIANTS){ const canon=g[0];
    for(let i=1;i<g.length;i++) if(t.includes(g[i])) t=t.split(g[i]).join(canon); }
  return t;
}
/* 사용자가 적은 이름 → 앱이 아는 재료(ITEMS 키).
   우선순위: ①완전히 같은 이름 ②입력이 별칭을 포함(긴 별칭이 더 구체적)
             ③별칭이 입력을 포함(짧은 별칭이 더 가까움 — "연어"가 "훈제연어"로 새는 것 방지) */
function resolveItemKey(name){
  const s=normIng(name); if(!s) return null;
  let exact=null, wide=null, wideLen=0, narrow=null, narrowLen=Infinity;
  const scan=(key, raw)=>{
    const a=normIng(raw); if(!a) return;
    if(a===s){ if(!exact) exact=key; return; }        // "쌀"처럼 한 글자라도 정확히 같으면 인정
    if(a.length<2 || s.length<2) return;              // 부분 일치는 2글자 이상일 때만(오매칭 방지)
    if(s.includes(a)){ if(a.length>wideLen){ wide=key; wideLen=a.length; } return; }
    if(a.includes(s)){ if(a.length<narrowLen){ narrow=key; narrowLen=a.length; } }
  };
  for(const k in ITEM_ALIAS) for(const a of ITEM_ALIAS[k]) scan(k,a);
  for(const k in ITEMS) scan(k, ITEMS[k].name);
  return exact||wide||narrow||null;
}

function urgentKeys(){
  const ks=new Set(), un=[];
  for(const id of Object.keys(ITEMS)){ const e=expiryInfo(id); if(e&&e.dd>=0&&e.dd<=3&&stockOf(id)>0) ks.add(id); }
  for(const m of myItemsArr()){ const dd=myExpDD(m); if(dd!=null&&dd>=0&&dd<=3&&m.qty>0){ const k=myKeyOf(m); if(k) ks.add(k); else un.push(m); } }
  return {ks:[...ks], un};
}
function urgentUseMenus(){
  const {ks,un}=urgentKeys(); if(!ks.length&&!un.length) return null;
  const have=haveKeySet(); const out=[];
  for(const mid in MEALS){
    const u=MEALS[mid].use||{}; const keys=Object.keys(u); if(!keys.length) continue;
    const hits=keys.filter(k=>ks.includes(k)); if(!hits.length) continue;
    if(menuUsesAvoided(mid)) continue;
    out.push({mid, hits, missing:keys.filter(k=>!have.has(k))});
  }
  out.sort((a,b)=> a.missing.length-b.missing.length || b.hits.length-a.hits.length);
  return {menus:out, urgentIds:ks, un};
}

function adherence7(){
  let planned=0, eaten=0, kcalSum=0, proSum=0, daysWithEat=0;
  for(let i=0;i<7;i++){
    const dS=addDays(todayStr(),-i); let dayK=0, ate=false;
    for(const [slot,mid] of slotsOf(dS)){
      const key=dS+"|"+slot;
      if(S.skips.includes(key)) continue;
      planned++;
      if(S.eaten.includes(key)){ eaten++; dayK+=MEALS[mid].kcal; proSum+=MEALS[mid].pro; ate=true; }
    }
    for(const x of extrasOf(dS)){ dayK+=x.kcal; proSum+=x.pro; ate=true; }   // 계획 외 섭취 합산
    if(ate){ daysWithEat++; kcalSum+=dayK; }
  }
  return {planned, eaten, pct: planned?Math.round(eaten/planned*100):0,
    avgK: daysWithEat?Math.round(kcalSum/daysWithEat):0, avgP: daysWithEat?Math.round(proSum/daysWithEat):0};
}
function streakDays(){
  let s=0;
  for(let i=0;i<90;i++){
    const dS=addDays(todayStr(),-i);
    const keys=slotsOf(dS).map(([slot])=>dS+"|"+slot).filter(k=>!S.skips.includes(k));
    if(!keys.length) continue;                       // 계획 없는 날은 스트릭 유지
    if(keys.every(k=>S.eaten.includes(k))){ s++; continue; }
    if(i===0) continue;                              // 오늘은 아직 진행 중 — 끊지 않음
    break;
  }
  return s;
}

function filterRecipes(q){
  // 띄어쓴 단어는 모두 포함해야 함(예: "두부 계란"), 표기 흔들림은 normIng이 흡수
  const toks=String(q||"").trim().split(/\s+/).map(normIng).filter(t=>t.length>0);
  let shown=0;
  document.querySelectorAll("#rc-list .rc-row").forEach(el=>{
    const d=el.dataset.q||"";
    const hit = !toks.length || toks.every(t=>d.includes(t));
    el.style.display = hit ? "" : "none";
    if(hit) shown++;
  });
  const none=$("rc-none"); if(none) none.style.display = (toks.length && shown===0) ? "" : "none";
}

function pickPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image();
    img.onload=()=>{
      const compress=(max,q)=>{ const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c.toDataURL("image/jpeg",q); };
      let d=compress(720,.72); if(d.length>260000) d=compress(560,.6);
      _draftPhoto=d; const pv=$("fd-preview"); if(pv){ pv.src=d; pv.style.display="block"; }
    };
    img.src=rd.result; };
  rd.readAsDataURL(f);
}

function renderToday(){

  h+=`<div class="card"><h2>🍪 추가로 먹은 것 <span class="sub">계획 외 간식·외식</span></h2>

      <button class="btn sm" onclick="removeExtraMeal('${x.id}')">삭제</button></div>`).join("")
      :`<div class="tiny">계획에 없던 간식·음료·외식을 적으면 오늘 열량·단백질과 주간 리포트에 합산돼요.</div>`}

      <input id="xm-name" type="text" placeholder="예: 카페라떼" onkeydown="if(event.key==='Enter')addExtraMeal()">
      <input id="xm-kcal" type="number" placeholder="kcal" min="0" step="10">
      <input id="xm-pro" type="number" placeholder="단백질g" min="0" step="1">
      <button class="btn primary" onclick="addExtraMeal()">추가</button>
    </div></div>`;
  const mk=makeableMenus();
  if(mk.length){
    h+=`<div class="card"><h2>🍳 지금 만들 수 있는 메뉴 <span class="sub">현재 재고 기준</span></h2>

  const myUn=myItemsArr().filter(m=>m.qty>0 && !myKeyOf(m));
  if(myRec.length||myUn.length){
    let inner="";
    if(myRec.length){
      inner+=myRec.slice(0,8).map(r=>{
        const m=MEALS[r.mid];
        const mine=r.usesMy.map(k=>ITEMS[k].name).join(", ");
        const miss=r.missing.map(k=>ITEMS[k].name).join(", ");

          ? `<div class="links">${shopLinks(ITEMS[r.missing[0]].q)}</div>`

        return `<div class="order-row"><div><div class="nm">${m.name}</div><div class="qy">${m.kcal}kcal · 단백질 ${m.pro}g · 내 재료(${mine}) 사용${r.missing.length?` · <span style="color:var(--serious)">부족: ${miss}</span>`:""}</div></div>${right}</div>`;
      }).join("");
      if(myRec.length>8) inner+=`<div class="tiny" style="margin-top:5px">외 ${myRec.length-8}가지 더 (재고 탭에서 재료를 정리하면 좁혀져요)</div>`;
    }
    if(myUn.length){
      if(inner) inner+=`<hr class="h">`;
      inner+=myUn.map(m=>`<div class="order-row"><div><div class="nm">${escH(m.name)}</div><div class="qy">앱에 없는 재료 — 레시피를 검색해 보세요</div></div>
        <div class="links">${shopLinks(m.name)}<a class="shop" target="_blank" rel="noopener" href="${recipeSearchUrl(m.name)}">만개의레시피</a></div></div>`).join("");

    let inner=`<div class="tiny" style="margin-bottom:7px">3일 안에 써야 해요: <b style="color:var(--serious)">${names.join(", ")}</b></div>`;
    inner+=ug.menus.slice(0,5).map(r=>{
      const m=MEALS[r.mid];
      const right=r.missing.length
        ? `<span class="qy" style="white-space:nowrap;color:var(--serious)">부족: ${r.missing.map(k=>ITEMS[k].name).join(", ")}</span>`
        : `<span class="badge good">지금 가능</span>`;
      return `<div class="order-row"><div><div class="nm">${m.name}</div><div class="qy">${m.kcal}kcal · ${r.hits.map(k=>ITEMS[k].name).join(", ")} 소진</div></div>${right}</div>`;
    }).join("");
    if(!ug.menus.length) inner+=`<div class="tiny">앱 레시피에 이 재료를 쓰는 메뉴가 없어요 — 위 '내 재료로 해먹기'의 검색 버튼을 활용하세요.</div>`;
    h+=`<div class="card"><h2>⏳ 먼저 써야 할 재료 <span class="sub">유통기한 D-3 이내</span></h2>${inner}</div>`;
  }
  h += today.length ? today.map(([slot,mid])=>mealCard(slot,mid,t)).join("")
    : `<div class="card"><h2>오늘은 계획된 끼니가 없어요</h2><div class="muted">[식단표] 탭의 스케줄에서 ${DOWK[dow(t)]}요일의 시간대를 켜거나, 주간표에서 끼니를 눌러 메뉴를 고르면 식단이 잡혀요.</div></div>`;

  const tm=addDays(t,1); const tmSlots=slotsOf(tm);
  h+=`<div class="card"><h2>내일 준비</h2>
    <div class="muted">${tmSlots.length?tmSlots.map(([s,m])=>SLOT_LABEL[s]+" "+MEALS[m].name).join(" · "):"계획된 끼니 없음"}</div>

  $("view-today").innerHTML=h;
}

function renderStock(){

    const it=ITEMS[id], s=itemState(id), stq=stockOf(id);

    d:"<b>[주문]</b> 탭에 이번에 필요한 재료와 수량이 정리돼 있어요. 재료마다 <b>쿠팡·컬리 검색 버튼</b>이 붙어 있어 가격 비교 없이 담기만 하면 됩니다. 물건이 도착하면 <b>[입고]</b>를 눌러 주세요." },
  { art:"🍽️", step:"STEP 3", t:"오늘 먹을 것만<br>보면 돼요",
    d:"<b>[오늘]</b> 탭에 오늘의 끼니와 레시피가 재료·순서·팁까지 그대로 나와요. 다 먹었으면 <b>[먹었어요]</b>를 한 번 눌러 주세요. 그게 전부입니다." },
  { art:"🔄", step:"STEP 4", t:"먹으면 재고가<br>저절로 줄어요",
    d:"체크할 때마다 쓴 재료만큼 재고가 빠지고, 떨어질 때쯤 미리 알려 드려요. <b>유통기한이 3일 남은 재료</b>는 그걸 먼저 쓰는 요리를 추천해 버리는 일이 없게 합니다." },
  { art:"🧺", step:"", t:"직접 산 재료도,<br>우리집 레시피도",
    d:"앱 목록에 없는 재료를 <b>[재고]</b> 탭에 적어 두면 그 재료로 만들 수 있는 요리를 찾아 드려요. <b>235가지 레시피</b> 검색과 내 레시피 등록도 됩니다." },
  { art:"🔒", step:"", t:"가입 없이,<br>이 기기에만",
    d:"로그인도 계정도 없어요. 모든 기록은 <b>이 기기에만</b> 저장되고 어디로도 전송되지 않습니다. 폰을 바꿀 땐 <b>[설정 → 기록 저장·복원]</b>에서 내보내고 가져오면 그대로 이어져요." }
];
let _obIdx=0;
function obHtml(){
  return `<div class="ob" id="ob-root">
    <div class="ob-top"><button class="ob-skip" onclick="closeIntro()">건너뛰기</button></div>
    <div class="ob-track" id="ob-track">
      ${OB_SLIDES.map(sl=>`<div class="ob-slide">
        <div class="ob-art">${sl.art}</div>
        ${sl.step?`<div class="ob-step">${sl.step}</div>`:""}
        <div class="ob-t">${sl.t}</div>
        <div class="ob-d">${sl.d}</div>
      </div>`).join("")}
    </div>
    <div class="ob-bot">
      <div class="ob-hint" id="ob-hint"><b>←</b> 옆으로 밀면 이전 화면</div>
      <div class="ob-dots" id="ob-dots">${OB_SLIDES.map((_,i)=>`<button type="button" class="ob-dot${i===0?" on":""}" aria-label="${i+1}번째 안내로" onclick="obGo(${i})"></button>`).join("")}</div>
      <button class="btn primary ob-cta" id="ob-cta" onclick="obNext()">다음</button>
    </div>
  </div>`;
}
function obSync(){
  const tr=document.getElementById("ob-track"); if(!tr) return;
  const w=tr.clientWidth||1;
  const i=Math.max(0, Math.min(OB_SLIDES.length-1, Math.round(tr.scrollLeft/w)));
  if(i===_obIdx) return;
  _obIdx=i;
  const dots=document.getElementById("ob-dots");
  if(dots) [...dots.children].forEach((d,k)=>d.classList.toggle("on", k===i));
  const hint=document.getElementById("ob-hint");
  if(hint) hint.classList.toggle("on", i>0);           // 2번째 화면부터 "밀면 이전" 안내
  const cta=document.getElementById("ob-cta");
  if(cta) cta.textContent = (i===OB_SLIDES.length-1) ? "시작하기" : "다음";
}
/* 앞으로는 [다음] 버튼, 뒤로는 손으로 미는 스와이프가 기본.
   화살표키·점 탭은 손가락을 못 쓰는 환경(PC 등)을 위한 보조 수단. */
function obGo(i){
  const tr=document.getElementById("ob-track"); if(!tr) return;
  i=Math.max(0, Math.min(OB_SLIDES.length-1, i));
  const w=tr.clientWidth||1;
  const far=Math.abs(i-_obIdx)>1;   // 두 칸 이상 건너뛰면(점 탭) 중간 화면을 훑지 않고 바로 이동
  try{ tr.scrollTo({left:i*w, behavior: far?"auto":"smooth"}); }catch(e){ tr.scrollLeft=i*w; }
  setTimeout(obSync, far?60:380);
}
function obNext(){ if(_obIdx>=OB_SLIDES.length-1){ closeIntro(); return; } obGo(_obIdx+1); }
function obPrev(){ if(_obIdx>0) obGo(_obIdx-1); }
function obKey(e){
  if(!document.getElementById("ob-root")) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); obPrev(); }
  else if(e.key==="ArrowRight"&&_obIdx<OB_SLIDES.length-1){ e.preventDefault(); obGo(_obIdx+1); }
}
function openIntro(){
  if(document.getElementById("ob-root")) return;
  _obIdx=0;
  const d=document.createElement("div"); d.id="ob-wrap"; d.innerHTML=obHtml();
  document.body.appendChild(d);
  const tr=document.getElementById("ob-track");
  if(tr){ tr.scrollLeft=0; tr.addEventListener("scroll", obSync, {passive:true}); }
  document.addEventListener("keydown", obKey);
}
function maybeIntro(){
  try{ if(!lsAvailable() || localStorage.getItem(INTRO_KEY)) return; openIntro(); }catch(e){}
}
function closeIntro(){
  try{ localStorage.setItem(INTRO_KEY,"1"); }catch(e){}
  document.removeEventListener("keydown", obKey);
  const w=document.getElementById("ob-wrap"); if(w) w.remove();
  const old=document.getElementById("intro-root"); if(old) old.remove();   // 구버전 잔재
}
function guideCardHtml(){
  return `<div class="card"><h2>📖 앱 사용법</h2>
    <div class="muted">이 앱은 <b>로그인·회원가입이 없어요.</b> 열자마자 바로 쓰고, 모든 기록은 이 기기에 자동 저장됩니다. 서버로 전송되는 정보는 없어요.</div>
    <div class="tiny" style="margin-top:8px">기기를 바꿀 때는 아래 <b>[기록 저장·복원]</b>에서 내보내기 → 새 기기에서 가져오기 한 번이면 그대로 이어집니다.</div>
    <div class="btnrow"><button class="btn" onclick="openIntro()">🔁 사용법 다시 보기</button></div></div>`;
}
function _bootMsg(txt){ try{ var d=document.createElement("div");
  d.setAttribute("style","margin:14px;padding:14px;border:1px solid #ff2d2d;border-radius:12px;background:#fff;color:#111;font:14px/1.6 -apple-system,system-ui,sans-serif");
  d.innerHTML=txt; document.body.insertBefore(d, document.body.firstChild); }catch(_){} }
/* ===== 확대(줌) 고정 ===== */
function lockZoom(){
  try{
    var stop=function(e){ e.preventDefault(); };
    ["gesturestart","gesturechange","gestureend"].forEach(function(t){
      document.addEventListener(t, stop, {passive:false});
    });
    document.addEventListener("dblclick", stop, {passive:false});
    document.addEventListener("touchstart", function(e){
      if(e.touches && e.touches.length>1) e.preventDefault();
    }, {passive:false});
  }catch(e){}
}
function boot(){
  try{ loadLocal(); }catch(e){}
  try{ loadFeed(); }catch(e){}
  try{ applyTheme(); }catch(e){}
  try{ lockZoom(); }catch(e){}
  try{ render(); }
  catch(e){ _bootMsg("앱을 그리는 중 문제가 생겼어요. 카카오톡 인앱 화면 대신 <b>사파리·크롬</b>으로 열면 정상 동작합니다.<br><span style=\"color:#888;font-size:12px\">("+(e&&e.message||e)+")</span>"); }
  try{ nativeInit(); }catch(e){}
  try{ pwaInit(); }catch(e){}
  try{ maybeIntro(); }catch(e){}
  /* 안전장치: 조금 뒤에도 본문이 비면 안내(인앱 브라우저가 JS를 제한하는 경우) */
  setTimeout(function(){ try{ var v=document.getElementById("view-today");
    if(v && v.innerHTML.trim()===""){ _bootMsg("화면이 비어 보이면, 이 파일을 카카오톡 인앱 화면 말고 <b>사파리·크롬</b>으로 열어 주세요. (파일 열 때 “<b>브라우저로 열기</b>” 선택)"); }
  }catch(_){} }, 500);
}
boot();
</script>
