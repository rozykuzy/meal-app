<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>식단 매니저 — 한 달 식단·장보기·재고</title>
<style>
/* ============ 디자인 시스템 v3 — Apple HIG · Liquid Glass (시스템 그레이 + 애플 블루 + 유리 바 + 흰 카드) ============ */
:root{
  color-scheme: light;
  --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out-strong: cubic-bezier(0.77, 0, 0.175, 1);
  --surface-1:#ffffff; --page:#f5f5f7;
  --ink-1:#1d1d1f; --ink-2:#5a5a60; --ink-3:#6b6b70;
  --grid:#f0f0f2; --axis:#e3e3e8; --ring:#ececf0;
  --accent:#0071e3; --accent-soft:#e8f2ff; --accent-text:#0062c4;
  --good:#34c759; --good-text:#1f9d4d; --warn:#ff9500; --serious:#ff6b35; --crit:#ff3b30;
  --good-bg:rgba(52,199,89,.12); --warn-bg:rgba(255,149,0,.12); --serious-bg:rgba(255,107,53,.12); --crit-bg:rgba(255,59,48,.10);
  --crit-text:#d70015;
  --navbar:rgba(255,255,255,.78); --navbar-on:#0062c4; --navbar-off:#6b6b70;
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.88); --hairline:rgba(0,0,0,.07);
  /* Liquid Glass: 유리 틴트·135° 좌상단 스펙큘러 림·iOS26 2단 그림자 */
  --glass-tint:rgba(210,220,240,.12); --glass-sat:120%;
  --rim-hi:rgba(255,255,255,.55); --rim-lo:rgba(255,255,255,.10); --sheen:rgba(255,255,255,.42);
  --elev:0 2px 8px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.02);
  --elev-float:0 8px 28px rgba(0,0,0,.13), 0 2px 6px rgba(0,0,0,.05);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:100ms; --dur:200ms; --dur-slow:300ms;
  --r-sm:8px; --r-md:16px; --r-lg:20px; --r-cap:9999px;
  /* 러닝 앱 문법 — 표면 그라디언트 · 액센트 그라디언트 · 글로우 (라이트) */
  --card-a:#ffffff; --card-b:#f4f7fb; --card-rim:rgba(255,255,255,.9);
  --accent-2:#4db8ff; --accent-grad:linear-gradient(135deg,#0071e3 0%,#4db8ff 100%);
  --glow:0 2px 10px rgba(0,113,227,.22); --glow-soft:0 0 6px rgba(0,113,227,.12);
  --accent-halo:rgba(0,113,227,.09); --ring-glow:none;
  --label:#5f6875;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1c1c1e; --page:#000000;
  --ink-1:#f5f5f7; --ink-2:#a5a5ad; --ink-3:#94949e;
  --grid:#2c2c2e; --axis:#38383a; --ring:rgba(255,255,255,.07);
  --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
  --good:#30d158; --good-text:#30d158; --warn:#ff9f0a; --serious:#ff7d5c; --crit:#ff453a;
  --good-bg:rgba(48,209,88,.14); --warn-bg:rgba(255,159,10,.14); --serious-bg:rgba(255,125,92,.14); --crit-bg:rgba(255,69,58,.14);
  --accent-text:#5eb0ff; --crit-text:#ff6961;
  --navbar:rgba(28,28,30,.8); --navbar-on:#5eb0ff; --navbar-off:#98989f;
  --glass:rgba(28,28,30,.72); --glass-strong:rgba(28,28,30,.88); --hairline:rgba(255,255,255,.09);
  --glass-tint:rgba(255,255,255,.08); --glass-sat:120%;
  --rim-hi:rgba(255,255,255,.16); --rim-lo:rgba(255,255,255,.04); --sheen:rgba(255,255,255,.10);
  --elev:0 2px 8px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.20);
  --elev-float:0 8px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  --card-a:#191c22; --card-b:#0d0f13; --card-rim:rgba(255,255,255,.10);
  --accent:#0a84ff; --accent-2:#64d2ff; --accent-grad:linear-gradient(135deg,#0a84ff 0%,#64d2ff 100%);
  --glow:0 2px 14px rgba(10,132,255,.42); --glow-soft:0 0 10px rgba(10,132,255,.35);
  --accent-halo:rgba(10,132,255,.20); --ring-glow:drop-shadow(0 0 5px rgba(10,132,255,.45));
  --label:#9aa3b1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#1c1c1e; --page:#000000;
    --ink-1:#f5f5f7; --ink-2:#a5a5ad; --ink-3:#94949e;
    --grid:#2c2c2e; --axis:#38383a; --ring:rgba(255,255,255,.07);
    --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
    --good:#30d158; --good-text:#30d158; --warn:#ff9f0a; --serious:#ff7d5c; --crit:#ff453a;
    --good-bg:rgba(48,209,88,.14); --warn-bg:rgba(255,159,10,.14); --serious-bg:rgba(255,125,92,.14); --crit-bg:rgba(255,69,58,.14);
    --accent-text:#5eb0ff; --crit-text:#ff6961;
    --navbar:rgba(28,28,30,.8); --navbar-on:#5eb0ff; --navbar-off:#98989f;
    --glass:rgba(28,28,30,.72); --glass-strong:rgba(28,28,30,.88); --hairline:rgba(255,255,255,.09);
    --glass-tint:rgba(255,255,255,.08); --glass-sat:120%;
    --rim-hi:rgba(255,255,255,.16); --rim-lo:rgba(255,255,255,.04); --sheen:rgba(255,255,255,.10);
    --elev:0 2px 8px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.20);
    --elev-float:0 8px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    --card-a:#191c22; --card-b:#0d0f13; --card-rim:rgba(255,255,255,.10);
    --accent:#0a84ff; --accent-2:#64d2ff; --accent-grad:linear-gradient(135deg,#0a84ff 0%,#64d2ff 100%);
    --glow:0 2px 14px rgba(10,132,255,.42); --glow-soft:0 0 10px rgba(10,132,255,.35);
    --accent-halo:rgba(10,132,255,.20); --ring-glow:drop-shadow(0 0 5px rgba(10,132,255,.45));
    --label:#9aa3b1;
  }
}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; overflow-x:clip; touch-action:manipulation }
body{ touch-action:manipulation }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
body{margin:0; background:var(--page); color:var(--ink-1);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px; line-height:1.55; padding-bottom:calc(96px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased; letter-spacing:-.01em}
.wrap{max-width:760px; margin:0 auto; padding:14px 16px 24px}
header.app{position:sticky; top:0; z-index:40; border-bottom:0;
  background:linear-gradient(var(--glass-tint),var(--glass-tint)), var(--glass);
  -webkit-backdrop-filter:saturate(var(--glass-sat)) blur(20px); backdrop-filter:saturate(var(--glass-sat)) blur(20px);
  box-shadow:inset 0 1px 0 var(--rim-hi);
  display:flex; align-items:center; gap:8px; padding:calc(12px + env(safe-area-inset-top)) 6px 12px; margin:-14px -16px 16px}
/* ProgressiveBlur — 바 아래로 갈수록 흐림이 사라져 콘텐츠가 '녹아' 끝난다(하드 컷 라인 제거) */
header.app::after{content:""; position:absolute; top:100%; left:0; right:0; height:22px; pointer-events:none;
  -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px);
  -webkit-mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%);
  mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%)}
.ab-side{width:44px; display:flex; align-items:center; justify-content:flex-end}
.ab-side.l{justify-content:flex-start}
.ab-title{flex:1; text-align:center; min-width:0}
header.app h1{font-size:17px; margin:0; font-weight:800; letter-spacing:-.3px}
header.app .date{color:var(--ink-3); font-size:11.5px; letter-spacing:0; margin-top:1px}
.theme-btn{border:0; background:none; color:var(--ink-2); font-size:17px; cursor:pointer; padding:0; min-width:44px; border-radius:10px;
  transition:transform 120ms var(--ease-out-strong)}
.theme-btn:active{transform:scale(.9)}
/* stat tiles */
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:4px 0 14px}
@media (max-width:560px){ .tiles{grid-template-columns:repeat(2,1fr)} }
.tile{background:linear-gradient(158deg,var(--card-a) 0%,var(--card-b) 100%); border:1px solid var(--ring);
  border-radius:var(--r-lg); padding:15px 15px 14px; box-shadow:var(--elev), inset 0 1px 0 var(--card-rim)}
/* ── 지표 표기(라벨 + 숫자) — 앱 전체 공통 ── */
.cal-eyebrow, .tile .k, .cal-stat .k{font-size:10px; color:var(--label); font-weight:800; letter-spacing:.13em}
.tile .k, .cal-stat .k{margin-bottom:5px}
.tile .v, .cal-stat .v{font-size:27px; font-weight:900; letter-spacing:-1.2px; line-height:1.05;
  font-variant-numeric:tabular-nums; color:var(--ink-1)}
.tile .v span, .cal-stat .v span{font-size:13px; font-weight:700; color:var(--label); margin-left:2px; letter-spacing:0}

.tile .s{font-size:11.5px; color:var(--ink-2); margin-top:1px}
.tile .bar{height:7px; background:var(--grid); border-radius:5px; margin-top:9px; overflow:hidden}
.tile .bar i{display:block; height:100%; background:var(--accent-grad); border-radius:5px; box-shadow:var(--glow-soft)}
/* tabs */
nav.tabs{position:fixed; bottom:calc(10px + env(safe-area-inset-bottom)); left:12px; right:12px; max-width:600px; margin:0 auto;
  background:linear-gradient(var(--glass-tint),var(--glass-tint)), var(--navbar);
  -webkit-backdrop-filter:saturate(var(--glass-sat)) blur(22px); backdrop-filter:saturate(var(--glass-sat)) blur(22px);
  border:1px solid var(--hairline); border-radius:var(--r-cap); overflow:hidden; isolation:isolate;
  display:flex; z-index:50; box-shadow:var(--elev-float), inset 0 1px 0 var(--rim-hi), inset 0 -1px 0 var(--rim-lo)}
/* 135°(좌상단) 광원 스펙큘러 — 유리 윗면이 빛을 받는 느낌 */
nav.tabs::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:-1; border-radius:inherit;
  background:linear-gradient(135deg, var(--sheen) 0%, rgba(255,255,255,0) 42%)}
nav.tabs button{flex:1; border:0; background:none; color:var(--navbar-off); font-size:10.5px;
  margin:5px 3px; border-radius:var(--r-cap); padding:8px 0 7px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:600;
  transition:transform var(--dur) var(--ease-spring), color var(--dur-fast) ease, background-color var(--dur) ease}
nav.tabs button:active{transform:scale(.9)}
nav.tabs button .ico{width:23px; height:23px; display:block}
nav.tabs button .ico svg{width:23px; height:23px; display:block; stroke:currentColor; fill:none; stroke-width:1.8}
nav.tabs button.on{color:var(--navbar-on); font-weight:800; background:var(--accent-soft); box-shadow:inset 0 1px 0 var(--rim-hi)}
/* cards */
.card{background:linear-gradient(158deg,var(--card-a) 0%,var(--card-b) 100%); border:1px solid var(--ring);
  border-radius:var(--r-lg); padding:17px 18px; margin-bottom:12px; box-shadow:var(--elev), inset 0 1px 0 var(--card-rim)}
.card h2{font-size:15.5px; margin:0 0 11px; display:flex; align-items:center; gap:7px; font-weight:800; letter-spacing:-.2px}
.card h2 .sub{font-weight:800; font-size:10px; color:var(--label); margin-left:auto; letter-spacing:.1em}
.muted{color:var(--ink-2); font-size:13.5px}
.tiny{color:var(--ink-3); font-size:12px}
hr.h{border:0; border-top:1px solid var(--grid); margin:12px 0}
/* buttons */
/* ── 버튼의 문법 ──
   누를 수 있는 모든 알약은 내용이 정중앙에 오고 44pt 이상이다.
   이 규칙 뒤에서 display를 다시 선언하지 말 것 — 가운데 정렬이 풀린다. */
.btn, a.shop, .chip, .mpick, .theme-btn, .sheet-x, .cal-nav, .fav-btn, .led-act button{
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  box-sizing:border-box; min-height:44px; line-height:1.25; text-align:center;
  font-family:inherit; -webkit-appearance:none; appearance:none}
.btn{border:0; background:var(--grid); color:var(--ink-1);
  border-radius:var(--r-cap); min-height:48px; padding:12px 18px; font-size:14px; cursor:pointer; font-weight:700; letter-spacing:-.2px;
  transition:transform var(--dur) var(--ease-spring), background-color var(--dur-fast) ease, opacity var(--dur-fast) ease}
.btn:active{transform:scale(.955)}
@media (hover: hover) and (pointer: fine){
  .btn:hover{filter:brightness(.97)}
  .btn.primary:hover{filter:brightness(1.06)}
  a.shop:hover{filter:brightness(.96)}
}
.btn.primary{background:var(--accent-grad); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.28), var(--glow)}
.btn.dark{background:var(--ink-1); color:var(--surface-1)}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.sm{padding:8px 14px; font-size:12.5px; border-radius:var(--r-cap); min-height:44px; min-width:44px; font-weight:600; background:var(--grid)}
.btn:disabled{opacity:.4; cursor:default}
label.btn{display:inline-flex; align-items:center; justify-content:center}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
/* badges */
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700;
  border-radius:20px; padding:3px 9px}
.badge.good{color:var(--good-text); background:var(--good-bg)}
.badge.warn{color:var(--warn); background:var(--warn-bg)}
:root[data-theme="dark"] .badge.warn{color:var(--warn)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge.warn{color:var(--warn)} }
.badge.serious{color:var(--serious); background:var(--serious-bg)}
:root[data-theme="dark"] .badge.serious{color:var(--serious)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge.serious{color:var(--serious)} }
.badge.crit{color:var(--crit); background:var(--crit-bg)}
.badge.plain{color:var(--ink-2); background:var(--grid)}
/* meal card */
.meal .name{font-size:17px; font-weight:800; letter-spacing:-.3px}
.meal .nutri{font-size:12.5px; color:var(--ink-2); margin:3px 0 8px}
.meal ul{margin:6px 0 0; padding-left:18px; font-size:13px; color:var(--ink-2)}
.meal .recipe{font-size:13px; color:var(--ink-2); margin-top:9px; background:var(--grid);
  border-radius:14px; padding:11px 13px}
.state-line{margin-top:9px; font-size:12.5px; color:var(--ink-2)}
details.rsteps{margin-top:7px}
details.rsteps summary{cursor:pointer; font-size:12.5px; color:var(--accent-text); font-weight:700; list-style:none; user-select:none;
  transition:transform 120ms var(--ease-out-strong)}
details.rsteps summary::-webkit-details-marker{display:none}
details.rsteps summary::before{content:"▸"; display:inline-block; margin-right:5px;
  transition:transform 200ms var(--ease-out-strong)}
details.rsteps[open] summary::before{transform:rotate(90deg)}
details.rsteps summary:active{transform:scale(.98)}
details.rsteps[open] > *:not(summary){animation:contentIn 180ms var(--ease-out-strong)}
@keyframes contentIn{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
details.rsteps ol{margin:8px 0 0; padding-left:20px; line-height:1.65}
details.rsteps li{margin-bottom:5px}
.rtip{margin-top:7px; font-size:12.5px; color:var(--ink-2)}
/* inventory */
.inv{display:flex; flex-direction:column; gap:9px}
.inv-item{background:var(--grid); border-radius:14px; padding:12px 14px}
.inv-item .top{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.inv-item .nm{font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.inv-item .qty{margin-left:auto; font-size:12.5px; color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums}
/* 수량을 바꾸는 버튼은 숫자 바로 옆에 둔다 */
.iv-top{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; column-gap:10px}
.iv-step{display:inline-flex; align-items:center; background:var(--surface-1); border-radius:var(--r-cap);
  border:1px solid var(--axis); overflow:hidden}
.iv-step button{width:44px; height:44px; min-height:44px; border:0; background:transparent; color:var(--ink-1);
  font-size:17px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  font-family:inherit; -webkit-appearance:none; appearance:none; touch-action:manipulation}
.iv-step button:active{background:var(--grid)}
.iv-step .n{min-width:58px; text-align:center; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-1)}
.iv-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.iv-tags:empty{display:none}
.iv-note{margin-top:8px; font-size:11.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.iv-note b{color:var(--ink-2)}
.inv-item .bar{height:7px; background:var(--axis); border-radius:5px; margin:8px 0 6px; overflow:hidden}
.inv-item .bar i{display:block; height:100%; border-radius:5px; background:var(--accent-grad); box-shadow:var(--glow-soft)}
/* 조작 버튼은 자기 층에서 오른쪽에 붙는다 — 설명이 길어져도 자리가 안 밀린다 */
.inv-item .meta{display:grid; grid-template-columns:minmax(0,1fr); row-gap:0; font-size:11.5px; color:var(--ink-3)}
.inv-item .ops{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; align-items:center; margin-top:9px}
.inv-item .meta > .ops{flex:1 0 100%; margin-top:7px}
.inv-item .btn.sm{background:var(--surface-1); white-space:nowrap}
.inv-item .ops a.shop{padding:5px 9px}
/* order */
/* ── 목록 줄의 문법 ──
   위층: 내용(왼쪽·넘치면 말줄임) | 금액(오른쪽·폭 고정)   아래층: 조작 버튼(오른쪽 붙박이)
   버튼이 글자와 같은 줄에서 자리를 다투지 않으므로 글자 길이가 달라져도 자리가 그대로다. */
.order-row{display:grid; grid-template-columns:minmax(0,1fr) auto; row-gap:0; column-gap:10px;
  grid-template-areas:"info price" "acts acts";
  align-items:center; padding:11px 0; border-bottom:1px solid var(--grid); font-size:13.5px}
.order-row > :first-child{grid-area:info; min-width:0}
/* 입고·지출 내역 — 이름/금액 한 줄, 날짜/버튼 한 줄 */
.led{padding:11px 0; border-bottom:1px solid var(--grid)}
.led:last-child{border-bottom:0}
.led-top{display:flex; align-items:baseline; gap:10px}
.led-nm{font-weight:700; font-size:14px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.led-pr{flex:none; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums}
.led-bot{display:flex; align-items:center; gap:8px; margin-top:5px}
.led-sub{flex:1; min-width:0; font-size:11.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.led-act{flex:none; display:flex; gap:5px}
.led-act button{border:1px solid var(--axis); background:var(--surface-1);
  color:var(--ink-2); font-size:12px; font-weight:700;
  padding:0 12px; height:44px; min-width:44px; border-radius:var(--r-cap); cursor:pointer;
  touch-action:manipulation; white-space:nowrap; transition:background 100ms var(--ease-out-strong)}
.led-act button:active{background:var(--grid)}
.led-act button.del{color:var(--crit-text)}
.led-batch{display:flex; align-items:center; gap:8px; margin:12px 0 2px; font-size:12.5px; color:var(--ink-2)}
.led-batch b{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.order-row:last-child{border-bottom:0}
.order-row .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis}
.order-row .qy{color:var(--ink-3); font-size:12px; overflow:hidden; text-overflow:ellipsis}
.order-row .pr{grid-area:price; justify-self:end; white-space:nowrap; font-variant-numeric:tabular-nums;
  font-weight:600; min-width:78px; text-align:right}
.order-row .links{grid-area:acts; justify-self:end; display:flex; gap:6px; flex-wrap:wrap;
  justify-content:flex-end; margin-top:8px}
.order-row .links:empty{display:none}
/* 예산 카드 — 숫자마다 이름표를 붙여 줄로 세운다 */
.bgt{margin-top:4px}
.bgt-row{display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid var(--grid); font-size:13.5px}
.bgt-row:last-child{border-bottom:0}
.bgt-row span{flex:1; min-width:0; color:var(--ink-2)}
.bgt-row b{flex:none; font-weight:700; font-variant-numeric:tabular-nums}
.bgt-row.sub2 span, .bgt-row.sub2 b{font-size:12.5px; color:var(--ink-3)}
a.shop{font-size:11.5px; font-weight:700; text-decoration:none; border:0; border-radius:var(--r-cap);
  padding:5px 13px; min-width:46px; color:var(--accent-text); background:var(--accent-soft); white-space:nowrap;
  transition:transform 120ms var(--ease-out-strong), filter 120ms ease}
a.shop:active{transform:scale(.95)}
.total-line{display:flex; justify-content:space-between; font-weight:800; padding-top:10px; font-size:14.5px}
/* ── 글씨는 어떤 칸에서도 밖으로 새지 않는다 ────────────────────── */
main, header, #alerts, .sheet, .toast{overflow-wrap:anywhere}
/* 제목·설명문은 낱말 가운데를 끊지 않는다. */
.card h2, .buy-h, .fold-h h2, .alertbox, .muted, .tiny, h1{overflow-wrap:break-word}
/* [주문] 살 것 묶음 — 한 카드 안에서 '몰아서'와 '신선'을 눈으로 가른다 */
.buy-sec{border:1px solid var(--ring); border-radius:16px; padding:12px 13px 13px; margin-top:10px; background:var(--page)}
.buy-sec + .buy-sec{margin-top:12px}
.buy-h{display:flex; align-items:baseline; gap:7px; font-weight:800; font-size:14px; letter-spacing:-.2px}
.buy-h .amt{margin-left:auto; font-size:13px; font-weight:800; white-space:nowrap}
.buy-note{color:var(--ink-3); font-size:12px; margin-top:3px; line-height:1.5}
.buy-sec .order-row:last-of-type{border-bottom:0}
.buy-ship{font-size:12px; color:var(--ink-2); margin-top:8px; line-height:1.5}
.buy-big{display:flex; align-items:baseline; justify-content:space-between; gap:6px 10px;
  flex-wrap:wrap; margin:2px 0 0}
.buy-big .n{font-size:26px; font-weight:800; letter-spacing:-.6px; white-space:nowrap}
.buy-big .u{font-size:12.5px; color:var(--ink-2); text-align:right; line-height:1.5; min-width:0}
.buy-big .u .nw{white-space:nowrap}   /* "11가지는 지금 없음"이 줄 중간에서 갈라지지 않게 */
/* 접히는 카드 — 자주 안 보는 것은 접어 두되 사라지지는 않게 */
.fold-h{display:flex; align-items:center; gap:8px; width:100%; min-height:44px; box-sizing:border-box;
  background:none; border:0; padding:0; margin:0; font:inherit; color:var(--ink); text-align:left;
  cursor:pointer; -webkit-appearance:none; appearance:none}
.fold-h h2{margin:0; flex:1; min-width:0}
/* 카드 안에서 한 단 접는 자리 — 카드를 새로 만들지 않고 같은 문법을 쓴다 */
.fold-in{margin-top:10px; border-top:1px solid var(--line); padding-top:2px}
.fold-in>.fold-h{padding:10px 2px}
.fold-in>.fold-h h2{font-size:14px; color:var(--ink-3)}
.fold-h .fx{flex:none; color:var(--ink-3); font-size:12px; font-weight:800}
.fold-b{padding-top:4px}
.mset{margin-top:6px}
.mset-row{padding:11px 0; border-bottom:1px solid var(--grid)}
.mset-row:last-child{border-bottom:0}
.mset-top{display:flex; align-items:center; gap:10px; min-height:44px}
.mset-nm{font-weight:700; font-size:14.5px; flex:1; min-width:0}
.mset-off{font-size:12.5px; color:var(--ink-3)}
.mset-time{flex:none; border:1px solid var(--axis); background:var(--surface-1); color:var(--ink-1);
  border-radius:12px; padding:0 12px; min-height:44px; font-size:15px; font-family:inherit;
  font-variant-numeric:tabular-nums; -webkit-appearance:none; appearance:none}
.mset-seg{display:flex; gap:3px; background:var(--grid); border-radius:var(--r-cap); padding:3px; margin-top:2px}
.mset-seg button{flex:1 1 0; min-width:0; min-height:44px; border:0; background:transparent; color:var(--ink-2);
  font-family:inherit; font-size:12.5px; font-weight:700; border-radius:var(--r-cap); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
  -webkit-appearance:none; appearance:none; touch-action:manipulation}
.mset-seg button.on{background:var(--surface-1); color:var(--accent-text); box-shadow:0 1px 3px rgba(0,0,0,.10)}
.mset-note{font-size:11.5px; color:var(--ink-3); margin-top:7px}
.bud-set{margin-top:8px}
.bud-in{display:block; width:100%; box-sizing:border-box; border:1px solid var(--axis); background:var(--surface-1); color:var(--ink-1);
  border-radius:14px; padding:10px 14px; min-height:52px; font-size:24px; font-weight:800; font-family:inherit;
  font-variant-numeric:tabular-nums; letter-spacing:-.4px; -webkit-appearance:none; appearance:none}
.bud-in:focus{outline:none; border-color:var(--accent)}
.bud-now{display:flex; align-items:flex-start; gap:10px; margin-top:12px; padding:12px 13px;
  background:var(--page); border:1px solid var(--ring); border-radius:16px}
.bud-now > div{flex:1; min-width:0; font-size:13.5px}
.bud-now .badge{flex:none; margin-top:1px}
.pace{display:flex; align-items:center; gap:10px; margin-top:10px; padding:11px 13px; border-radius:14px}
.pace > div{flex:1; min-width:0; font-size:13px}
.pace.up{background:var(--good-bg); color:var(--good-text)}
.pace.down{background:var(--serious-bg); color:var(--serious)}
.pace .btn{flex:none}
.bar2{display:flex; height:9px; background:var(--grid); border-radius:5px; margin:10px 0 2px; overflow:hidden}
.bar2 i{display:block; height:100%}
.bar2 .a{background:var(--accent)}
.bar2 .b{background:var(--accent-soft)}
.bgt-row.after{border-top:1px solid var(--axis); border-bottom:0; margin-top:2px; padding-top:9px}
.bgt-row.after span{color:var(--ink-1); font-weight:600}
.bgt-row.after b{font-size:15px}
.tiny.hint{margin-top:8px; padding:9px 11px; background:var(--grid); border-radius:12px; line-height:1.55}
.save{margin-top:10px; display:flex; flex-direction:column; gap:7px}
.save div{font-size:12px; color:var(--ink-2); line-height:1.6}
.save b{color:var(--ink-1)}
.bar2.over .a{background:var(--crit)}
.setup-back{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:240}
.setup-box{position:fixed; left:0; right:0; bottom:0; z-index:241; background:var(--surface-1);
  border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh; overflow:auto; box-shadow:0 -8px 40px rgba(0,0,0,.18)}
/* 시작 버튼은 늘 보여야 한다 — 내용이 길어지면 화면 밖으로 밀려나 앱을 못 시작하게 된다 */
.setup-cta{position:sticky; bottom:calc(-18px - env(safe-area-inset-bottom)); margin:14px -18px -18px;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(0,0,0,0), var(--surface-1) 34%)}
.alertbox{border-radius:16px; padding:12px 14px; margin-bottom:9px; font-size:13px; display:flex; gap:9px; align-items:flex-start}
.alertbox.warn{background:var(--warn-bg)} .alertbox.serious{background:var(--serious-bg)}
.alertbox.crit{background:var(--crit-bg)} .alertbox.info{background:var(--accent-soft)}
/* table */
table.plan{width:100%; border-collapse:collapse; font-size:12.5px}
table.plan th{color:var(--ink-3); font-weight:700; text-align:left; padding:7px 6px; border-bottom:1.5px solid var(--axis); font-size:11px; letter-spacing:.02em}
table.plan td{padding:8px 6px; border-bottom:1px solid var(--grid); vertical-align:top}
table.plan td b{font-size:12.5px}
table.plan .n{color:var(--ink-3); font-size:11px; font-variant-numeric:tabular-nums}
/* 투명도 감소 선호 · backdrop-filter 미지원 → 라이브러리의 minimal 변형처럼 불투명 표면으로 */
@media (prefers-reduced-transparency: reduce){
  header.app, nav.tabs, .sheet{background:var(--surface-1); -webkit-backdrop-filter:none; backdrop-filter:none}
  header.app{border-bottom:1px solid var(--ring)}
  header.app::after, nav.tabs::before{display:none}
}
@supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){
  header.app, nav.tabs, .sheet{background:var(--surface-1)}
  header.app{border-bottom:1px solid var(--ring)}
  header.app::after{display:none}
}
/* reduced motion */
@media (prefers-reduced-motion: reduce){
  main section{animation:viewFade 120ms ease}
  details.rsteps[open] > *:not(summary){animation:viewFade 120ms ease}
  @keyframes viewFade{from{opacity:0} to{opacity:1}}
  .btn:active, nav.tabs button:active, a.shop:active, .theme-btn:active, details.rsteps summary:active{transform:none}
  .sheet{animation:none} .scell, .chip, .opt{transition:none}
  details.rsteps summary::before{transition:none}
}
/* forms */
input[type=text],input[type=number],input[type=date],input[type=password],textarea{
  width:100%; border:1.5px solid transparent; background:var(--grid); color:var(--ink-1);
  border-radius:var(--r-md); padding:12px 16px; font-size:16px; font-family:inherit; transition:border-color 120ms ease, background-color 120ms ease}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,input[type=password]:focus,textarea:focus{outline:none; border-color:var(--accent); background:var(--surface-1)}
textarea{min-height:70px}
label.f{display:block; font-size:12.5px; color:var(--ink-2); margin:11px 0 5px; font-weight:600}
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 4px; -webkit-overflow-scrolling:touch}
/* 전부 보고 골라야 하는 것은 옆으로 밀지 않는다 — 잘려 있으면 있는 줄도 모른다 */
.chips.wrap{flex-wrap:wrap; overflow-x:visible}
/* 고르는 줄이 여럿이면 무엇을 고르는 줄인지 이름이 있어야 한다.
   다만 이름을 줄 위에 얹으면 줄마다 한 칸씩 더 먹어, 정작 레시피가 화면 밖으로 밀린다.
   실제로 첫 레시피가 798px → 923px 로 내려가 한 줄도 안 보였다. 이름은 줄 왼쪽에 둔다. */
.rc-line{display:flex; align-items:center; gap:9px; margin-top:5px}
.rc-line > .chips{flex:1; min-width:0; padding:1px 0}
.rc-line:first-of-type{margin-top:8px}
.rc-axis{flex:none; width:46px; font-size:11.5px; font-weight:700; color:var(--ink-3);
  line-height:1.25; word-break:keep-all}
.chip{flex:0 0 auto; border:0; background:var(--grid); color:var(--ink-2); white-space:nowrap;
  border-radius:var(--r-cap); padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  transition:transform var(--dur) var(--ease-spring), background-color var(--dur-fast) ease, color var(--dur-fast) ease}
.chip.on{background:var(--accent-grad); color:#fff; font-weight:800; box-shadow:var(--glow-soft)}
.chip:active{transform:scale(.95)}
table.tiers{width:100%; border-collapse:collapse; font-size:12px}
table.tiers td{padding:6px 4px; border-bottom:1px solid var(--grid); vertical-align:top}
table.tiers td.n{white-space:nowrap; font-variant-numeric:tabular-nums}
table.tiers tr.on td{font-weight:800; color:var(--accent)}
/* 주간표 메뉴 선택 버튼 */
.mpick{margin:0 6px 6px 0; padding:9px 13px; font-size:12.5px; font-weight:600;
  border:0; background:var(--grid); color:var(--ink-1); border-radius:11px; cursor:pointer;
  transition:transform 120ms var(--ease-out-strong), background-color 120ms ease}
.mpick b{color:var(--ink-3); font-weight:700; margin-right:4px}
.mpick:active{transform:scale(.96)}
.mpick.custom{background:var(--accent-soft); color:var(--accent)}
.mpick.custom b{color:var(--accent)}
.mpick.off{background:transparent; border:1.5px dashed var(--axis); color:var(--ink-3)}
.mpick.off b{color:var(--ink-3)}
.lowk{display:inline-block; font-size:11px; color:var(--serious); font-weight:700; margin-left:2px}
.mk-list{display:flex; flex-wrap:wrap; gap:7px}
.mk-item{background:var(--grid); border-radius:11px; padding:8px 12px; font-size:13px; font-weight:600}
@media (hover:hover){ .mpick:hover{filter:brightness(.97)} }
/* 바텀시트 피커 */
/* 온보딩 — 첫 실행 사용법 슬라이드(가로 스와이프) */
.ob{position:fixed; inset:0; z-index:150; background:var(--page); display:flex; flex-direction:column; animation:fadeIn 200ms ease}
.ob-top{flex:0 0 auto; display:flex; justify-content:flex-end; padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.ob-skip{border:0; background:transparent; color:var(--ink-3); font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer; padding:8px 10px; border-radius:10px}
.ob-track{flex:1 1 auto; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; scrollbar-width:none}
.ob-track::-webkit-scrollbar{display:none}
.ob-slide{flex:0 0 100%; width:100%; scroll-snap-align:center; scroll-snap-stop:always; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:14px 28px 6px; overflow-y:auto; -webkit-overflow-scrolling:touch}
.ob-art{flex:0 0 auto; width:96px; height:96px; border-radius:28px; background:var(--surface-1); box-shadow:0 10px 30px rgba(15,25,40,.10);
  display:flex; align-items:center; justify-content:center; font-size:48px; line-height:1; margin-bottom:20px}
.ob-step{font-size:11.5px; font-weight:800; letter-spacing:.6px; color:var(--accent); margin-bottom:8px}
.ob-t{font-size:21.5px; font-weight:800; letter-spacing:-.5px; line-height:1.38; color:var(--ink-1); word-break:keep-all}
.ob-d{margin-top:13px; font-size:14px; line-height:1.72; color:var(--ink-2); max-width:340px; word-break:keep-all}
.ob-d b{color:var(--ink-1); font-weight:700}
.ob-bot{flex:0 0 auto; padding:4px 24px calc(26px + env(safe-area-inset-bottom)); max-width:420px; width:100%; margin:0 auto; box-sizing:border-box}
.ob-hint{height:17px; margin-bottom:10px; text-align:center; font-size:12.5px; color:var(--ink-3);
  opacity:0; transition:opacity 280ms ease; pointer-events:none; user-select:none}
.ob-hint.on{opacity:1}
.ob-hint b{display:inline-block; font-weight:700; animation:obNudge 1.5s ease-in-out infinite}
@keyframes obNudge{0%,100%{transform:none} 50%{transform:translateX(-5px)}}
.ob-dots{display:flex; gap:7px; justify-content:center; margin-bottom:20px}
.ob-dot{position:relative; width:7px; height:7px; padding:0; border:0; border-radius:50%; background:var(--axis);
  cursor:pointer; -webkit-appearance:none; appearance:none; transition:width 220ms var(--ease-out-strong), background 220ms ease}
.ob-dot::after{content:""; position:absolute; inset:-12px -6px}   /* 손가락 탭 영역 확보 */
.ob-dot.on{width:22px; background:var(--accent)}
.ob-cta{width:100%; padding:15px 0; font-size:15.5px}
@media (prefers-reduced-motion:reduce){ .ob{animation:none} .ob-dot{transition:none} .ob-hint b{animation:none} }
.sheet-back{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:60; animation:fadeIn 140ms ease}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:61;
  background:linear-gradient(var(--glass-tint),var(--glass-tint)), var(--glass-strong);
  -webkit-backdrop-filter:saturate(var(--glass-sat)) blur(24px); backdrop-filter:saturate(var(--glass-sat)) blur(24px);
  border-radius:28px 28px 0 0; padding:8px 18px calc(20px + env(safe-area-inset-bottom)); max-height:82vh; overflow-y:auto;
  max-width:760px; margin:0 auto; animation:sheetUp 260ms var(--ease-out-strong);
  box-shadow:0 -12px 40px rgba(0,0,0,.16), inset 0 1px 0 var(--rim-hi)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* blur ramp — 모프가 가장 바쁜 첫 프레임엔 흐림을 0으로 두고 차오르게 한다(라이브러리 GlassPopover 기법) */
@keyframes sheetUp{
  from{transform:translateY(100%); -webkit-backdrop-filter:saturate(var(--glass-sat)) blur(0px); backdrop-filter:saturate(var(--glass-sat)) blur(0px)}
  to{transform:none; -webkit-backdrop-filter:saturate(var(--glass-sat)) blur(24px); backdrop-filter:saturate(var(--glass-sat)) blur(24px)}}
.sheet-grip{width:40px; height:4.5px; border-radius:3px; background:var(--axis); margin:6px auto 8px}
.sheet-h{display:flex; align-items:center; justify-content:space-between; padding:2px 0 10px; font-size:17px; font-weight:800; letter-spacing:-.3px}
.sheet-x{border:0; background:var(--grid); font-size:15px; color:var(--ink-2); cursor:pointer; padding:0; min-width:44px; border-radius:10px}
.sheet-list{display:flex; flex-direction:column; gap:8px}
.opt{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left;
  border:1.5px solid var(--grid); background:var(--surface-1); color:var(--ink-1); border-radius:var(--r-md);
  padding:14px 16px; font-family:inherit; cursor:pointer;
  transition:transform var(--dur) var(--ease-spring), border-color 120ms ease, background-color 120ms ease}
.opt .opt-nm{font-size:14.5px; font-weight:700}
.opt .opt-meta{font-size:11.5px; color:var(--ink-3); font-weight:500}
.opt:active{transform:scale(.985)}
.opt.cur{border-color:var(--accent); background:var(--accent-soft)}
.opt.cur .opt-nm{color:var(--accent)}
.opt.auto{margin-bottom:6px; border-style:dashed}
.opt.off{opacity:.45; background:var(--grid); border-style:dashed; cursor:default; pointer-events:none}
.opt.off .opt-meta{color:var(--serious)}
.opt-row{display:flex; align-items:stretch; gap:7px}
.opt-row .opt{flex:1}
.fav-btn{flex:0 0 auto; width:44px; min-height:44px; border:1.5px solid var(--grid); background:var(--surface-1); color:var(--ink-3);
  border-radius:14px; font-size:18px; cursor:pointer; transition:transform 120ms var(--ease-out-strong)}
.fav-btn.on{color:#ffb020; border-color:#ffb020; background:var(--warn-bg)}
.fav-btn:active{transform:scale(.9)}
.pick-search{width:100%; border:1.5px solid transparent; background:var(--grid); color:var(--ink-1);
  border-radius:var(--r-md); padding:12px 16px; font-size:16px; font-family:inherit; margin-bottom:4px}
.pick-search:focus{outline:none; border-color:var(--accent); background:var(--surface-1)}
@media (hover:hover){ .opt:not(.off):not(.cur):hover{border-color:var(--axis)} }
.sched-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.sched{width:100%; border-collapse:separate; border-spacing:5px; min-width:330px; table-layout:fixed}
table.sched th:first-child, table.sched td.sday{width:46px}
table.sched th{padding:0}
.sc-th{width:100%; min-height:44px; border:0; background:none; color:var(--ink-2); font-size:12px; font-weight:700; cursor:pointer; padding:2px}
.sc-th .sn{font-size:10px; color:var(--ink-3); font-weight:500; font-variant-numeric:tabular-nums}
td.sday{font-size:12.5px; font-weight:700; color:var(--ink-2); white-space:nowrap; text-align:center; width:34px}
td.sday .sn{font-size:9.5px; color:var(--ink-3); font-weight:500; font-variant-numeric:tabular-nums}
.scell{width:100%; min-height:46px; border:0; background:var(--grid); border-radius:var(--r-sm);
  cursor:pointer; padding:4px 3px; color:var(--ink-3); display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  transition:transform var(--dur) var(--ease-spring), background-color var(--dur-fast) ease}
.scell:active{transform:scale(.93)}
.scell.on{background:var(--accent-soft); color:var(--accent-text)}
.sc-name{font-size:10.5px; font-weight:700; line-height:1.15; text-align:center;
  word-break:keep-all; max-width:100%}
.sc-plus{font-size:17px; font-weight:400; color:var(--ink-3)}
table.plan.wk td{vertical-align:top}

let UNDO=null;
function toastEl(){
  let t=document.getElementById("toast-el");
  if(!t){ t=document.createElement("div"); t.id="toast-el";
    t.setAttribute("style","position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;background:rgba(20,22,26,.93);color:#fff;padding:10px 12px 10px 16px;border-radius:9999px;font-size:13.5px;font-weight:600;width:max-content;max-width:88vw;text-align:center;opacity:0;transition:opacity 180ms ease;display:flex;align-items:center;gap:10px;backdrop-filter:saturate(120%) blur(14px);-webkit-backdrop-filter:saturate(120%) blur(14px);box-shadow:0 1px 2px rgba(0,0,0,.18),0 12px 28px rgba(0,0,0,.28)");

function hideToast(){ try{ const t=document.getElementById("toast-el"); if(t){ clearTimeout(t._h); t.style.opacity="0"; } }catch(e){} }
function toast(msg, undoFn){
  try{
    const t=toastEl();
    if(typeof undoFn==="function"){
      UNDO={fn:undoFn};
      t.innerHTML='<span style="flex:1;text-align:left">'+escH(msg)+'</span>'+

}

인지)","tags":["anju","quick"],"kcal":280,"pro":25,"min":5,"lv":1,"serv":1,"ing":"프로틴파우더 30g, 계란 1개, 베이킹파우더 1/2작은술, 우유 30ml","steps":["머그컵에 재료를 다 넣고 섞는다.","전자레인지 90초.","꿀이나 요거트와 함께."],"tip":"운동인의 5분 간식.","use":{"oats":30,"eggs":1,"milk":30}},{"id":"r_snack_13","cat":"snack","name":"먹태구이","tags":["kr","anju","quick"],"kcal":320,"pro":45,"min":10,"lv":1,"serv":1,"ing":"먹태 1마리, 버터, 청양마요(마요+청양고추+간장)","steps":["먹태를 살짝 물에 적셔 부드럽게 한다.","버터 팬(또는 에어프라이어 180도 5분)에 굽는다.","찢어서 청양마요에 찍는다."],"tip":"맥주 안주의 왕. 과식 주의.","use":{"squid":1}},{"id":"r_snack_14","cat":"snack","name":"고구마맛탕","tags":["sweet"],"kcal":450,"pro":3,"min":20,"lv":2,"serv":1,"ing":"고구마 2개, 설탕 3큰술, 식용유, 검은깨","steps":["고구마를 한입 크기로 썰어 튀기듯 굽는다(10분).","다른 팬에 기름 1큰술+설탕을 약불로 녹인다(젓지 않기).","시럽이 녹으면 고구마를 넣고 재빨리 버무린다."],"tip":"설탕을 저으면 결정이 생겨 실패한다.","use":{"sweet":2}},{"id":"r_snack_15","cat":"snack","name":"라면땅","tags":["bunsik","quick"],"kcal":350,"pro":6,"min":10,"lv":1,"serv":1,"ing":"라면 1개, 설탕 2큰술, 버터 1조각","steps":["라면을 잘게 부숴 기름 없이 볶는다.","버터·설탕을 넣고 약불에 버무린다.","식히면 바삭해진다."],"tip":"추억의 과자. 아이들 간식으로도.","use":{"ramyeon":1}},{"id":"r_snack_n1","cat":"snack","name":"어묵치즈말이","tags":["anju","bunsik"],"kcal":380,"pro":23,"min":15,"lv":1,"serv":2,"ing":"사각어묵 4장(200g), 슬라이스햄 80g, 모짜렐라 슈레드 60g, 식용유, 케첩","steps":["사각어묵에 뜨거운 물을 끼얹어 겉기름을 씻어내고 키친타월로 물기를 닦는다.","어묵 한 장에 슬라이스햄과 모짜렐라를 올려 김밥처럼 만 뒤 이쑤시개로 이음매를 고정한다.","약불로 달군 팬에 기름을 얇게 두르고 이음매가 아래로 가게 올려 2분 굽는다.","굴려 가며 4분 더 구워 겉이 노릇해지고 치즈가 녹으면 불을 끄고 케첩을 곁들인다."],"tip":"센 불에 구우면 치즈가 옆으로 새어 나오니 약불에서 천천히 굴린다.","use":{"fishcake":4,"ham":80,"cheese":60}},{"id":"r_snack_n2","cat":"snack","name":"감자베이컨구이","tags":["anju","west"],"kcal":260,"pro":8,"min":20,"lv":1,"serv":2,"ing":"감자 2개(300g), 베이컨 60g, 마늘 4쪽, 소금, 후추","steps":["감자는 껍질째 씻어 1.5cm 크기로 썰고 전자레인지에 5분 돌려 반쯤 익힌다.","베이컨은 2cm 폭으로 썰고 마늘은 편으로 썬다.","기름을 두르지 않은 팬에 베이컨을 먼저 볶아 기름을 낸 뒤 마늘을 넣어 향을 낸다.","감자를 넣고 중불에서 7분간 굴려 가며 구운 다음 소금과 후추로 간한다."],"tip":"감자를 전자레인지로 미리 익혀 두어야 겉만 타고 속이 설익는 일이 없다.","use":{"potato":2,"bacon":60,"arom":4}},{"id":"r_snack_n3","cat":"snack","name":"런천미트구이","tags":["anju","kr"],"kcal":470,"pro":20,"min":10,"lv":1,"serv":1,"ing":"런천미트 150g, 대파 1/2대, 청양고추 1개, 간장 1작은술, 참기름 1작은술, 후추","steps":["런천미트는 8mm 두께로 썰어 키친타월로 겉면의 기름을 닦아낸다.","대파는 얇게 채 썰어 찬물에 3분 담갔다가 물기를 털고, 청양고추는 잘게 썬다.","기름을 두르지 않은 팬에 런천미트를 올려 중불에서 앞뒤로 2분씩 노릇하게 굽는다.","접시에 담아 파채를 올리고 간장·참기름·청양고추·후추를 섞은 소스를 곁들인다."],"tip":"캔에서 배어 나오는 기름만으로 충분하니 팬에 기름을 따로 두르지 않는다.","use":{"spam":150,"arom":1}},{"id":"r_snack_n4","cat":"snack","name":"양념두부구이","tags":["anju","kr"],"kcal":180,"pro":13,"min":15,"lv":1,"serv":1,"ing":"두부(부침용) 150g, 대파 1/3대, 청양고추 1개, 간장 1큰술, 고춧가루 1작은술, 참기름, 식용유","steps":["두부는 1.5cm 두께로 썰어 키친타월로 물기를 꼼꼼히 닦고 소금을 살짝 뿌린다.","대파와 청양고추를 잘게 썰어 간장, 고춧가루, 참기름, 물 1큰술과 섞어 양념장을 만든다.","달군 팬에 기름을 두르고 두부를 중불에서 앞뒤로 3분씩 구워 겉면을 단단하게 만든다.","불을 끄고 구운 두부 위에 양념장을 한 숟갈씩 얹는다."],"tip":"물기를 덜 닦으면 기름이 튀고 겉면이 눅눅해진다.","use":{"tofu":150,"arom":1}},{"id":"r_snack_n5","cat":"snack","name":"명란감자구이","tags":["anju"],"kcal":260,"pro":14,"min":20,"lv":2,"serv":2,"ing":"감자 2개(300g), 명란 60g, 모짜렐라 슈레드 40g, 마요네즈 1큰술, 후추","steps":["감자는 껍질을 벗겨 2cm로 썰어 전자레인지에 6분 돌린 뒤 포크로 굵게 으깬다.","명란은 껍질을 갈라 알만 발라내고 그중 절반을 마요네즈와 섞는다.","으깬 감자에 명란마요를 넣어 고루 섞고 내열 그릇에 평평하게 담는다.","남은 명란과 모짜렐라를 올려 에어프라이어 200도에서 6분 굽는다.","치즈가 녹아 노릇해지면 꺼내 후추를 뿌린다."],"tip":"명란은 짠맛이 강하니 간을 따로 하지 않고 감자의 양으로 조절한다.","use":{"potato":2,"roe":60,"cheese":40}},{"id":"r_snack_n6","cat":"snack","name":"베이컨떡말이","tags":["anju","bunsik"],"kcal":390,"pro":11,"min":15,"lv":1,"serv":2,"ing":"떡볶이떡 200g, 베이컨 90g, 간장 1큰술, 꿀 1작은술, 후추","steps":["떡볶이떡이 딱딱하면 따뜻한 물에 5분 담갔다가 물기를 뺀다.","베이컨을 반으로 잘라 떡을 하나씩 감고 끝부분이 아래로 가게 둔다.","기름 없이 달군 팬에 이음매가 바닥에 닿게 올려 중불에서 굴려 가며 6분 굽는다.","간장과 꿀을 섞어 두르고 30초간 조려 윤기를 낸 뒤 후추를 뿌린다."],"tip":"베이컨에서 기름이 넉넉히 나오므로 팬에 기름을 두르지 않는다.","use":{"tteok":200,"bacon":90}},{"id":"r_snack_n7","cat":"snack","name":"김치치즈전","tags":["anju","kr"],"kcal":450,"pro":17,"min":20,"lv":1,"serv":2,"ing":"포기김치 200g, 모짜렐라 슈레드 60g, 계란 1개, 부침가루 100g, 물 100ml, 식용유","steps":["김치는 국물을 가볍게 짜내고 1cm 폭으로 썬다.","부침가루에 물과 계란을 넣어 풀고 썬 김치를 섞어 되직한 반죽을 만든다.","기름을 넉넉히 두른 팬에 반죽을 얇게 펴 중불에서 3분 굽는다.","뒤집어 모짜렐라를 고루 뿌리고 2분 더 구워 치즈가 녹으면 불을 끈다."],"tip":"반죽을 얇게 펴야 가장자리가 바삭하게 부서진다.","use":{"kimchi":200,"cheese":60,"eggs":1}},{"id":"r_snack_n8","cat":"snack","name":"소시지모둠구이","tags":["anju","west"],"kcal":420,"pro":18,"min":12,"lv":1,"serv":2,"ing":"비엔나 소시지 200g, 슬라이스햄 80g, 양파 1/2개, 홀그레인 머스터드 1큰술, 식용유, 후추","steps":["비엔나 소시지는 표면에 어슷한 칼집을 서너 번 넣고 슬라이스햄은 4등분한다.","양파는 1cm 두께로 굵게 채 썬다.","기름을 살짝 두른 팬에 소시지를 넣고 중불에서 4분 굴려 칼집이 벌어지게 굽는다.","햄과 양파를 넣어 3분 더 볶고 후추를 뿌린 뒤 머스터드를 곁들인다."],"tip":"칼집을 넣어야 속까지 데워지고 소스도 잘 묻는다.","use":{"sausage":200,"ham":80,"arom":1}},{"id":"r_sea_n1","cat":"sea","name":"오징어마늘버터구이","tags":["anju"],"kcal":190,"pro":26,"min":20,"lv":1,"serv":2,"ing":"냉동 오징어 300g, 마늘 6쪽, 양파 1/2개, 버터 15g, 간장 1큰술, 후추","steps":["냉동 오징어는 찬물에 10분 담가 해동한 뒤 물기를 닦고 1.5cm 폭으로 썬다.","마늘은 편으로 썰고 양파는 굵게 채 썬다.","센 불로 달군 팬에 버터를 녹여 마늘을 볶아 향을 낸 다음 양파를 넣어 1분 볶는다.","오징어를 넣고 센 불에서 3분 볶다가 간장을 팬 가장자리에 둘러 섞고 후추를 뿌린다."],"tip":"오징어는 오래 익힐수록 질겨지니 3분을 넘기지 않는다.","use":{"squid":300,"arom":6}},{"id":"r_sea_n2","cat":"sea","name":"바지락콩나물찜","tags":["anju","kr"],"kcal":110,"pro":12,"min":15,"lv":1,"serv":2,"ing":"해감 바지락 500g, 콩나물 200g, 대파 1/2대, 청양고추 1개, 다진마늘 1작은술, 소금","steps":["해감한 바지락은 껍데기를 서로 비벼 씻고 콩나물은 흐르는 물에 헹군다.","냄비 바닥에 콩나물을 깔고 바지락을 올린 뒤 물 100ml와 다진마늘을 넣는다.","뚜껑을 덮고 센 불에서 7분간 익혀 바지락 입이 벌어지면 뚜껑을 연다.","대파와 청양고추를 넣어 1분 더 끓이고 소금으로 간을 맞춘다."],"tip":"익는 동안 뚜껑을 자주 열면 콩나물에서 비린내가 남는다.","use":{"clam":500,"beansprout":200,"arom":1}},{"id":"r_sea_n3","cat":"sea","name":"문어마늘볶음","tags":["anju"],"kcal":145,"pro":20,"min":12,"lv":1,"serv":1,"ing":"자숙 문어 120g, 마늘 6쪽, 대파 1/3대, 버터 8g, 간장 1작은술, 후추","steps":["자숙 문어는 물에 한 번 헹궈 1cm 두께로 어슷하게 썬다.","마늘은 편으로 썰고 대파는 어슷하게 썬다.","달군 팬에 버터를 녹이고 마늘을 중약불에서 2분 볶아 가장자리가 노릇해지게 한다.","문어와 대파를 넣어 센 불에서 2분 볶고 간장을 팬 가장자리에 둘러 후추를 뿌린다."],"tip":"자숙 문어는 이미 익어 있으니 데우는 정도로만 짧게 볶는다.","use":{"octopus":120,"arom":6}},{"id":"r_sea_n4","cat":"sea","name":"전복고추장볶음","tags":["anju","kr"],"kcal":185,"pro":16,"min":15,"lv":2,"serv":1,"ing":"손질 전복 2마리(100g), 양파 1/4개, 대파 1/3대, 고추장 1큰술, 고춧가루 1작은술, 설탕 1작은술, 식용유","steps":["손질한 전복은 살에 격자로 얕은 칼집을 넣고 반으로 썬다.","고추장, 고춧가루, 설탕, 간장 1작은술을 물 2큰술에 풀어 양념을 만든다.","기름을 두른 팬에 양파를 2분 볶은 뒤 전복을 넣어 센 불에서 2분 볶는다.","양념을 붓고 3분간 볶다가 대파를 넣고 불을 끈다."],"tip":"양념이 눌어붙으면 물을 1큰술씩 더해 가며 볶는다.","use":{"abalone":2,"arom":1}},{"id":"r_meat_n1","cat":"meat","name":"삼겹살숙주볶음","tags":["anju","kr"],"kcal":540,"pro":25,"min":15,"lv":1,"serv":2,"ing":"삼겹살 300g, 숙주 200g, 대파 1대, 다진마늘 1작은술, 간장 1큰술, 후추","steps":["삼겹살은 3cm 폭으로 썰고 숙주는 물에 헹궈 체에 밭쳐 둔다.","달군 팬에 삼겹살을 기름 없이 올려 중강불에서 5분간 노릇하게 굽는다.","나온 기름을 2큰술만 남기고 덜어낸 뒤 다진마늘과 대파를 넣어 30초 볶는다.","숙주를 넣고 센 불에서 2분만 볶다가 간장과 후추로 간한다."],"tip":"숙주는 오래 볶으면 물이 생기니 마지막에 넣고 짧게 볶는다.","use":{"porkbelly":300,"beansprout":200,"arom":1}},{"id":"r_meat_n2","cat":"meat","name":"차돌박이양파구이","tags":["anju","kr"],"kcal":470,"pro":20,"min":12,"lv":1,"serv":2,"ing":"차돌박이 250g, 양파 1개, 대파 1/2대, 간장 1작은술, 참기름 1작은술, 소금, 후추","steps":["양파는 1cm 두께로 둥글게 썰고 대파는 어슷하게 썬다.","팬을 충분히 달군 뒤 양파를 깔고 그 위에 차돌박이를 한 겹으로 편다.","센 불에서 1분 굽고 뒤집어 30초 더 구워 붉은 기가 사라지면 소금과 후추를 뿌린다.","대파를 올리고 간장과 참기름을 둘러 가볍게 섞은 뒤 불을 끈다."],"tip":"차돌박이를 겹쳐 올리면 물이 생기니 한 겹씩 나눠 굽는다.","use":{"chadol":250,"arom":1}},{"id":"r_meat_n3","cat":"meat","name":"닭꼬치구이","tags":["anju","kr"],"kcal":370,"pro":27,"min":20,"lv":2,"serv":2,"ing":"냉동 닭다리살 300g, 대파 1대, 간장 2큰술, 설탕 1큰술, 미림 1큰술, 식용유","steps":["냉동 닭다리살은 찬물에 담가 해동하고 물기를 닦은 뒤 3cm 크기로 썬다.","대파는 3cm 길이로 잘라 닭고기와 번갈아 꼬치에 꿴다.","작은 냄비에 간장, 설탕, 미림을 넣고 중불에서 2분 졸여 양념을 만든다.","기름을 두른 팬에 꼬치를 올려 중불에서 앞뒤로 4분씩 굽는다.","양념을 두 번에 나눠 발라 가며 2분 더 구워 윤기를 낸다."],"tip":"양념을 처음부터 바르면 설탕이 타니 고기가 익은 뒤에 바른다.","use":{"thigh":300,"arom":1}},{"id":"r_side_n1","cat":"side","name":"멸치견과볶음","tags":["anju","kr"],"kcal":275,"pro":22,"min":10,"lv":1,"serv":2,"ing":"잔멸치 60g, 견과류 믹스 40g, 간장 1작은술, 설탕 1작은술, 식용유, 참기름","steps":["잔멸치는 체에 쳐 부스러기를 털어내고 마른 팬에 2분 볶아 비린내를 날린다.","견과류는 알이 굵은 것만 반으로 잘라 크기를 비슷하게 맞춘다.","팬에 기름을 두르고 간장과 설탕을 넣어 끓어오르면 멸치를 넣어 30초 볶는다.","불을 끄고 견과류와 참기름을 넣어 재빨리 섞는다."],"tip":"양념이 끓으면 불을 약하게 줄여야 멸치가 딱딱하게 굳지 않는다.","use":{"anchovy":60,"nuts":40}},{"id":"r_side_n2","cat":"side","name":"햄감자볶음","tags":["anju","kr"],"kcal":285,"pro":10,"min":15,"lv":1,"serv":2,"ing":"감자 2개(300g), 슬라이스햄 100g, 양파 1/2개, 소금, 후추, 식용유","steps":["감자는 껍질을 벗겨 5mm 굵기로 채 썰고 찬물에 3분 담가 전분기를 뺀다.","슬라이스햄과 양파도 감자와 비슷한 굵기로 채 썬다.","기름을 두른 팬에 물기를 뺀 감자를 넣고 중불에서 6분간 볶아 반투명해지게 익힌다.","햄과 양파를 넣어 3분 더 볶고 소금과 후추로 간한다."],"tip":"전분기를 빼야 볶는 동안 감자끼리 들러붙지 않는다.","use":{"potato":2,"ham":100,"arom":1}},{"id":"r_side_n3","cat":"side","name":"어묵고추장조림","tags":["anju","kr"],"kcal":195,"pro":9,"min":12,"lv":1,"serv":1,"ing":"사각어묵 2장(100g), 양파 1/4개, 대파 1/3대, 고추장 1큰술, 고춧가루 1작은술, 설탕 1작은술, 식용유","steps":["사각어묵은 끓는 물에 30초 데쳐 기름기를 빼고 1.5cm 폭으로 썬다.","고추장, 고춧가루, 설탕, 간장 1작은술을 물 4큰술에 풀어 양념을 만든다.","기름을 두른 팬에 양파를 2분 볶다가 어묵을 넣어 1분 더 볶는다.","양념을 붓고 중불에서 4분간 국물이 반으로 줄 때까지 조린 뒤 대파를 넣는다."],"tip":"어묵을 데쳐야 겉기름이 빠져 양념이 겉돌지 않는다.","use":{"fishcake":2,"arom":1}},{"id":"r_side_n4","cat":"side","name":"마늘종새우볶음","tags":["anju","kr"],"kcal":165,"pro":16,"min":12,"lv":1,"serv":2,"ing":"마늘종 150g, 냉동 생새우살 150g, 마늘 3쪽, 간장 1큰술, 참기름, 식용유","steps":["냉동 생새우살은 찬물에 5분 담가 해동한 뒤 체에 밭쳐 물기를 뺀다.","마늘종은 4cm 길이로 자르고 끓는 물에 30초 데쳐 찬물에 헹군다.","기름을 두른 팬에 편 썬 마늘을 볶아 향을 낸 뒤 새우를 넣어 2분 볶는다.","마늘종을 넣고 센 불에서 2분 볶다가 간장과 참기름을 둘러 마무리한다."],"tip":"마늘종을 미리 데쳐 두면 짧게 볶아도 질기지 않다.","use":{"shrimp":150,"arom":3}},{"id":"r_noodle_n1","cat":"noodle","name":"간장계란국수","tags":["bunsik","quick"],"kcal":470,"pro":16,"min":12,"lv":1,"serv":1,"ing":"소면 100g, 계란(대란) 1개, 대파 10cm, 간장 2큰술, 설탕 1작은술, 참기름 1큰술, 통깨","steps":["대파는 잘게 썰어 간장 2큰술, 설탕 1작은술, 참기름 1큰술, 통깨와 섞어 양념장을 만든다.","끓는 물에 소면을 넣고 3분간 삶다가 물이 넘치려 하면 찬물 반 컵을 부어 가라앉힌다.","삶은 면을 찬물에 두세 번 헹궈 전분기를 씻어내고 물기를 꽉 짠다.","달군 팬에 기름을 두르고 계란을 반숙 프라이로 부친다.","면에 양념장을 넣고 고루 비빈 뒤 계란프라이를 올린다."],"tip":"면을 찬물에 확실히 헹궈야 양념장이 겉돌지 않고 잘 배어든다.","use":{"somen":100,"eggs":1,"arom":10}},{"id":"r_noodle_n2","cat":"noodle","name":"김치말이국수","tags":["bunsik","quick"],"kcal":470,"pro":17,"min":15,"lv":1,"serv":1,"ing":"소면 100g, 포기김치 80g, 계란(대란) 1개, 오이 1/3개, 김치국물 4큰술, 설탕 1작은술, 식초 1큰술, 찬물 300ml","steps":["김치는 속을 털어내고 잘게 썰고, 오이는 가늘게 채 썬다.","찬물 300ml에 김치국물 4큰술, 설탕 1작은술, 식초 1큰술을 풀어 냉동실에 10분 두어 살얼음이 지게 한다.","계란은 끓는 물에 10분 삶아 찬물에 식힌 뒤 반으로 자른다.","소면을 3분간 삶아 찬물에 헹구고 물기를 짠 뒤 그릇에 담는다.","차게 식힌 국물을 붓고 김치, 오이, 삶은 계란을 올린다."],"tip":"국물이 밍밍하면 김치국물을 한 큰술씩만 더한다. 한 번에 부으면 짜서 되돌릴 수 없다.","use":{"somen":100,"kimchi":80,"eggs":1,"veg":1}},{"id":"r_noodle_n3","cat":"noodle","name":"어묵국수","tags":["bunsik"],"kcal":460,"pro":17,"min":15,"lv":1,"serv":1,"ing":"소면 100g, 사각어묵 2장, 대파 15cm, 물 600ml, 국간장 1큰술, 다진마늘 1작은술, 소금, 후추","steps":["사각어묵은 끓는 물에 살짝 데쳐 기름기를 뺀 뒤 1cm 폭으로 길게 썬다.","냄비에 물 600ml와 어묵을 넣고 5분간 끓여 어묵 국물을 낸다.","국간장 1큰술과 다진마늘 1작은술을 넣고 소금으로 간을 맞춘 뒤 대파를 썰어 넣는다.","다른 냄비에 소면을 3분간 삶아 찬물에 헹구고 물기를 뺀다.","그릇에 면을 담고 뜨거운 어묵 국물을 부은 뒤 후추를 뿌린다."],"tip":"어묵을 데쳐야 국물이 느끼해지지 않고 맑게 나온다.","use":{"somen":100,"fishcake":2,"arom":15}},{"id":"r_noodle_n4","cat":"noodle","name":"떡라면","tags":["bunsik","quick"],"kcal":780,"pro":19,"min":10,"lv":1,"serv":1,"ing":"라면 1봉, 떡볶이떡 100g, 계란(대란) 1개, 대파 10cm, 물 550ml","steps":["떡볶이떡이 딱딱하면 따뜻한 물에 5분 담가 둔다.","냄비에 물 550ml를 붓고 끓기 시작하면 떡과 스프를 먼저 넣어 2분 끓인다.","면을 넣고 3분간 끓이다가 어슷 썬 대파를 넣는다.","불을 끄기 30초 전 계란을 깨 넣고 젓지 않은 채 그대로 익힌다."],"tip":"떡을 면보다 먼저 넣어야 속까지 말랑해지고 면은 불지 않는다.","use":{"ramyeon":1,"tteok":100,"eggs":1,"arom":10}},{"id":"r_noodle_n5","cat":"noodle","name":"만두라면","tags":["bunsik","quick"],"kcal":730,"pro":17,"min":12,"lv":1,"serv":1,"ing":"라면 1봉, 냉동 교자만두 4개, 대파 10cm, 물 550ml, 고춧가루 1작은술","steps":["냄비에 물 550ml를 붓고 끓으면 스프와 냉동 교자만두를 넣어 3분간 끓인다.","만두가 떠오르면 면을 넣고 3분 더 끓인다.","어슷 썬 대파와 고춧가루 1작은술을 넣고 30초만 더 끓여 불을 끈다."],"tip":"만두는 해동하지 말고 언 채로 넣어야 끓는 동안 터지지 않는다.","use":{"ramyeon":1,"dumpling":4,"arom":10}},{"id":"r_noodle_n6","cat":"noodle","name":"당면어묵볶음","tags":["bunsik"],"kcal":560,"pro":10,"min":20,"lv":1,"serv":1,"ing":"당면 80g, 사각어묵 2장, 양파 1/2개, 양배추 100g, 깻잎 4장, 간장 2큰술, 설탕 1큰술, 고춧가루 1작은술, 식용유 1큰술","steps":["당면은 따뜻한 물에 15분 불렸다가 체에 밭쳐 물기를 뺀다.","사각어묵은 1cm 폭으로, 양파와 양배추는 굵게 채 썰고 깻잎은 큼직하게 썬다.","달군 팬에 기름을 두르고 어묵, 양파, 양배추를 센 불에 3분 볶는다.","불린 당면과 간장 2큰술, 설탕 1큰술, 고춧가루 1작은술, 물 4큰술을 넣고 국물이 거의 없어질 때까지 3분 볶는다.","불을 끄고 깻잎을 넣어 남은 열로만 숨을 죽인다."],"tip":"당면을 삶지 말고 불려서 볶아야 양념을 머금으면서 끊어지지 않는다.","use":{"dangmyeon":80,"fishcake":2,"arom":1,"veg":104}},{"id":"r_snack_n9","cat":"snack","name":"로제떡볶이","tags":["bunsik"],"kcal":630,"pro":16,"min":15,"lv":1,"serv":1,"ing":"떡볶이떡 200g, 사각어묵 1장, 우유 150ml, 물 100ml, 고추장 1큰술, 고춧가루 1작은술, 설탕 1큰술, 간장 1작은술, 대파 10cm","steps":["떡은 따뜻한 물에 5분 담가 두고 어묵은 한입 크기로 썬다.","팬에 물 100ml, 고추장 1큰술, 고춧가루 1작은술, 설탕 1큰술, 간장 1작은술을 넣고 끓인다.","떡과 어묵을 넣고 중불에서 4분간 저어가며 끓인다.","우유 150ml를 붓고 약불로 낮춰 3분간 졸여 소스가 걸쭉해지면 대파를 넣고 불을 끈다."],"tip":"우유는 마지막에 약불로 넣는다. 센 불에서 넣으면 분리되어 지저분해진다.","use":{"tteok":200,"fishcake":1,"milk":150,"arom":10}},{"id":"r_snack_n10","cat":"snack","name":"소시지핫도그","tags":["bunsik","anju"],"kcal":530,"pro":14,"min":15,"lv":2,"serv":1,"ing":"비엔나 소시지 5개, 계란(대란) 1개, 밀가루 60g, 우유 40ml, 설탕 1작은술, 베이킹파우더 1/2작은술, 빵가루 30g, 튀김용 기름, 케첩","steps":["밀가루 60g, 계란 1개, 우유 40ml, 설탕 1작은술, 베이킹파우더 1/2작은술을 되직하게 섞어 반죽을 만든다.","비엔나 소시지를 꼬치에 꿴 뒤 키친타월로 겉을 닦아 물기를 없앤다.","꼬치에 반죽을 두껍게 입히고 빵가루를 굴려 묻힌다.","170도로 달군 기름에 넣어 굴려가며 3분간 노릇하게 튀긴다.","기름을 털어내고 케첩을 뿌린다."],"tip":"소시지 겉이 젖어 있으면 반죽이 흘러내린다. 반드시 물기를 닦고 입힌다.","use":{"sausage":5,"eggs":1,"milk":40}},{"id":"r_snack_n11","cat":"snack","name":"햄계란토스트","tags":["bunsik","quick"],"kcal":530,"pro":22,"min":10,"lv":1,"serv":1,"ing":"식빵 2장, 슬라이스햄 2장, 계란(대란) 1개, 양파 1/4개, 양배추 80g, 버터 1큰술, 설탕 1작은술, 케첩, 소금","steps":["양배추와 양파는 가늘게 채 썰어 계란 1개, 소금 한 꼬집과 함께 섞는다.","팬에 버터를 반만 녹이고 식빵 두 장을 앞뒤로 노릇하게 굽는다.","같은 팬에 남은 버터를 두르고 계란채소물을 식빵 크기로 펼쳐 중약불에서 앞뒤로 2분씩 부친다.","슬라이스햄도 팬에 30초씩 구워 가장자리를 익힌다.","구운 식빵에 계란지단, 햄을 올리고 설탕 1작은술과 케첩을 뿌린 뒤 나머지 식빵을 덮는다."],"tip":"설탕을 아주 조금 뿌려야 케첩의 신맛이 눌리고 익숙한 그 맛이 난다.","use":{"bread":2,"ham":2,"eggs":1,"arom":1,"veg":80}},{"id":"r_snack_n12","cat":"snack","name":"감자고로케","tags":["bunsik"],"kcal":520,"pro":12,"min":30,"lv":2,"serv":1,"ing":"감자 2개(300g), 양파 1/4개, 계란(대란) 1개, 밀가루 3큰술, 빵가루 40g, 소금, 후추, 튀김용 기름","steps":["감자는 껍질을 벗겨 큼직하게 썰고 끓는 물에 12분 삶아 젓가락이 쑥 들어가면 건진다.","물기를 날린 감자를 으깨고 잘게 다진 양파, 소금, 후추를 넣어 섞는다.","한 손에 잡히는 크기로 동글납작하게 빚는다.","밀가루, 푼 계란, 빵가루 순서로 옷을 입힌다.","170도 기름에 넣어 겉이 진한 갈색이 될 때까지 2분간 튀겨 기름을 뺀다."],"tip":"감자 물기가 남으면 튀길 때 터진다. 삶은 뒤 약불에 30초 두어 수분을 날린다.","use":{"potato":2,"arom":1,"eggs":1}},{"id":"r_snack_n13","cat":"snack","name":"런천미트전","tags":["bunsik","anju"],"kcal":570,"pro":20,"min":12,"lv":1,"serv":1,"ing":"런천미트 100g, 계란(대란) 1개, 부침가루 3큰술, 대파 10cm, 식용유 1큰술, 후추","steps":["런천미트를 7mm 두께로 썰어 키친타월로 겉의 기름을 닦는다.","계란 1개를 풀고 잘게 썬 대파와 후추를 섞는다.","런천미트에 부침가루를 얇게 묻히고 남는 가루는 털어낸다.","계란물을 입혀 중약불로 달군 팬에 올리고 한 면당 2분씩 노릇하게 부친다."],"tip":"센 불에서 부치면 계란옷만 타고 속은 차다. 중약불로 천천히 익힌다.","use":{"spam":100,"eggs":1,"arom":10}},{"id":"r_snack_n14","cat":"snack","name":"만두강정","tags":["bunsik","anju"],"kcal":470,"pro":13,"min":15,"lv":1,"serv":1,"ing":"냉동 교자만두 6개, 양파 1/4개, 케첩 2큰술, 고추장 1작은술, 물엿 1큰술, 간장 1작은술, 다진마늘 1작은술, 물 2큰술, 통깨","steps":["냉동 교자만두를 에어프라이어 190도에서 10분 돌려 겉을 바삭하게 굽는다.","그 사이 팬에 케첩 2큰술, 고추장 1작은술, 물엿 1큰술, 간장 1작은술, 다진마늘 1작은술, 물 2큰술을 넣고 약불에서 끓인다.","잘게 썬 양파를 넣고 소스가 보글보글 걸쭉해질 때까지 2분 졸인다.","불을 끄고 구운 만두를 넣어 재빨리 버무린 뒤 통깨를 뿌린다."],"tip":"소스는 불을 끄고 버무려야 만두 껍질이 눅눅해지지 않는다.","use":{"dumpling":6,"arom":1}},{"id":"r_rice_n1","cat":"rice","name":"계란말이김밥","tags":["bunsik","lunch"],"kcal":500,"pro":18,"min":20,"lv":1,"serv":1,"ing":"밥 1공기(쌀 100g), 계란(대란) 2개, 김밥김 1장, 단무지 2줄, 당근 1/4개, 참기름 1작은술, 소금","steps":["따뜻한 밥에 참기름 1작은술과 소금 한 꼬집을 넣어 가볍게 섞고 한 김 식힌다.","당근은 가늘게 채 썰어 기름 두른 팬에 1분 볶아 소금으로 간한다.","계란 2개를 소금 한 꼬집과 함께 풀어 약불 팬에 얇게 부으며 김 길이에 맞춰 계란말이를 만든다.","김 위에 밥을 2/3만 얇게 펴고 단무지, 당근, 길게 자른 계란말이를 올린다.","앞쪽부터 단단히 말아 5분 두었다가 칼에 참기름을 묻혀 썬다."],"tip":"밥은 뜨거울 때 말면 김이 눅눅해진다. 반드시 한 김 식혀서 만다.","use":{"rice":210,"eggs":2,"seaweed":1,"veg":1}},{"id":"r_rice_n2","cat":"rice","name":"참치김밥","tags":["bunsik","lunch"],"kcal":490,"pro":15,"min":20,"lv":1,"serv":1,"ing":"밥 1공기(쌀 100g), 참치캔(라이트) 1/2개, 김밥김 1장, 단무지 2줄, 양파 1/8개, 마요네즈 1큰술, 참기름 1작은술, 소금, 후추","steps":["참치캔은 체에 밭쳐 기름을 꾹 눌러 빼고 잘게 다진 양파, 마요네즈 1큰술, 후추와 섞는다.","따뜻한 밥에 참기름 1작은술과 소금 한 꼬집을 섞어 한 김 식힌다.","김 위에 밥을 2/3만 얇게 펴고 가운데에 참치마요를 길게 올린 뒤 단무지를 얹는다.","속이 흐트러지지 않게 손끝으로 누르며 단단히 말아 한 입 크기로 썬다."],"tip":"참치 기름을 확실히 빼야 밥이 질척해지지 않고 썰 때 모양이 유지된다.","use":{"rice":210,"tuna":1,"seaweed":1,"arom":1}},{"id":"r_rice_n3","cat":"rice","name":"김치주먹밥","tags":["bunsik","quick"],"kcal":390,"pro":7,"min":10,"lv":1,"serv":1,"ing":"밥 1공기(쌀 100g), 포기김치 60g, 김가루 3큰술, 참기름 1큰술, 설탕 1작은술, 통깨, 식용유 1작은술","steps":["포기김치는 속을 털고 잘게 다져 물기를 짠다.","팬에 기름을 두르고 김치와 설탕 1작은술을 넣어 2분 볶아 신맛을 날린다.","볼에 밥, 볶은 김치, 김가루 3큰술, 참기름 1큰술, 통깨를 넣고 주걱으로 자르듯 섞는다.","손에 물을 묻혀 한 입 크기로 동그랗게 뭉친다."],"tip":"김치를 한 번 볶으면 물이 나오지 않아 도시락에 담아도 뭉그러지지 않는다.","use":{"rice":210,"kimchi":60,"seaweed":45}},{"id":"r_rice_n4","cat":"rice","name":"돈까스덮밥","tags":["bunsik"],"kcal":820,"pro":33,"min":15,"lv":2,"serv":1,"ing":"냉동 돈가스 1장(120g), 계란(대란) 2개, 양파 1/2개, 대파 10cm, 밥 1공기(쌀 100g), 간장 2큰술, 설탕 1큰술, 물 150ml","steps":["냉동 돈가스를 에어프라이어 190도에서 10분 구워 한 입 크기로 썬다.","팬에 물 150ml, 간장 2큰술, 설탕 1큰술을 넣고 채 썬 양파를 올려 3분간 끓인다.","썰어 둔 돈가스를 국물 위에 펼쳐 올린다.","계란 2개를 살짝만 풀어 팬 전체에 두르고 뚜껑을 덮어 1분간 반숙으로 익힌다.","밥 위에 국물째 미끄러뜨려 올리고 대파를 뿌린다."],"tip":"계란은 완전히 풀지 말고 흰자 덩어리가 남게 저어야 층이 살아난다.","use":{"eggs":2,"arom":10,"rice":210}},{"id":"r_side_n5","cat":"side","name":"감자계란샐러드","tags":["bunsik"],"kcal":270,"pro":9,"min":20,"lv":1,"serv":2,"ing":"감자 2개(300g), 계란(대란) 2개, 양파 1/4개, 오이 1/3개, 마요네즈 2큰술, 설탕 1작은술, 소금, 후추","steps":["감자는 껍질을 벗겨 깍둑 썰고 계란과 함께 끓는 물에 12분 삶는다.","양파와 오이는 잘게 썰어 소금 한 꼬집에 5분 절였다가 물기를 꽉 짠다.","삶은 감자는 뜨거울 때 반쯤 으깨고 계란은 껍질을 까서 굵게 썬다.","모두 볼에 담고 마요네즈 2큰술, 설탕 1작은술, 소금, 후추를 넣어 가볍게 섞는다."],"tip":"오이와 양파의 물기를 짜지 않으면 다음 날 샐러드가 흥건해진다.","use":{"potato":2,"eggs":2,"arom":1,"veg":1}},{"id":"r_side_n6","cat":"side","name":"소시지케첩볶음","tags":["bunsik","lunch"],"kcal":430,"pro":14,"min":10,"lv":1,"serv":1,"ing":"비엔나 소시지 100g, 양파 1/2개, 대파 10cm, 케첩 2큰술, 설탕 1작은술, 간장 1작은술, 식용유 1큰술, 후추","steps":["비엔나 소시지는 칼집을 두세 번 넣고 끓는 물에 30초 데쳐 건진다.","양파는 굵게 채 썰고 대파는 어슷 썬다.","달군 팬에 기름을 두르고 소시지를 센 불에 2분 볶아 칼집이 벌어지게 한다.","양파를 넣어 1분 더 볶다가 케첩 2큰술, 설탕 1작은술, 간장 1작은술을 넣고 1분 볶는다.","대파와 후추를 넣고 30초만 더 볶아 불을 끈다."],"tip":"케첩은 마지막에 넣어야 탄맛이 나지 않고 색이 곱게 남는다.","use":{"sausage":100,"arom":10}},{"id":"r_soup_n1","cat":"soup","name":"떡만둣국","tags":["bunsik"],"kcal":670,"pro":22,"min":20,"lv":1,"serv":1,"ing":"떡국떡 150g, 냉동 교자만두 5개, 계란(대란) 1개, 대파 15cm, 물 700ml, 국간장 1큰술, 다진마늘 1작은술, 소금, 후추, 김가루","steps":["떡국떡은 찬물에 10분 담가 두고, 그 사이 냄비에 물 700ml를 올려 끓인다.","물이 끓으면 국간장 1큰술과 다진마늘 1작은술을 넣고 냉동 교자만두를 언 채로 넣어 3분 끓인다.","떡을 넣고 3분 더 끓여 떡이 떠오르면 소금으로 간을 맞춘다.","계란을 풀어 가는 줄기로 두르고 젓지 않은 채 20초 두어 굳힌다.","어슷 썬 대파를 넣고 불을 끈 뒤 김가루와 후추를 올린다."],"tip":"계란을 두른 직후 저으면 국물이 탁해진다. 굳을 때까지 기다렸다 젓는다.","use":{"tteok":150,"dumpling":5,"eggs":1,"arom":15,"seaweed":1}},{"id":"r_soup_n2","cat":"soup","name":"김치수제비","tags":["bunsik"],"kcal":500,"pro":15,"min":30,"lv":2,"serv":1,"ing":"밀가루 100g, 물 50ml, 포기김치 100g, 감자 1개, 대파 10cm, 국물용 멸치 10마리, 물 700ml, 국간장 1큰술, 고춧가루 1작은술, 소금","steps":["밀가루 100g에 물 50ml와 소금 한 꼬집을 넣어 되직하게 반죽하고 비닐에 싸서 15분 둔다.","냄비에 물 700ml와 멸치를 넣고 8분 끓인 뒤 멸치를 건져낸다.","잘게 썬 김치와 얇게 썬 감자를 넣고 5분 끓인다.","반죽을 손으로 얇게 떼어 넣고 3분간 끓여 반죽이 떠오르면 국간장 1큰술과 고춧가루 1작은술로 간한다.","대파를 넣고 1분 더 끓여 불을 끈다."],"tip":"반죽을 15분 쉬게 두면 훨씬 얇게 떼어지고 쫄깃해진다.","use":{"kimchi":100,"potato":1,"arom":10,"anchovy":10}},{"id":"r_rice_n5","cat":"rice","name":"파기름 계란볶음밥","tags":["cn","quick"],"kcal":620,"pro":17,"min":12,"lv":1,"serv":1,"ing":"밥 1공기(210g), 계란(대란) 2개, 대파 1/2대, 마늘 2쪽, 굴소스 1작은술, 간장 1작은술, 식용유 1.5큰술, 소금, 후추","steps":["대파는 송송 썰고 마늘은 얇게 저민다. 밥은 미리 주걱으로 흩어 덩어리를 풀어 둔다.","차가운 팬에 식용유와 대파, 마늘을 함께 넣고 중약불에서 2분간 데워 파가 갈색이 돌 때까지 향을 뽑는다.","불을 세게 올리고 풀어 둔 계란을 부어 반쯤 익었을 때 밥을 얹고 주걱 등으로 눌러 펴며 볶는다.","밥알이 팬 바닥에서 통통 튀기 시작하면 가장자리로 간장을 둘러 태우듯 익히고 굴소스를 넣어 섞는다.","소금과 후추로 간을 맞추고 30초만 더 볶아 불을 끈다."],"tip":"밥은 갓 지은 것보다 식은 밥이 낫고, 화력이 약하면 재료를 반씩 나눠 두 번에 볶아야 물이 안 생긴다.","use":{"rice":210,"eggs":2,"arom":2}},{"id":"r_rice_n6","cat":"rice","name":"교자만두볶음밥","tags":["cn","quick"],"kcal":740,"pro":22,"min":15,"lv":2,"serv":1,"ing":"냉동 교자만두 5개, 밥 1공기(210g), 계란(대란) 1개, 냉동 채소믹스 60g, 대파 1/2대, 굴소스 1작은술, 간장 1작은술, 식용유 1큰술, 후추","steps":["냉동 교자만두는 해동하지 않고 그대로 4등분한다. 냉동 채소믹스는 체에 받쳐 겉의 성에를 털어 낸다.","팬에 식용유를 두르고 중불에서 만두 자른 면을 아래로 놓아 3분간 노릇하게 굽는다.","대파와 채소믹스를 넣고 불을 세게 올려 2분간 볶아 채소의 물기를 날린다.","한쪽으로 재료를 밀어 두고 빈 자리에 계란을 깨 넣어 스크램블처럼 흩은 뒤 밥을 넣는다.","간장을 팬 가장자리에 둘러 넣고 굴소스와 후추로 간해 2분간 고루 볶는다."],"tip":"만두 껍질이 바닥에 붙으면 뒤집지 말고 30초만 더 두면 저절로 떨어진다.","use":{"dumpling":5,"rice":210,"eggs":1,"veg":60,"arom":1}},{"id":"r_rice_n7","cat":"rice","name":"홍소두부덮밥","tags":["cn"],"kcal":600,"pro":19,"min":18,"lv":2,"serv":1,"ing":"부침용 두부 150g, 밥 1공기(210g), 냉동 채소믹스 80g, 대파 1/2대, 마늘 2쪽, 간장 1큰술, 굴소스 1작은술, 설탕 1작은술, 전분 1작은술, 물 100ml, 식용유 1큰술","steps":["두부는 사방 2cm 깍둑으로 썰어 키친타월로 물기를 눌러 뺀다. 전분은 물 3큰술에 미리 풀어 둔다.","팬에 식용유를 두르고 중강불에서 두부를 한 면씩 2분씩 굴려 가며 겉만 단단해지게 지진다.","가장자리에 대파와 마늘을 넣어 향을 낸 뒤 물 100ml, 간장, 굴소스, 설탕을 붓고 냉동 채소믹스를 더한다.","뚜껑을 덮고 중불에서 4분간 끓여 두부에 색이 배게 한다.","불을 줄이고 전분물을 두 번에 나눠 돌려 부어 국물이 걸쭉해지면 밥 위에 얹는다."],"tip":"전분물은 반드시 다시 저어서 넣어야 바닥에 가라앉은 전분이 덩어리로 굳지 않는다.","use":{"tofu":150,"rice":210,"veg":80,"arom":2}},{"id":"r_noodle_n7","cat":"noodle","name":"오징어짬뽕","tags":["cn"],"kcal":760,"pro":40,"min":25,"lv":2,"serv":1,"ing":"냉동 오징어(몸통) 150g, 중화면 150g, 냉동 채소믹스 100g, 양파 1/2개, 대파 1/2대, 마늘 3쪽, 고춧가루 1.5큰술, 간장 1큰술, 식용유 2큰술, 물 600ml, 소금, 후추","steps":["냉동 오징어는 찬물에 10분 담가 해동한 뒤 물기를 닦고 1cm 폭 링으로 썬다.","냄비에 식용유와 대파, 마늘, 고춧가루를 넣고 약불에서 1분간 저어 기름을 붉게 우린다. 고춧가루가 타면 쓴맛이 나니 불을 낮게 유지한다.","양파와 냉동 채소믹스를 넣어 센 불에서 2분간 볶다가 오징어를 넣고 30초만 더 볶는다.","물 600ml와 간장을 붓고 뚜껑 없이 5분간 팔팔 끓여 국물 맛을 낸다.","다른 냄비에 중화면을 포장 시간대로 삶아 찬물에 헹구지 말고 바로 그릇에 담는다.","국물을 소금과 후추로 맞춰 면 위에 부어 낸다."],"tip":"오징어를 국물에 오래 두면 질겨지므로 볶는 단계에서 겉만 익히고 나머지는 끓는 국물의 열로 익힌다.","use":{"squid":150,"udon":150,"veg":100,"arom":4}},{"id":"r_noodle_n8","cat":"noodle","name":"유니짜장면","tags":["cn"],"kcal":900,"pro":33,"min":30,"lv":3,"serv":1,"ing":"한돈 앞다리살(제육용) 100g, 중화면 150g, 감자 1/2개, 양파 1개, 애호박 1/4개, 춘장 2큰술, 설탕 1큰술, 간장 1작은술, 전분 1작은술, 식용유 2큰술, 물 200ml","steps":["앞다리살은 잘게 다지고 감자와 양파, 애호박은 사방 1cm로 썬다. 전분은 물 3큰술에 풀어 둔다.","팬에 식용유 1큰술을 두르고 약불에서 춘장을 2분간 저어 가며 볶아 날내를 뺀 뒤 그릇에 덜어 둔다.","같은 팬에 남은 기름을 두르고 다진 고기를 중강불에서 3분간 볶아 색이 하얗게 변하면 감자를 먼저 넣어 2분 볶는다.","양파와 애호박을 넣고 양파가 투명해질 때까지 3분간 볶은 뒤 덜어 둔 춘장과 설탕, 간장, 물 200ml를 붓는다.","뚜껑을 덮고 중약불에서 7분간 끓여 감자가 포슬해지면 전분물을 돌려 부어 농도를 잡는다.","중화면을 삶아 물기를 털고 그릇에 담아 소스를 끼얹는다."],"tip":"춘장을 따로 볶아 두는 한 단계를 건너뛰면 짠맛만 남고 특유의 구수함이 나오지 않는다.","use":{"pork":100,"udon":150,"potato":1,"arom":1,"veg":1}},{"id":"r_noodle_n9","cat":"noodle","name":"돼지고기당면볶음","tags":["cn"],"kcal":670,"pro":21,"min":20,"lv":2,"serv":1,"ing":"당면 80g, 한돈 앞다리살(제육용) 100g, 냉동 채소믹스 80g, 대파 1/2대, 마늘 2쪽, 간장 2큰술, 굴소스 1작은술, 설탕 1작은술, 참기름 1작은술, 식용유 1큰술, 후추","steps":["당면은 미지근한 물에 15분 담가 흐물해질 때까지 불린 뒤 물기를 뺀다.","앞다리살은 얇게 채 썰어 간장 1작은술과 후추로 밑간해 둔다.","팬에 식용유를 두르고 대파와 마늘을 30초 볶다가 고기를 넣어 중강불에서 3분간 볶는다.","냉동 채소믹스를 넣어 2분간 볶아 물기를 날리고, 불린 당면과 남은 간장, 굴소스, 설탕을 넣는다.","집게로 들었다 놨다 하며 3분간 볶아 당면이 투명해지고 양념이 배면 참기름을 둘러 마무리한다."],"tip":"당면을 삶지 않고 불려서 볶으면 퍼지지 않고 끝까지 쫄깃한 상태로 남는다.","use":{"dangmyeon":80,"pork":100,"veg":80,"arom":2}},{"id":"r_noodle_n10","cat":"noodle","name":"탄탄면","tags":["cn"],"kcal":830,"pro":36,"min":25,"lv":2,"serv":1,"ing":"중화면 150g, 한돈 앞다리살(제육용) 80g, 우유 200ml, 땅콩버터 1큰술, 두반장 1작은술, 간장 1큰술, 청경채 2포기, 대파 1/2대, 마늘 2쪽, 설탕 1작은술, 식용유 1큰술, 후추","steps":["앞다리살은 잘게 다지고 청경채는 밑동을 잘라 반으로 가른다.","팬에 식용유를 두르고 대파, 마늘, 두반장을 약불에서 1분간 볶아 매운 향을 낸 뒤 다진 고기를 넣어 중불에서 4분간 바슬바슬하게 볶는다.","간장과 설탕을 넣어 30초 더 볶아 고기 고명을 완성하고 그릇에 덜어 둔다.","같은 팬에 우유 200ml와 땅콩버터를 넣고 약불에서 저어 완전히 풀어 준 뒤 끓기 직전에 불을 끈다.","중화면을 삶는 마지막 1분에 청경채를 함께 넣어 데치고, 면과 청경채를 그릇에 담아 소스를 붓고 고기 고명을 올린다."],"tip":"우유는 팔팔 끓이면 분리되므로 가장자리에 잔거품이 생기는 정도에서 불을 내린다.","use":{"udon":150,"pork":80,"milk":200,"veg":2,"arom":2}},{"id":"r_noodle_n11","cat":"noodle","name":"채소볶음면","tags":["cn","quick"],"kcal":620,"pro":17,"min":15,"lv":1,"serv":1,"ing":"우동면 1봉 200g, 냉동 채소믹스 120g, 계란(대란) 1개, 대파 1/2대, 마늘 2쪽, 굴소스 1큰술, 간장 1큰술, 설탕 1작은술, 식용유 1.5큰술, 후추","steps":["우동면은 끓는 물에 30초만 데쳐 서로 붙은 가닥을 풀고 체에 받쳐 물기를 뺀다.","팬에 식용유를 두르고 계란을 부쳐 반숙으로 익힌 뒤 접시에 덜어 둔다.","같은 팬에 대파와 마늘을 볶아 향을 내고 냉동 채소믹스를 넣어 센 불에서 3분간 볶아 물기를 날린다.","면을 넣고 굴소스, 간장, 설탕을 둘러 2분간 집게로 들어 올리며 볶아 양념을 입힌다.","후추를 뿌려 그릇에 담고 반숙 계란을 얹는다."],"tip":"면을 넣은 뒤에는 주걱으로 누르지 말고 들어 올리며 섞어야 면이 끊어지지 않는다.","use":{"udon":1,"veg":120,"eggs":1,"arom":2}},{"id":"r_meat_n4","cat":"meat","name":"경장육사","tags":["cn"],"kcal":620,"pro":32,"min":25,"lv":2,"serv":1,"ing":"한돈 앞다리살(제육용) 180g, 대 ), 계란 2개, 양파 1/4개, 쯔유 2큰술, 간장 1큰술, 미림 1큰술, 설탕 1작은술","steps":["손질 민물장어는 껍질 쪽을 아래로 두고 달군 팬에 올려 중불에서 3분, 뒤집어 2분 굽는다.","간장 1큰술·미림 1큰술·설탕 1작은술을 섞어 장어에 끼얹고 약불에서 1분 조려 윤기를 낸 뒤 한입 크기로 썬다.","작은 팬에 쯔유 2큰술과 물 4큰술을 붓고 채 썬 양파를 넣어 2분 끓인다.","풀어둔 계란 2개를 절반만 둘러 붓고 가장자리가 굳으면 나머지를 부은 뒤 불을 끈다.","밥 1공기 위에 계란을 국물째 미끄러뜨려 올리고 장어를 얹는다."],"tip":"계란은 반숙일 때 불을 꺼야 남은 열로 알맞게 굳는다.","use":{"eel":100,"rice":210,"eggs":2,"arom":1}},{"id":"r_rice_n13","cat":"rice","name":"참치즈케동","tags":["jp"],"kcal":470,"pro":30,"min":25,"lv":2,"serv":1,"ing":"참치회(사시미) 100g, 밥 1공기(210g), 대파 5cm, 김가루 한 줌, 간장 1큰술, 미림 1큰술, 참기름 1/2작은술, 통깨 약간","steps":["미림 1큰술을 작은 냄비에 넣고 30초 끓여 알코올을 날린 뒤 간장 1큰술, 물 1큰술과 섞어 식힌다.","참치회는 키친타월로 겉면 물기를 닦고 1cm 두께로 썬다.","절임장에 참치를 담가 냉장고에서 15분 둔다.","밥 1공기에 김가루를 뿌리고 절인 참치를 겹쳐 올린다.","남은 절임장 1작은술과 참기름을 두르고 송송 썬 대파와 통깨를 뿌린다."],"tip":"15분을 넘기면 겉이 단단해지므로 시간을 재서 건진다.","use":{"tunasashimi":100,"rice":210,"arom":5}},{"id":"r_rice_n14","cat":"rice","name":"낫토김치덮밥","tags":["jp","quick"],"kcal":490,"pro":20,"min":8,"lv":1,"serv":1,"ing":"낫토 1팩(50g), 포기김치 60g, 밥 1공기(210g), 계란 1개, 김가루 한 줌, 간장 1작은술, 참기름 1작은술, 식용유 약간","steps":["낫토에 동봉된 소스와 간장 1작은술을 넣고 30초간 힘 있게 저어 실이 나게 한다.","포기김치는 국물을 가볍게 짜고 1cm 크기로 잘게 썬다.","달군 팬에 기름을 조금 두르고 계란을 반숙으로 부친다.","밥 1공기에 김치와 낫토를 나란히 올리고 계란프라이와 김가루를 얹은 뒤 참기름을 두른다."],"tip":"낫토는 소스를 넣기 전에 먼저 저어야 실이 굵게 선다.","use":{"natto":1,"kimchi":60,"rice":210,"eggs":1}},{"id":"r_rice_n15","cat":"rice","name":"연어오차즈케","tags":["jp"],"kcal":520,"pro":26,"min":25,"lv":2,"serv":1,"ing":"냉동 생연어 필렛 100g, 밥 1공기(210g), 녹차 1티백, 김가루 한 줌, 쯔유 1작은술, 소금 약간, 통깨 약간, 식용유 약간","steps":["냉동 생연어 필렛은 봉지째 찬물에 담가 15분 해동하고 물기를 닦은 뒤 소금을 약간 뿌린다.","달군 팬에 기름을 얇게 두르고 연어를 앞뒤로 3분씩 구운 다음 젓가락으로 굵게 부순다.","뜨거운 물 200ml에 녹차 1티백을 1분 우리고 쯔유 1작은술과 소금 약간으로 간한다.","그릇에 밥 1공기를 담고 연어와 김가루, 통깨를 올린 뒤 뜨거운 국물을 가장자리로 붓는다."],"tip":"국물은 먹기 직전에 부어야 밥알이 퍼지지 않는다.","use":{"salmon":100,"rice":210}},{"id":"r_noodle_n12","cat":"noodle","name":"유부우동","tags":["jp"],"kcal":510,"pro":20,"min":22,"lv":2,"serv":1,"ing":"우동면 1봉(200g), 유부 3장, 국물용 멸치 10마리, 계란 1개, 대파 5cm, 쯔유 3큰술, 간장 1작은술","steps":["냄비에 물 500ml와 머리·내장을 뗀 국물용 멸치를 넣고 끓어오르면 중불로 낮춰 7분 우린 뒤 멸치를 건진다.","유부는 끓는 물에 30초 데쳐 기름기를 빼고 물기를 짠 다음 반으로 썬다.","육수에 쯔유 3큰술과 간장 1작은술을 넣어 간하고 유부를 넣어 2분 끓인다.","계란은 끓는 물에 7분 삶아 찬물에 식히고 껍질을 벗겨 반으로 자른다.","우동면을 끓는 물에 1분 데쳐 그릇에 담고 뜨거운 국물과 유부, 계란, 어슷 썬 대파를 올린다."],"tip":"멸치는 머리와 내장을 떼어내야 국물에서 쓴맛이 나지 않는다.","use":{"udon":1,"tofu":3,"anchovy":10,"eggs":1,"arom":5}},{"id":"r_noodle_n13","cat":"noodle","name":"명란버터우동","tags":["jp","quick"],"kcal":450,"pro":17,"min":12,"lv":1,"serv":1,"ing":"우동면 1봉(200g), 명란젓 1덩이(40g), 우유 2큰술, 버터 10g, 대파 5cm, 김가루 한 줌, 쯔유 1작은술","steps":["명란젓은 껍질을 갈라 알만 긁어내고 볼에 담아 버터 10g, 우유 2큰술, 쯔유 1작은술과 섞는다.","우동면을 끓는 물에 1분 30초 데치고 체에 밭쳐 물기를 턴다.","뜨거운 면을 곧바로 볼에 넣고 버터가 다 녹을 때까지 30초간 빠르게 비빈다.","김가루와 송송 썬 대파를 올린다."],"tip":"면의 열로만 명란을 익혀야 알이 딱딱하게 뭉치지 않는다.","use":{"udon":1,"roe":1,"milk":30,"arom":5}},{"id":"r_noodle_n14","cat":"noodle","name":"온메밀국수","tags":["jp"],"kcal":440,"pro":17,"min":25,"lv":2,"serv":1,"ing":"메밀면 100g, 사각어묵 1장, 국물용 멸치 10마리, 대파 5cm, 김가루 한 줌, 쯔유 3큰술, 간장 1작은술","steps":["냄비에 물 500ml와 머리·내장을 뗀 국물용 멸치를 넣고 8분 끓인 뒤 멸치를 건져낸다.","육수에 쯔유 3큰술과 간장 1작은술을 넣고 삼각으로 썬 사각어묵을 넣어 3분 끓인다.","메밀면을 끓는 물에 4분 삶고 찬물에 비벼 씻어 전분기를 없앤다.","씻은 면을 뜨거운 물에 10초 담가 데운 다음 그릇에 담는다.","뜨거운 국물과 어묵을 붓고 어슷 썬 대파와 김가루를 올린다."],"tip":"면을 찬물에 한 번 씻어야 국물이 걸쭉하게 탁해지지 않는다.","use":{"somen":100,"fishcake":1,"anchovy":10,"arom":5}},{"id":"r_noodle_n15","cat":"noodle","name":"쯔유냉소면","tags":["jp","quick"],"kcal":460,"pro":18,"min":15,"lv":1,"serv":1,"ing":"소면 100g, 계란 1개, 무 100g, 대파 5cm, 김가루 한 줌, 쯔유 3큰술, 식용유 약간","steps":["쯔유 3큰술에 찬물 6큰술을 섞어 냉장고에 넣어 차게 둔다.","계란을 풀어 기름 두른 팬에 얇게 부치고 식힌 뒤 가늘게 채 썬다.","무는 강판에 갈아 손으로 가볍게 물기를 짠다.","소면을 끓는 물에 3분 삶고 찬물에 비벼 씻은 다음 얼음물에 30초 담갔다 건진다.","면을 그릇에 담고 계란지단, 간 무, 송송 썬 대파, 김가루를 올린 뒤 차가운 쯔유를 붓는다."],"tip":"면은 삶자마자 찬물에 비벼 씻어야 겉이 미끈거리지 않고 탱탱하다.","use":{"somen":100,"eggs":1,"veg":100,"arom":5}},{"id":"r_noodle_n16","cat":"noodle","name":"고기메밀국수","tags":["jp"],"kcal":640,"pro":32,"min":27,"lv":2,"serv":1,"ing":"메밀면 100g, 미국산 소불고기(척아이롤) 100g, 국물용 멸치 12마리, 대파 8cm, 쯔유 4큰술, 간장 1작은술, 설탕 1/2작은술, 식용유 약간","steps":["냄비에 물 600ml와 머리·내장을 뗀 국물용 멸치를 넣고 8분 끓인 뒤 건져내고 쯔유 4큰술로 간한다.","미국산 소불고기는 한입 크기로 썰어 간장 1작은술과 설탕 1/2작은술에 5분 재운다.","달군 팬에 기름을 조금 두르고 고기를 펼쳐 센 불에서 2분 볶아 겉면만 익힌다.","메밀면을 끓는 물에 4분 삶아 찬물에 헹구고 뜨거운 물에 데워 그릇에 담는다.","뜨거운 국물을 붓고 볶은 고기와 어슷 썬 대파를 올린다."],"tip":"고기를 국물에 넣고 끓이지 말고 따로 볶아 올려야 국물이 맑다.","use":{"somen":100,"beef":100,"anchovy":12,"arom":8}},{"id":"r_sea_n12","cat":"sea","name":"전복간장조림","tags":["jp","anju"],"kcal":200,"pro":21,"min":20,"lv":2,"serv":1,"ing":"손질 전복 4마리(160g), 마늘 2쪽, 대파 5cm, 간장 2큰술, 미림 2큰술, 설탕 1작은술, 생강 1쪽","steps":["손질 전복은 솔로 문질러 씻고 살 표면에 격자로 얕게 칼집을 넣는다.","냄비에 물 100ml, 간장 2큰술, 미림 2큰술, 설탕 1작은술과 편 썬 마늘·생강을 넣고 끓인다.","끓어오르면 전복을 넣고 뚜껑을 덮어 중약불에서 8분 조린다.","뚜껑을 열고 국물이 절반으로 줄 때까지 3분간 숟가락으로 국물을 끼얹으며 조린다.","한 김 식힌 뒤 도톰하게 썰어 담고 어슷 썬 대파를 올린다."],"tip":"센 불에 오래 끓이면 질겨지므로 국물을 끼얹으며 짧게 조린다.","use":{"abalone":4,"arom":8}},{"id":"r_sea_n13","cat":"sea","name":"흰살생선조림","tags":["jp"],"kcal":260,"pro":31,"min":27,"lv":2,"serv":1,"ing":"흰살생선(대구·동태) 150g, 무 120g, 두부 1/4모(75g), 대파 8cm, 생강 1쪽, 간장 2큰술, 미림 2큰술, 설탕 1작은술","steps":["흰살생선에 소금을 약간 뿌려 5분 두었다가 배어 나온 물기를 닦아낸다.","무는 1cm 두께 반달로, 두부는 도톰하게 썬다.","냄비에 물 200ml, 간장 2큰술, 미림 2큰술, 설탕 1작은술과 채 썬 생강을 넣고 끓인 뒤 무를 넣어 7분 익힌다.","생선과 두부를 나란히 올리고 뚜껑을 덮어 중약불에서 8분 조린다.","국물을 몇 차례 끼얹고 어슷 썬 대파를 올려 1분 더 끓인다."],"tip":"생선은 넣은 뒤 뒤집지 말고 국물만 끼얹어야 살이 부서지지 않는다.","use":{"whitefish":150,"veg":120,"tofu":1,"arom":9}},{"id":"r_sea_n14","cat":"sea","name":"연어소금구이","tags":["jp","diet"],"kcal":330,"pro":30,"min":30,"lv":2,"serv":1,"ing":"냉동 생연어 필렛 150g, 무 100g, 양파 1/4개, 소금 1/4작은술, 레몬즙 1작은술, 간장 약간, 식용유 약간","steps":["냉동 생연어 필렛을 찬물에 담가 20분 해동하고 물기를 완전히 닦아낸다.","양면에 소금 1/4작은술을 고루 뿌려 5분 두었다가 다시 물기를 닦는다.","달군 팬에 기름을 얇게 두르고 껍질 쪽부터 중불에서 4분, 뒤집어 3분 굽는다.","연어를 꺼낸 팬에 채 썬 양파를 넣고 2분 볶아 곁들인다.","무를 강판에 갈아 물기를 짜서 올리고 간장 몇 방울과 레몬즙을 뿌린다."],"tip":"굽기 전에 물기를 완전히 닦아야 껍질이 팬에 붙지 않고 바삭해진다.","use":{"salmon":150,"veg":100,"arom":1}},{"id":"r_sea_n15","cat":"sea","name":"문어미역초무침","tags":["jp","anju"],"kcal":135,"pro":17,"min":22,"lv":1,"serv":1," ame":"잡채","tags":["kr"],"kcal":405,"pro":13,"min":45,"lv":3,"serv":3,"ing":"당면 150g, 한우 불고기용 150g, 시금치 100g, 양파 1개, 당근 1/2개, 표고버섯 3개, 간장 4큰술, 설탕 2큰술, 참기름 2큰술, 다진마늘 1작은술, 식용유, 통깨","steps":["당면은 미지근한 물에 30분 불리고, 고기는 간장 1큰술과 설탕 1작은술, 다진마늘에 재운다.","시금치는 끓는 물에 20초 데쳐 찬물에 헹궈 물기를 짜고 참기름과 소금으로 밑간한다.","팬에 기름을 조금씩 두르고 양파, 당근, 표고를 따로따로 볶아 각각 덜어 둔다.","같은 팬에 재운 고기를 볶아 익히고, 끓는 물에 당면을 5분 삶아 건진다.","뜨거운 당면에 남은 간장과 설탕을 넣어 먼저 색과 간을 들인다.","볶은 재료와 시금치를 모두 넣고 참기름, 통깨를 넣어 손으로 가볍게 버무린다."],"tip":"채소를 한꺼번에 볶으면 물이 생겨 색이 죽으니 반드시 따로 볶아 덜어 둔다.","use":{"dangmyeon":150,"hanwoo":150,"veg":103,"arom":1}},{"id":"r_side_n19","cat":"side","name":"명란계란말이","tags":["kr","lunch"],"kcal":340,"pro":26,"min":15,"lv":1,"serv":1,"ing":"계란(대란) 3개, 명란 1개(40g), 대파 1/4대, 맛술 1작은술, 소금 약간, 식용유 1큰술","steps":["계란을 풀어 맛술과 소금을 넣고 체에 한 번 걸러 알끈을 없앤 뒤 잘게 썬 대파를 섞는다.","명란은 껍질을 갈라 알만 긁어낸다.","약불로 달군 사각 팬에 기름을 얇게 두르고 계란물 3분의 1을 부어 반쯤 익으면 가운데에 명란을 한 줄 올린다.","명란을 감싸며 한쪽으로 말고, 빈자리에 남은 계란물을 부어 이어 말기를 두 번 반복한다.","말이를 꺼내 1분 식힌 뒤 2cm 두께로 썬다."],"tip":"불이 세면 겉이 먼저 굳어 갈라지므로 계속 약불을 유지한다.","use":{"eggs":3,"roe":1,"arom":1}},{"id":"r_side_n20","cat":"side","name":"두부전","tags":["kr"],"kcal":300,"pro":18,"min":20,"lv":1,"serv":2,"ing":"두부(부침·찌개) 1모(300g), 계란(대란) 1개, 부침가루 3큰술, 소금 약간, 식용유 2큰술, 간장 1큰술, 다진 대파 조금","steps":["두부는 1cm 두께로 썰어 키친타월에 10분 올려 물기를 빼고 양면에 소금을 뿌린다.","두부에 부침가루를 얇게 묻히고 풀어둔 계란물에 담갔다 뺀다.","중불로 달군 팬에 기름을 두르고 한 면씩 3분, 노릇해질 때까지 지진다.","간장에 다진 대파를 섞은 양념장을 곁들인다."],"tip":"물기를 충분히 빼야 계란옷이 벗겨지지 않고 기름이 튀지 않는다.","use":{"tofu":1,"eggs":1,"arom":1}},{"id":"r_side_n21","cat":"side","name":"볶음김치","tags":["kr","quick"],"kcal":270,"pro":8,"min":15,"lv":1,"serv":2,"ing":"포기김치 300g, 삼겹살(구이용) 100g, 양파 1/4개, 설탕 1작은술, 들기름 1큰술, 참기름 1작은술, 통깨","steps":["김치는 속을 털어내고 3cm 폭으로 썰고 삼겹살은 잘게 썬다.","팬에 들기름을 두르고 삼겹살을 넣어 기름이 나올 때까지 3분 볶는다.","김치와 채 썬 양파를 넣고 중불에서 7분, 김치가 부드러워지고 색이 짙어질 때까지 볶는다.","설탕을 넣어 신맛을 잡고 불을 끈 뒤 참기름과 통깨를 뿌린다."],"tip":"신 김치일수록 설탕을 조금 더 넣고 오래 볶아야 맛이 둥글어진다.","use":{"kimchi":300,"porkbelly":100,"arom":1}},{"id":"r_sea_n16","cat":"sea","name":"고등어김치조림"," 음, 윗면이 반쯤 익으면 또띠아를 그대로 덮어 가볍게 누른다.","1분 뒤 뒤집어 또띠아 면을 굽고 치즈를 뿌려 녹으면 반으로 접어 반달 모양으로 자른다."],"tip":"계란이 완전히 익기 전에 또띠아를 덮어야 둘이 한 장처럼 달라붙는다.","use":{"tortilla":1,"eggs":2,"veg":60,"cheese":30}},{"id":"r_brunch_n6","cat":"brunch","name":"햄치즈롤토스트","tags":["quick","west"],"kcal":430,"pro":24,"min":10,"lv":1,"serv":1,"ing":"식빵 2장, 슬라이스햄 2장, 모짜렐라 슈레드 30g, 계란(대란) 1개, 버터 5g","steps":["식빵은 테두리를 잘라내고 컵 바닥이나 밀대로 눌러 얇고 납작하게 편다.","식빵 한 장마다 슬라이스햄과 모짜렐라 슈레드를 올리고 끝에서부터 단단히 만다.","풀어둔 계란물에 롤을 굴려 겉면에 고루 입힌다.","버터를 녹인 팬에 이음매가 바닥으로 가게 올리고 중약불에서 굴려가며 4분간 노릇하게 굽는다."],"tip":"이음매 쪽을 먼저 지져 붙여야 굽는 동안 풀리지 않는다.","use":{"bread":2,"ham":2,"cheese":30,"eggs":1}},{"id":"r_brunch_n7","cat":"brunch","name":"참치오픈토스트","tags":["quick","west"],"kcal":460,"pro":34,"min":10,"lv":1,"serv":1,"ing":"식빵 2장, 참치캔 1개(85g), 양파 1/4개, 모짜렐라 슈레드 40g, 마요네즈 1큰술","steps":["참치캔은 기름을 따라내고 양파는 잘게 다져 찬물에 30초 헹군 뒤 물기를 꼭 짠다.","참치와 양파에 마요네즈와 후추를 넣고 고루 섞는다.","식빵 위에 참치 소를 도톰하게 펴 올리고 모짜렐라 슈레드로 덮는다.","에어프라이어 180도에서 6분 구워 치즈가 녹고 가장자리가 갈색으로 서면 꺼낸다."],"tip":"양파 물기를 짜지 않으면 빵 밑이 젖으니 반드시 눌러 짜고 섞는다.","use":{"bread":2,"tuna":1,"arom":1,"cheese":40}},{"id":"r_brunch_n8","cat":"brunch","name":"블루베리오트밀","tags":["quick","diet"],"kcal":370,"pro":13,"min":5,"lv":1,"serv":1,"ing":"퀵오트밀 40g, 우유 200ml, 냉동 블루베리 50g, 바나나 1/2개, 꿀 1작은술","steps":["깊은 그릇에 퀵오트밀과 우유를 넣고 가볍게 젓는다.","전자레인지에 뚜껑 없이 1분 30초 돌린 뒤 꺼내 한 번 저어 다시 30초 돌린다.","냉동 블루베리를 그대로 올리고 30초간 두어 살짝 녹인다.","얇게 썬 바나나를 얹고 꿀을 둘러 마무리한다."],"tip":"그릇이 얕으면 우유가 끓어 넘치니 용량의 절반만 채우는 깊은 그릇을 쓴다.","use":{"oats":40,"milk":200,"blueberry":50,"banana":1}},{"id":"r_brunch_n9","cat":"brunch","name":"바나나오트팬케이크","tags":["quick","sweet"],"kcal":385,"pro":14,"min":10,"lv":1,"serv":1,"ing":"퀵오트밀 40g, 바나나 1개, 계란(대란) 1개, 우유 50ml, 식용유 1작은술","steps":["바나나를 그릇에 넣고 포크로 덩어리가 없어질 때까지 으깬다.","계란과 우유, 퀵오트밀을 넣어 섞은 뒤 3분간 그대로 두어 오트밀이 수분을 머금게 한다.","기름을 얇게 두른 팬을 중약불로 달구고 반죽을 한 국자씩 올려 지름 8cm로 편다.","표면에 기포가 고루 올라오면 뒤집어 2분 더 구워 속까지 익힌다."],"tip":"반죽을 바로 구우면 퍼지므로 3분 불리는 시간을 건너뛰지 않는다.","use":{"oats":40,"banana":1,"eggs":1,"milk":50}},{"id":"r_noodle_n17","cat":"noodle","name":"치즈라면","tags":["quick","bunsik"],"kcal":850,"pro":30,"min":8,"lv":1,"serv":1,"ing":"라면 1개, 모짜렐라 슈레드 50g, 런천미트 60g, 대파 10cm, 물 500ml","steps":["런천미트는 사방 1cm로 깍둑썰고 대파는 송송 썬다.","냄비에 물 500ml를 끓이고 스프와 런천미트를 먼저 넣어 1분간 끓인다.","면을 넣고 3분간 끓이다가 대파를 넣는다.","불을 끄고 모짜렐라 슈레드를 면 위에 소복이 올린 뒤 뚜껑을 덮어 1분간 녹인다."],"tip":"치즈는 불을 끈 뒤에 올려야 국물이 텁텁해지지 않고 실처럼 늘어난다.","use":{"ramyeon":1,"cheese":50,"spam":60,"arom":10}},{"id":"r_noodle_n18","cat":"noodle","name":"콩나물라면","tags":["quick","bunsik"],"kcal":600,"pro":20,"min":8,"lv":1,"serv":1,"ing":"라면 1개, 콩나물 100g, 계란(대란) 1개, 대파 10cm, 물 500ml","steps":["냄비에 물 500ml를 붓고 센 불에서 끓인다.","물이 끓으면 스프와 콩나물을 함께 넣고 뚜껑을 열어 둔 채 2분간 끓인다.","면을 넣고 3분간 끓이다가 계란을 깨 넣고 젓지 않은 채 1분간 그대로 둔다.","송송 썬 대파를 올리고 불을 끈다."],"tip":"콩나물은 넣은 뒤 뚜껑을 여닫으면 비린내가 나니 처음부터 열어 둔 채 끓인다.","use":{"ramyeon":1,"beansprout":100,"eggs":1,"arom":10}},{"id":"r_noodle_n19","cat":"noodle","name":"어묵계란우동","tags":["quick","jp"],"kcal":470,"pro":20,"min":10,"lv":1,"serv":1,"ing":"우동면 1개, 사각어묵 2장, 계란(대란) 1개, 대파 10cm, 쯔유 3큰술","steps":["사각어묵은 1cm 폭으로 길게 썰고 대파는 어슷 썬다.","냄비에 물 500ml와 쯔유를 넣고 끓으면 어묵을 넣어 2분간 끓인다.","우동면을 넣고 3분간 더 끓인다.","계란을 깨 넣고 뚜껑을 덮어 1분간 두어 반숙으로 익힌 뒤 대파를 올린다."],"tip":"국물 간은 어묵에서 짠맛이 우러난 뒤에 보고 쯔유를 더한다.","use":{"udon":1,"fishcake":2,"eggs":1,"arom":10}},{"id":"r_noodle_n20","cat":"noodle","name":"낫토비빔우동","tags":["quick","jp"],"kcal":510,"pro":22,"min":10,"lv":1,"serv":1,"ing":"우동면 1개, 낫토 1개, 계란(대란) 1개, 대파 5cm, 쯔유 2큰술","steps":["끓는 물에 우동면을 넣고 3분간 삶은 뒤 찬물에 헹궈 물기를 뺀다.","낫토에 동봉 소스를 넣고 젓가락으로 서른 번쯤 저어 끈기를 낸다.","달군 팬에 계란을 반숙 프라이로 부친다.","그릇에 면을 담고 쯔유를 두른 뒤 낫토와 계란을 올리고 송송 썬 대파를 뿌린다."],"tip":"면을 찬물에 확실히 헹궈 겉의 전분을 씻어야 낫토와 섞을 때 늘어지지 않는다.","use":{"udon":1,"natto":1,"eggs":1,"arom":5}},{"id":"r_side_n28","cat":"side","name":"만두채소볶음","tags":["quick","cn"],"kcal":470,"pro":14,"min":10,"lv":1,"serv":1,"ing":"냉동 교자만두 6개, 냉동 채소믹스 100g, 대파 10cm, 굴소스 1큰술, 식용유 1큰술","steps":["팬에 식용유를 두르고 냉동 교자만두를 언 채로 올려 중약불에서 3분간 바닥이 노릇해지게 굽는다.","물 3큰술을 붓고 뚜껑을 덮어 3분간 쪄서 속까지 익힌다.","뚜껑을 열고 냉동 채소믹스를 넣어 센 불에서 2분간 볶
